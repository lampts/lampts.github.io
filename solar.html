<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            position: relative;
            height: 100vh;
        }

        /* Starfield background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Solar system container */
        .solar-system {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90vmin;
            height: 90vmin;
            z-index: 5;
        }

        /* Central Sun */
        .sun {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80px;
            height: 80px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #ffd700, #ff8c00, #ff4500);
            border-radius: 50%;
            box-shadow: 0 0 50px #ff8c00, 0 0 100px #ff4500;
            cursor: pointer;
            z-index: 10;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        /* Orbit paths */
        .orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: rotateOrbit linear infinite;
            pointer-events: none; /* <<< FIXED: Added this line */
        }

        @keyframes rotateOrbit {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Planets */
        .planet-container {
            position: absolute;
            top: 50%;
            left: 50%;
            animation: orbit linear infinite;
            pointer-events: none; /* This is correct: container is not interactive */
        }

        @keyframes orbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.3s ease;
            pointer-events: all; /* This is correct: planet itself is interactive */
            z-index: 10; /* Local z-index within its container's stacking context */
        }

        .planet:hover {
            transform: scale(1.2);
            z-index: 11; /* Ensure hover is visually on top */
        }

        /* Individual planet styles and orbits */
        .mercury-orbit {
            width: 120px;
            height: 120px;
        }

        .mercury-container {
            animation-duration: 4s;
        }

        .mercury {
            width: 12px;
            height: 12px;
            background: radial-gradient(circle at 30% 30%, #b0b0b0, #808080, #505050);
            top: -6px;
            left: 54px;
        }

        .venus-orbit {
            width: 180px;
            height: 180px;
        }

        .venus-container {
            animation-duration: 7s;
        }

        .venus {
            width: 20px;
            height: 20px;
            background: radial-gradient(circle at 30% 30%, #ffd700, #ff8c00, #8b4513);
            top: -10px;
            left: 80px;
        }

        .earth-orbit {
            width: 260px;
            height: 260px;
        }

        .earth-container {
            animation-duration: 10s;
        }

        .earth {
            width: 22px;
            height: 22px;
            background: radial-gradient(circle at 30% 30%, #4169e1, #228b22, #0000cd);
            top: -11px;
            left: 119px;
        }

        .mars-orbit {
            width: 340px;
            height: 340px;
        }

        .mars-container {
            animation-duration: 15s;
        }

        .mars {
            width: 16px;
            height: 16px;
            background: radial-gradient(circle at 30% 30%, #cd5c5c, #8b0000, #550000);
            top: -8px;
            left: 162px;
        }

        .jupiter-orbit {
            width: 480px;
            height: 480px;
        }

        .jupiter-container {
            animation-duration: 25s;
        }

        .jupiter {
            width: 48px;
            height: 48px;
            background: linear-gradient(0deg, #daa520, #cd853f, #8b4513, #cd853f, #daa520);
            top: -24px;
            left: 216px;
        }

        .saturn-orbit {
            width: 600px;
            height: 600px;
        }

        .saturn-container {
            animation-duration: 35s;
        }

        .saturn {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, #f4a460, #daa520, #cd853f);
            top: -20px;
            left: 280px;
        }

        .saturn::after {
            content: '';
            position: absolute;
            width: 60px;
            height: 8px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.5), rgba(218, 165, 32, 0.7), rgba(255, 215, 0, 0.5), transparent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(60deg);
            border-radius: 50%;
        }

        .uranus-orbit {
            width: 700px;
            height: 700px;
        }

        .uranus-container {
            animation-duration: 45s;
        }

        .uranus {
            width: 28px;
            height: 28px;
            background: radial-gradient(circle at 30% 30%, #40e0d0, #20b2aa, #008b8b);
            top: -14px;
            left: 336px;
        }

        .neptune-orbit {
            width: 800px;
            height: 800px;
        }

        .neptune-container {
            animation-duration: 60s;
        }

        .neptune {
            width: 26px;
            height: 26px;
            background: radial-gradient(circle at 30% 30%, #4169e1, #0000cd, #00008b);
            top: -13px;
            left: 387px;
        }

        /* Info panel */
        .info-panel {
            position: fixed;
            right: -400px;
            top: 0;
            width: 400px;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border-left: 2px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            transition: right 0.3s ease;
            z-index: 20;
            overflow-y: auto;
        }

        .info-panel.active {
            right: 0;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        .close-btn::before,
        .close-btn::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 2px;
            background: white;
        }

        .close-btn::before {
            transform: rotate(45deg);
        }

        .close-btn::after {
            transform: rotate(-45deg);
        }

        .planet-details h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #fff, #ccc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .planet-details p {
            margin-bottom: 30px;
            line-height: 1.6;
            color: #ccc;
        }

        .stats {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-5px);
        }

        .stat-card h3 {
            color: #e94560;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .stat-card p {
            margin: 0;
            font-size: 1.1em;
        }

        /* Controls */
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 15;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 30px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .control-btn.active {
            background: rgba(233, 69, 96, 0.5);
            border-color: #e94560;
        }

        /* Instructions */
        .instructions {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 300px;
            z-index: 15;
        }

        .instructions h3 {
            margin-bottom: 10px;
            color: #e94560;
        }

        .instructions p {
            font-size: 0.9em;
            line-height: 1.5;
            color: #ccc;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .info-panel {
                width: 100%;
                right: -100%;
            }
            
            .solar-system {
                width: 95vmin;
                height: 95vmin;
            }
            
            .instructions {
                display: none;
            }
            
            .controls {
                bottom: 10px;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="starfield"></div>
    
    <div class="instructions">
        <h3>How to Explore</h3>
        <p>Click on any planet or the Sun to view detailed information. Use the controls below to pause animations or adjust speed.</p>
    </div>
    
    <div class="solar-system" id="solarSystem">
        <div class="sun" onclick="showInfo('sun')"></div>
        
        <div class="orbit mercury-orbit"></div>
        <div class="planet-container mercury-container">
            <div class="planet mercury" onclick="showInfo('mercury')"></div>
        </div>
        
        <div class="orbit venus-orbit"></div>
        <div class="planet-container venus-container">
            <div class="planet venus" onclick="showInfo('venus')"></div>
        </div>
        
        <div class="orbit earth-orbit"></div>
        <div class="planet-container earth-container">
            <div class="planet earth" onclick="showInfo('earth')"></div>
        </div>
        
        <div class="orbit mars-orbit"></div>
        <div class="planet-container mars-container">
            <div class="planet mars" onclick="showInfo('mars')"></div>
        </div>
        
        <div class="orbit jupiter-orbit"></div>
        <div class="planet-container jupiter-container">
            <div class="planet jupiter" onclick="showInfo('jupiter')"></div>
        </div>
        
        <div class="orbit saturn-orbit"></div>
        <div class="planet-container saturn-container">
            <div class="planet saturn" onclick="showInfo('saturn')"></div>
        </div>
        
        <div class="orbit uranus-orbit"></div>
        <div class="planet-container uranus-container">
            <div class="planet uranus" onclick="showInfo('uranus')"></div>
        </div>
        
        <div class="orbit neptune-orbit"></div>
        <div class="planet-container neptune-container">
            <div class="planet neptune" onclick="showInfo('neptune')"></div>
        </div>
    </div>
    
    <div class="info-panel" id="infoPanel">
        <div class="close-btn" onclick="closeInfo()"></div>
        <div class="planet-details" id="planetDetails"></div>
    </div>
    
    <div class="controls">
        <button class="control-btn" onclick="toggleAnimation()">Pause</button>
        <button class="control-btn" onclick="changeSpeed('slow')">Slow</button>
        <button class="control-btn active" onclick="changeSpeed('normal')">Normal</button>
        <button class="control-btn" onclick="changeSpeed('fast')">Fast</button>
    </div>

    <script>
        // Planet data
        const planetData = {
            sun: {
                name: "The Sun",
                description: "The star at the center of our solar system, a hot ball of glowing gases that provides light and heat to all the planets.",
                stats: [
                    { label: "Diameter", value: "1,391,000 km" },
                    { label: "Temperature", value: "Surface: 5,500°C<br>Core: 15,000,000°C" },
                    { label: "Composition", value: "73% Hydrogen<br>25% Helium" },
                    { label: "Age", value: "4.6 billion years" }
                ]
            },
            mercury: {
                name: "Mercury",
                description: "The smallest planet in our solar system and the closest to the Sun. Its surface is covered with craters.",
                stats: [
                    { label: "Diameter", value: "4,879 km" },
                    { label: "Orbital Period", value: "88 Earth days" },
                    { label: "Distance from Sun", value: "57.9 million km" },
                    { label: "Moons", value: "0" }
                ]
            },
            venus: {
                name: "Venus",
                description: "The hottest planet in our solar system, with a thick, toxic atmosphere that traps heat.",
                stats: [
                    { label: "Diameter", value: "12,104 km" },
                    { label: "Orbital Period", value: "225 Earth days" },
                    { label: "Distance from Sun", value: "108.2 million km" },
                    { label: "Surface Temperature", value: "462°C" }
                ]
            },
            earth: {
                name: "Earth",
                description: "Our home planet, the only known planet to harbor life, with liquid water covering 71% of its surface.",
                stats: [
                    { label: "Diameter", value: "12,756 km" },
                    { label: "Orbital Period", value: "365.25 days" },
                    { label: "Distance from Sun", value: "149.6 million km" },
                    { label: "Moons", value: "1 (The Moon)" }
                ]
            },
            mars: {
                name: "Mars",
                description: "The 'Red Planet' known for its rusty color caused by iron oxide on its surface.",
                stats: [
                    { label: "Diameter", value: "6,792 km" },
                    { label: "Orbital Period", value: "687 Earth days" },
                    { label: "Distance from Sun", value: "227.9 million km" },
                    { label: "Moons", value: "2 (Phobos & Deimos)" }
                ]
            },
            jupiter: {
                name: "Jupiter",
                description: "The largest planet in our solar system, a gas giant with a Great Red Spot storm larger than Earth.",
                stats: [
                    { label: "Diameter", value: "142,984 km" },
                    { label: "Orbital Period", value: "11.86 Earth years" },
                    { label: "Distance from Sun", value: "778.5 million km" },
                    { label: "Known Moons", value: "95" }
                ]
            },
            saturn: {
                name: "Saturn",
                description: "Famous for its spectacular ring system made of ice and rock particles.",
                stats: [
                    { label: "Diameter", value: "120,536 km" },
                    { label: "Orbital Period", value: "29.46 Earth years" },
                    { label: "Distance from Sun", value: "1.43 billion km" },
                    { label: "Known Moons", value: "146" }
                ]
            },
            uranus: {
                name: "Uranus",
                description: "An ice giant tilted on its side, rotating at nearly 90 degrees from its orbital plane.",
                stats: [
                    { label: "Diameter", value: "51,118 km" },
                    { label: "Orbital Period", value: "84 Earth years" },
                    { label: "Distance from Sun", value: "2.87 billion km" },
                    { label: "Known Moons", value: "28" }
                ]
            },
            neptune: {
                name: "Neptune",
                description: "The windiest planet with storms reaching speeds of up to 1,200 mph, appearing deep blue due to methane in its atmosphere.",
                stats: [
                    { label: "Diameter", value: "49,528 km" },
                    { label: "Orbital Period", value: "164.8 Earth years" },
                    { label: "Distance from Sun", value: "4.5 billion km" },
                    { label: "Known Moons", value: "16" }
                ]
            }
        };

        let animationPaused = false;
        let currentSpeed = 'normal';

        // Create starfield
        function createStars() {
            const starfield = document.getElementById('starfield');
            const numberOfStars = 200;
            
            for (let i = 0; i < numberOfStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.opacity = Math.random() * 0.8 + 0.2;
                
                if (Math.random() > 0.8) {
                    star.style.width = '3px';
                    star.style.height = '3px';
                }
                
                starfield.appendChild(star);
            }
        }

        // Show planet info
        function showInfo(planet) {
            const info = planetData[planet];
            const detailsDiv = document.getElementById('planetDetails');
            
            let statsHTML = '';
            info.stats.forEach(stat => {
                statsHTML += `
                    <div class="stat-card">
                        <h3>${stat.label}</h3>
                        <p>${stat.value}</p>
                    </div>
                `;
            });
            
            detailsDiv.innerHTML = `
                <h2>${info.name}</h2>
                <p>${info.description}</p>
                <div class="stats">${statsHTML}</div>
            `;
            
            document.getElementById('infoPanel').classList.add('active');
        }

        // Close info panel
        function closeInfo() {
            document.getElementById('infoPanel').classList.remove('active');
        }

        // Toggle animation
        function toggleAnimation() {
            const containers = document.querySelectorAll('.planet-container');
            const btn = event.target; // Assuming event is globally available or passed; safer to pass event explicitly
            
            if (animationPaused) {
                containers.forEach(container => {
                    container.style.animationPlayState = 'running';
                });
                btn.textContent = 'Pause';
                animationPaused = false;
            } else {
                containers.forEach(container => {
                    container.style.animationPlayState = 'paused';
                });
                btn.textContent = 'Play';
                animationPaused = true;
            }
        }

        // Change animation speed
        function changeSpeed(speed, clickedButton) { // Pass event.target as clickedButton
            const containers = document.querySelectorAll('.planet-container');
            const speedMultipliers = {
                slow: 2,    // Base duration * 2 = slower
                normal: 1,  // Base duration * 1 = normal
                fast: 0.5   // Base duration * 0.5 = faster
            };

            // Store base durations if not already stored
            if (!containers[0].dataset.baseDuration) {
                containers.forEach(container => {
                    // Get the initial computed animation duration string (e.g., "10s")
                    const durationString = window.getComputedStyle(container).animationDuration;
                    // Convert to float (e.g., 10)
                    container.dataset.baseDuration = parseFloat(durationString);
                });
            }
            
            // Update button states
            document.querySelectorAll('.controls .control-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            if (clickedButton) { // Check if clickedButton is provided
                 clickedButton.classList.add('active');
            } else { // Fallback for direct calls if any (though not typical for UI)
                // Try to find button by speed data attribute or text if necessary
                const targetButton = Array.from(document.querySelectorAll('.controls .control-btn')).find(b => b.textContent.toLowerCase() === speed);
                if(targetButton) targetButton.classList.add('active');
            }
            
            // Update animation durations
            containers.forEach(container => {
                const baseDuration = parseFloat(container.dataset.baseDuration);
                const newDuration = baseDuration * speedMultipliers[speed];
                container.style.animationDuration = newDuration + 's';
            });
            
            currentSpeed = speed; // Update currentSpeed for future calculations if any (not used in this simplified logic but good practice)
        }
        
        // Attach event listeners for speed buttons correctly
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.controls .control-btn').forEach(button => {
                if (button.textContent.toLowerCase() === 'pause') {
                    button.onclick = toggleAnimation; // Keep original if event not needed
                } else {
                    const speed = button.textContent.toLowerCase();
                    if (['slow', 'normal', 'fast'].includes(speed)) {
                        button.onclick = function(event) { // Use function to get event
                            changeSpeed(speed, event.target);
                        };
                    }
                }
            });
        });


        // Shooting star effect
        function createShootingStar() {
            const star = document.createElement('div');
            star.style.position = 'fixed';
            star.style.width = '2px';
            star.style.height = '2px';
            star.style.background = 'white';
            star.style.left = Math.random() * window.innerWidth + 'px';
            star.style.top = Math.random() * window.innerHeight / 2 + 'px';
            star.style.boxShadow = '0 0 10px white';
            star.style.zIndex = '1000'; // Ensure it's above most things
            
            document.body.appendChild(star);
            
            let x = parseFloat(star.style.left);
            let y = parseFloat(star.style.top);
            
            const animation = setInterval(() => {
                x += 5; // Speed of shooting star
                y += 2; // Angle of shooting star
                star.style.left = x + 'px';
                star.style.top = y + 'px';
                star.style.opacity = Math.max(0, (window.innerWidth - x) / window.innerWidth); // Fade out
                
                if (x > window.innerWidth || y > window.innerHeight || parseFloat(star.style.opacity) <= 0) {
                    clearInterval(animation);
                    star.remove();
                }
            }, 10); // Animation frame rate
        }

        // Initialize
        window.onload = function() {
            createStars();
            
            // Add shooting stars
            setInterval(() => {
                if (Math.random() > 0.8) { // Chance to create a shooting star
                    createShootingStar();
                }
            }, 3000); // Interval to check for creating shooting stars
            
            // Close info panel on click outside (of panel and solar system elements)
            document.addEventListener('click', function(e) {
                const infoPanel = document.getElementById('infoPanel');
                const solarSystemElements = document.getElementById('solarSystem');
                const controlButtons = document.querySelector('.controls');

                // Check if the click is outside the infoPanel, AND
                // not on any planet/sun (children of solarSystemElements), AND
                // not on a control button
                if (!infoPanel.contains(e.target) && 
                    !solarSystemElements.contains(e.target) && 
                    !controlButtons.contains(e.target) &&
                    infoPanel.classList.contains('active')) {
                    // Only close if the click is not on an element that should open/interact with the panel
                    if (!e.target.closest('.planet') && !e.target.closest('.sun')) {
                         closeInfo();
                    }
                }
            });

            // Initialize active state for the "Normal" speed button
            // and set initial speed without relying on global event
            const normalButton = Array.from(document.querySelectorAll('.controls .control-btn')).find(b => b.textContent.toLowerCase() === 'normal');
            if (normalButton) {
                changeSpeed('normal', normalButton);
            }
        };
    </script>
</body>
</html>
