<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VC31GENS6S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      gtag('config', 'G-VC31GENS6S');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cake LLM Namer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['IBM Plex Mono', 'monospace'],
                        mono: ['IBM Plex Mono', 'monospace'],
                        serif: ['IBM Plex Serif', 'serif'],
                    },
                    colors: {
                        background: '#ffffff',
                        foreground: '#000000',
                        muted: '#666666',
                        accent: '#FBD45B',
                        positive: '#16a34a',
                        negative: '#dc2626',
                    }
                }
            }
        }
    </script>
    <style>
        .shadow-brutal { box-shadow: 3px 3px 0px #000; }
        .result-panel { display: none; }
        .result-panel.show { display: block; }
    </style>
</head>
<body class="bg-background text-foreground font-mono text-sm leading-relaxed">
    <div class="max-w-xl mx-auto px-4 py-8">
        
        <!-- Header -->
        <header class="mb-8">
            <div class="text-[10px] text-muted uppercase tracking-wider mb-2">Cake LLM Naming Tool</div>
            <h1 class="font-serif text-2xl font-semibold mb-2">🍰 Cake Model Namer</h1>
            <p class="text-xs text-muted">Input your model specs → Get the perfect cake codename</p>
        </header>

        <!-- Input Form -->
        <div class="border border-black p-4 mb-6 shadow-brutal">
            <div class="flex justify-between items-center mb-4">
                <span class="font-semibold text-xs">Model Specifications</span>
                <span class="px-1.5 py-0.5 bg-accent text-[10px] border border-black">CONFIG</span>
            </div>

            <!-- Row 1: Base Family + Size -->
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div>
                    <label class="text-[10px] text-muted block mb-1">Base Family</label>
                    <select id="baseFamily" class="w-full border border-gray-300 px-2 py-1.5 text-xs bg-white">
                        <option value="qwen">Qwen (Alibaba)</option>
                        <option value="llama">Llama (Meta)</option>
                        <option value="mistral">Mistral (France)</option>
                        <option value="gemma">Gemma (Google)</option>
                        <option value="gpt-oss">GPT-OSS (OpenAI-derived)</option>
                        <option value="vistral">Vistral/PhoGPT (Vietnam)</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] text-muted block mb-1">Model Size</label>
                    <select id="modelSize" class="w-full border border-gray-300 px-2 py-1.5 text-xs bg-white">
                        <option value="7B">7B</option>
                        <option value="14B">14B</option>
                        <option value="32B">32B</option>
                        <option value="70B">70B</option>
                        <option value="100B+">100B+</option>
                    </select>
                </div>
            </div>

            <!-- Row 2: Architecture + Reasoning -->
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div>
                    <label class="text-[10px] text-muted block mb-1">Architecture</label>
                    <div class="flex gap-4 mt-1">
                        <label class="flex items-center gap-1 text-xs">
                            <input type="radio" name="arch" value="dense" checked class="accent-black"> Dense
                        </label>
                        <label class="flex items-center gap-1 text-xs">
                            <input type="radio" name="arch" value="moe" class="accent-black"> MoE
                        </label>
                    </div>
                </div>
                <div>
                    <label class="text-[10px] text-muted block mb-1">Reasoning Focus</label>
                    <div class="flex gap-4 mt-1">
                        <label class="flex items-center gap-1 text-xs">
                            <input type="radio" name="reasoning" value="yes" class="accent-black"> Yes
                        </label>
                        <label class="flex items-center gap-1 text-xs">
                            <input type="radio" name="reasoning" value="no" checked class="accent-black"> No
                        </label>
                    </div>
                </div>
            </div>

            <!-- Row 3: Context Length -->
            <div class="mb-3">
                <label class="text-[10px] text-muted block mb-1">Context Length</label>
                <select id="contextLength" class="w-full border border-gray-300 px-2 py-1.5 text-xs bg-white">
                    <option value="4K">4K (short)</option>
                    <option value="8K">8K (standard)</option>
                    <option value="32K">32K (long)</option>
                    <option value="128K+">128K+ (ultra)</option>
                </select>
            </div>

            <!-- Row 4: Scores -->
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div>
                    <label class="text-[10px] text-muted block mb-1">General Score: <span id="generalVal">78</span></label>
                    <input type="range" id="generalScore" min="60" max="100" value="78" class="w-full accent-black">
                </div>
                <div>
                    <label class="text-[10px] text-muted block mb-1">Finance Score: <span id="financeVal">75</span></label>
                    <input type="range" id="financeScore" min="60" max="100" value="75" class="w-full accent-black">
                </div>
            </div>

            <button onclick="generateCakeName()" class="w-full border border-black px-3 py-2 text-xs font-medium hover:bg-black hover:text-white transition-colors shadow-brutal">
                🎂 Generate Cake Name
            </button>
        </div>

        <!-- Results Panel -->
        <div class="result-panel" id="results">
            <div class="border border-black p-4 mb-6 shadow-brutal bg-gray-50">
                <div class="text-[10px] font-medium uppercase tracking-wider mb-3">Top 3 Recommendations</div>
                <div id="recommendations"></div>
            </div>

            <!-- Callout -->
            <div class="border-l-2 border-black pl-4 mb-6 py-2 bg-accent/20">
                <p class="text-xs font-semibold">NAME YOUR MODEL. OWN YOUR IDENTITY.</p>
            </div>
        </div>

        <!-- Cake Database Reference -->
        <details class="border border-gray-300 mb-6">
            <summary class="px-3 py-2 text-xs cursor-pointer hover:bg-gray-50">📚 View All 22 Cakes</summary>
            <div class="px-3 py-2 text-[10px] text-muted max-h-64 overflow-y-auto">
                <table class="w-full">
                    <thead>
                        <tr class="border-b border-gray-200">
                            <th class="text-left py-1">Cake</th>
                            <th class="text-left py-1">Origin</th>
                            <th class="text-left py-1">Tier</th>
                        </tr>
                    </thead>
                    <tbody id="cakeTable"></tbody>
                </table>
            </div>
        </details>

        <!-- Footer -->
        <footer class="text-center text-[10px] text-muted pt-4 border-t border-gray-200">
            Cake by VPBank × AI Naming Tool
        </footer>
    </div>

    <script>
        // Cake Database
        const cakes = [
            // French/International
            { name: "Mochi", code: "mochi", origin: "🇯🇵", tier: "entry", size: ["7B"], arch: "dense", reasoning: false, context: ["4K", "8K"], general: [70, 79], finance: [60, 79], tags: ["compact", "asian"], desc: "Nhỏ gọn, dẻo dai, versatile" },
            { name: "Financier", code: "financier", origin: "🇫🇷", tier: "entry", size: ["7B", "14B"], arch: "dense", reasoning: false, context: ["4K", "8K"], general: [70, 79], finance: [75, 85], tags: ["french", "finance"], desc: "Bánh hình thỏi vàng, finance specialist" },
            { name: "Tiramisu", code: "tiramisu", origin: "🇮🇹", tier: "entry", size: ["7B", "14B"], arch: "dense", reasoning: false, context: ["8K", "32K"], general: [76, 82], finance: [70, 80], tags: ["layered"], desc: "Nhiều layer, vị cafe, chưa top 1" },
            { name: "Macaron", code: "macaron", origin: "🇫🇷", tier: "entry", size: ["7B", "14B"], arch: "moe", reasoning: true, context: ["8K", "32K"], general: [78, 85], finance: [70, 82], tags: ["french", "moe"], desc: "Nhỏ tinh tế, expert routing" },
            { name: "Croissant", code: "croissant", origin: "🇫🇷", tier: "mid", size: ["32B"], arch: "dense", reasoning: true, context: ["32K", "128K+"], general: [80, 86], finance: [75, 85], tags: ["french", "layered"], desc: "27 layers bơ, deep reasoning" },
            { name: "Millefeuille", code: "millefeuille", origin: "🇫🇷", tier: "pro", size: ["32B", "70B"], arch: "moe", reasoning: true, context: ["32K", "128K+"], general: [82, 90], finance: [80, 88], tags: ["french", "moe"], desc: "1000 layers = many experts" },
            { name: "Opera", code: "opera", origin: "🇫🇷", tier: "pro", size: ["32B", "70B"], arch: "dense", reasoning: true, context: ["32K", "128K+"], general: [82, 88], finance: [82, 90], tags: ["french", "precision"], desc: "6 layers chính xác, precision engineering" },
            { name: "Cheesecake", code: "cheesecake", origin: "🇺🇸", tier: "mid", size: ["32B"], arch: "dense", reasoning: false, context: ["8K", "32K"], general: [80, 86], finance: [78, 84], tags: ["reliable"], desc: "Rich, solid foundation, crowd pleaser" },
            { name: "Soufflé", code: "souffle", origin: "🇫🇷", tier: "pro", size: ["32B", "70B"], arch: "dense", reasoning: true, context: ["32K", "128K+"], general: [85, 92], finance: [80, 88], tags: ["french", "reasoning"], desc: "Rises với CoT, impressive result" },
            { name: "Baumkuchen", code: "baumkuchen", origin: "🇩🇪", tier: "pro", size: ["70B"], arch: "dense", reasoning: false, context: ["32K", "128K+"], general: [85, 92], finance: [82, 90], tags: ["deep"], desc: "Tree cake, nhiều vòng tuổi" },
            { name: "Crème Brûlée", code: "brulee", origin: "🇫🇷", tier: "flagship", size: ["70B", "100B+"], arch: "dense", reasoning: true, context: ["128K+"], general: [88, 95], finance: [85, 95], tags: ["french", "flagship"], desc: "Hard logic layer + creamy core" },
            { name: "Croquembouche", code: "croquembouche", origin: "🇫🇷", tier: "flagship", size: ["70B", "100B+"], arch: "moe", reasoning: true, context: ["128K+"], general: [90, 100], finance: [88, 98], tags: ["french", "moe", "flagship"], desc: "Tower of experts, masterpiece" },
            
            // Russian
            { name: "Medovik", code: "medovik", origin: "🇷🇺", tier: "pro", size: ["32B", "70B"], arch: "dense", reasoning: false, context: ["32K", "128K+"], general: [82, 90], finance: [80, 88], tags: ["russian", "layered"], desc: "Honey cake, 10-15 layers, patience" },
            { name: "Napoleon", code: "napoleon", origin: "🇷🇺", tier: "flagship", size: ["70B", "100B+"], arch: "moe", reasoning: true, context: ["128K+"], general: [85, 95], finance: [85, 95], tags: ["russian", "moe"], desc: "Chinh phục, expert decomposition" },
            { name: "Ptichye Moloko", code: "ptichye", origin: "🇷🇺", tier: "mid", size: ["14B", "32B"], arch: "dense", reasoning: false, context: ["8K", "32K"], general: [80, 86], finance: [75, 82], tags: ["russian", "creative"], desc: "Bird's milk, rare, light soufflé" },
            { name: "Kartoshka", code: "kartoshka", origin: "🇷🇺", tier: "entry", size: ["7B"], arch: "dense", reasoning: false, context: ["4K", "8K"], general: [75, 82], finance: [70, 78], tags: ["russian", "distilled"], desc: "Cake crumbs = knowledge distillation" },
            { name: "Smetannik", code: "smetannik", origin: "🇷🇺", tier: "mid", size: ["32B"], arch: "dense", reasoning: false, context: ["8K", "32K"], general: [78, 84], finance: [76, 82], tags: ["russian", "reliable"], desc: "Sour cream, reliable workhorse" },
            { name: "Muraveynik", code: "muraveynik", origin: "🇷🇺", tier: "mid", size: ["32B", "70B"], arch: "moe", reasoning: false, context: ["32K", "128K+"], general: [80, 88], finance: [78, 86], tags: ["russian", "moe"], desc: "Anthill, sparse activation" },
            { name: "Praga", code: "praga", origin: "🇷🇺", tier: "mid", size: ["32B"], arch: "dense", reasoning: true, context: ["32K"], general: [84, 88], finance: [82, 88], tags: ["russian", "precision"], desc: "Prague cake, Soviet engineering" },
            
            // Vietnamese
            { name: "Bánh Bò", code: "banhbo", origin: "🇻🇳", tier: "entry", size: ["7B", "14B"], arch: "moe", reasoning: false, context: ["4K", "8K"], general: [75, 82], finance: [70, 78], tags: ["vietnamese", "moe"], desc: "Honeycomb = sparse activation" },
            { name: "Bánh Da Lợn", code: "banhdalon", origin: "🇻🇳", tier: "mid", size: ["14B", "32B"], arch: "dense", reasoning: false, context: ["8K", "32K"], general: [78, 85], finance: [76, 84], tags: ["vietnamese", "multimodal"], desc: "Alternating layers = multi-modal" },
            { name: "Bánh Pía", code: "banhpia", origin: "🇻🇳", tier: "mid", size: ["32B"], arch: "moe", reasoning: false, context: ["32K"], general: [80, 86], finance: [82, 88], tags: ["vietnamese", "moe", "finance"], desc: "Flaky layers + dense core" },
            { name: "Bánh Flan", code: "banhflan", origin: "🇻🇳", tier: "mid", size: ["14B", "32B"], arch: "dense", reasoning: true, context: ["8K", "32K"], general: [80, 86], finance: [78, 84], tags: ["vietnamese", "reasoning"], desc: "Caramel logic + smooth generation" },
            { name: "Bánh Bông Lan", code: "banhbonglan", origin: "🇻🇳", tier: "entry", size: ["7B"], arch: "dense", reasoning: false, context: ["4K", "8K"], general: [70, 78], finance: [68, 76], tags: ["vietnamese", "basic"], desc: "Sponge cake, light foundation" },
            { name: "Bánh Trung Thu", code: "trungthu", origin: "🇻🇳", tier: "flagship", size: ["70B", "100B+"], arch: "dense", reasoning: true, context: ["128K+"], general: [88, 96], finance: [90, 98], tags: ["vietnamese", "flagship", "finance"], desc: "Mooncake, premium, concentrated" },
            { name: "Bánh Chuối", code: "banhchuoi", origin: "🇻🇳", tier: "entry", size: ["7B"], arch: "dense", reasoning: false, context: ["4K", "8K"], general: [75, 80], finance: [72, 78], tags: ["vietnamese", "specialist"], desc: "Banana cake, local specialist" }
        ];

        // Populate cake table
        document.getElementById('cakeTable').innerHTML = cakes.map(c => 
            `<tr class="border-b border-gray-100"><td class="py-1">${c.name}</td><td>${c.origin}</td><td>${c.tier}</td></tr>`
        ).join('');

        // Update slider values
        document.getElementById('generalScore').addEventListener('input', e => {
            document.getElementById('generalVal').textContent = e.target.value;
        });
        document.getElementById('financeScore').addEventListener('input', e => {
            document.getElementById('financeVal').textContent = e.target.value;
        });

        // Scoring function
        function scoreCake(cake, params) {
            let score = 0;
            
            // Size match (25%)
            if (cake.size.includes(params.size)) score += 25;
            else if (cake.size.some(s => Math.abs(sizeToNum(s) - sizeToNum(params.size)) <= 1)) score += 12;
            
            // Architecture match (20%)
            if (cake.arch === params.arch) score += 20;
            
            // Reasoning match (15%)
            if (cake.reasoning === params.reasoning) score += 15;
            else score += 5;
            
            // Context match (10%)
            if (cake.context.includes(params.context)) score += 10;
            else score += 3;
            
            // General score match (15%)
            if (params.general >= cake.general[0] && params.general <= cake.general[1]) score += 15;
            else {
                const dist = Math.min(Math.abs(params.general - cake.general[0]), Math.abs(params.general - cake.general[1]));
                score += Math.max(0, 15 - dist);
            }
            
            // Finance score match (15%)
            if (params.finance >= cake.finance[0] && params.finance <= cake.finance[1]) score += 15;
            else {
                const dist = Math.min(Math.abs(params.finance - cake.finance[0]), Math.abs(params.finance - cake.finance[1]));
                score += Math.max(0, 15 - dist);
            }
            
            // Family bonus
            score *= getFamilyBonus(params.family, cake);
            
            return Math.min(100, Math.round(score));
        }

        function sizeToNum(size) {
            const map = { "7B": 1, "14B": 2, "32B": 3, "70B": 4, "100B+": 5 };
            return map[size] || 0;
        }

        function getFamilyBonus(family, cake) {
            if (family === "qwen" && cake.tags.includes("asian")) return 1.08;
            if (family === "qwen" && cake.tags.includes("vietnamese")) return 1.06;
            if (family === "mistral" && cake.tags.includes("french")) return 1.08;
            if (family === "gemma" && cake.size.includes("7B")) return 1.10;
            if (family === "gemma" && cake.size.includes("14B")) return 1.05;
            if (family === "vistral" && cake.tags.includes("vietnamese")) return 1.12;
            return 1.0;
        }

        function generateCakeName() {
            const params = {
                family: document.getElementById('baseFamily').value,
                size: document.getElementById('modelSize').value,
                arch: document.querySelector('input[name="arch"]:checked').value,
                reasoning: document.querySelector('input[name="reasoning"]:checked').value === "yes",
                context: document.getElementById('contextLength').value,
                general: parseInt(document.getElementById('generalScore').value),
                finance: parseInt(document.getElementById('financeScore').value)
            };

            // Score all cakes
            const scored = cakes.map(cake => ({
                ...cake,
                score: scoreCake(cake, params)
            })).sort((a, b) => b.score - a.score);

            // Get top 3
            const top3 = scored.slice(0, 3);

            // Render results
            const html = top3.map((cake, i) => {
                const codename = `cake-${cake.code}-${params.family}-${params.size.toLowerCase()}`;
                const medal = ["🥇", "🥈", "🥉"][i];
                const barWidth = cake.score;
                
                return `
                    <div class="mb-4 ${i < 2 ? 'pb-4 border-b border-gray-200' : ''}">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="text-lg">${medal}</span>
                                <span class="font-serif font-semibold">${cake.name}</span>
                                <span class="text-muted ml-1">${cake.origin}</span>
                            </div>
                            <span class="px-2 py-0.5 ${cake.score >= 85 ? 'bg-accent' : 'bg-gray-100'} text-[10px] border border-black font-medium">${cake.score}%</span>
                        </div>
                        <code class="text-[10px] bg-white border border-gray-300 px-2 py-1 block mb-2">${codename}</code>
                        <div class="flex items-center gap-2 mb-2">
                            <div class="flex-1 h-2 bg-gray-100 border border-gray-200">
                                <div class="h-full ${cake.score >= 85 ? 'bg-accent' : 'bg-black'}" style="width: ${barWidth}%"></div>
                            </div>
                        </div>
                        <p class="text-[10px] text-muted">→ ${cake.desc}</p>
                    </div>
                `;
            }).join('');

            document.getElementById('recommendations').innerHTML = html;
            document.getElementById('results').classList.add('show');
            
            // Scroll to results
            document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    </script>
</body>
</html>
