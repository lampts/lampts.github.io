                type: "metrics",
                metric: "570 experts surveyed, 485 articles analyzed",
                year: null,
                causal: "Experts trained in specific field with specific rules → homogeneity within disciplines, heterogeneity between disciplines",
                actionable: "Analyze not just what is predicted, but who is saying it and why (vested interests, desired society)."
            },
            {
                article: "Future of Work Experts",
                claim: "Expert beliefs driven by disciplinary 'field frames' and personality",
                quote: "their personalities also translated into competing beliefs about the future of work.",
                evidence: "Policymakers, politicians, union reps, HR managers largely absent in media coverage. Debate dominated by tech entrepreneurs, economists, authors/journalists.",
                type: "counterintuitive",
                metric: "",
                year: null,
                causal: "Embracing uncertainty and competing scenarios → essential to long-term strategic planning",
                actionable: "Determine your personal utopia and dystopia for the future; determine short-, mid-, and long-term actions to move toward desirable scenarios."
            },
            {
                article: "Future of Work Experts",
                claim: "The future of work is not predetermined",
                quote: "the future is not yet set in stone, it is impossible to determine who is right about the future of work. Instead, the future will be whatever we make it.",
                evidence: "Whether AI destroys jobs depends on decisions made by people in coming years. Consensus predictions: upskilling by 2025, partial automation by 2026, mass unemployment by 2050, superintelligence by 2074.",
                type: "metrics",
                metric: "Upskilling: 2025; Automation: 2026; Mass unemployment: 2050; Superintelligence: 2074",
                year: 2025,
                causal: "Decisions made by people in coming years → determines whether AI destroys many jobs or not",
                actionable: ""
            },
            {
                article: "Future of Work Experts",
                claim: "Focus on who is predicting, not just what",
                quote: "from now on, whenever you hear or read something about the future of work, don't just look at what is predicted (and by when), but also who is saying it and why.",
                evidence: "Three groups have fundamentally different worldviews based on training and personality. Missing stakeholders: HR managers, policymakers, union representatives.",
                type: "actionable",
                metric: "",
                year: null,
                causal: "",
                actionable: "Enter public debate around future of work to ensure it unfolds within social and democratic dialogue."
            }
        ];

        let filteredData = [...data];
        let currentView = 'table';

        function renderCards() {
            const container = document.getElementById('cards-container');
            const noResults = document.getElementById('no-results');
            container.innerHTML = '';

            if (filteredData.length === 0) {
                noResults.style.display = 'block';
                return;
            }

            noResults.style.display = 'none';

            filteredData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'group cursor-pointer bg-white border border-black shadow-[3px_3px_0px_#000] hover:shadow-[5px_5px_0px_#000] transition-all relative overflow-hidden';
                
                // Badges HTML
                const badges = getBadgesHTML(item);
                
                // Expand logic via onclick
                card.onclick = (e) => toggleCard(index, card);

                card.innerHTML = `
                    <div class="p-4 relative">
                        <!-- Top Row: Article + Type -->
                        <div class="flex justify-between items-start mb-2 gap-2">
                            <span class="px-1.5 py-0.5 bg-black text-white text-[10px] font-medium uppercase tracking-wide truncate max-w-[60%]">${item.article}</span>
                            <div class="flex gap-1 flex-wrap justify-end">${badges}</div>
                        </div>
                        
                        <!-- Main Content -->
                        <h3 class="font-serif font-bold text-base leading-snug mb-2 pr-6">${item.claim}</h3>
                        
                        ${item.metric ? `
                        <div class="flex items-center gap-2 mt-2">
                            <div class="px-1.5 py-0.5 bg-accent text-black border border-black text-[10px] font-bold">METRIC</div>
                            <span class="text-xs font-semibold">${item.metric}</span>
                        </div>
                        ` : ''}

                        <!-- Expansion Indicator -->
                        <div class="absolute right-4 top-4 text-xs font-bold transition-transform duration-200" id="arrow-${index}">+</div>
                    </div>

                    <!-- Details Panel (Hidden by default) -->
                    <div id="detail-${index}" class="hidden bg-gray-50 border-t border-black p-4 text-xs leading-relaxed space-y-4">
                        <div>
                            <span class="font-bold block mb-1 text-muted uppercase text-[10px]">Quote</span>
                            <p class="italic text-foreground border-l-2 border-accent pl-2">"${item.quote}"</p>
                        </div>
                        
                        ${item.evidence ? `
                        <div>
                            <span class="font-bold block mb-1 text-muted uppercase text-[10px]">Evidence</span>
                            <p>${item.evidence}</p>
                        </div>` : ''}

                        ${item.actionable ? `
                        <div>
                            <span class="font-bold block mb-1 text-muted uppercase text-[10px]">Actionable Insight</span>
                            <p class="font-medium bg-white border border-dashed border-gray-400 p-2">${item.actionable}</p>
                        </div>` : ''}

                        ${item.causal ? `
                        <div>
                            <span class="font-bold block mb-1 text-muted uppercase text-[10px]">Causal Chain</span>
                            <p>🔗 ${item.causal}</p>
                        </div>` : ''}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function getBadgesHTML(item) {
            let html = '';
            if (item.type.includes('metrics')) html += '<span class="text-[10px] text-muted border border-gray-300 px-1">DATA</span>';
            if (item.type.includes('counterintuitive')) html += '<span class="text-[10px] text-muted border border-gray-300 px-1">COUNTER</span>';
            if (item.type.includes('actionable')) html += '<span class="text-[10px] text-muted border border-gray-300 px-1">ACTION</span>';
            if (item.type.includes('causal')) html += '<span class="text-[10px] text-muted border border-gray-300 px-1">CAUSAL</span>';
            return html;
        }

        function toggleCard(index, cardElement) {
            const detail = document.getElementById(`detail-${index}`);
            const arrow = document.getElementById(`arrow-${index}`);
            
            if (detail.classList.contains('hidden')) {
                detail.classList.remove('hidden');
                arrow.innerText = '−';
                // Slight highlight when expanded
                cardElement.classList.add('ring-1', 'ring-black');
            } else {
                detail.classList.add('hidden');
                arrow.innerText = '+';
                cardElement.classList.remove('ring-1', 'ring-black');
            }
        }

        function applyFilters() {
            const search = document.getElementById('search').value.toLowerCase();
            const hasMetrics = document.getElementById('filter-metrics').checked;
            const hasCounterintuitive = document.getElementById('filter-counterintuitive').checked;
            const hasActionable = document.getElementById('filter-actionable').checked;
            const hasCausal = document.getElementById('filter-causal').checked;

            filteredData = data.filter(item => {
                const matchesSearch = !search || 
                    item.claim.toLowerCase().includes(search) ||
                    item.article.toLowerCase().includes(search) ||
                    item.evidence.toLowerCase().includes(search) ||
                    item.metric.toLowerCase().includes(search);

                const matchesType = 
                    (hasMetrics && item.type.includes('metrics')) ||
                    (hasCounterintuitive && item.type.includes('counterintuitive')) ||
                    (hasActionable && item.type.includes('actionable')) ||
                    (hasCausal && item.type.includes('causal'));

                return matchesSearch && matchesType;
            });

            updateStats();
            
            if (currentView === 'table') {
                renderCards();
            } else {
                renderTimeline();
            }
        }

        function updateStats() {
            document.getElementById('total-insights').textContent = filteredData.length;
            document.getElementById('total-metrics').textContent = filteredData.filter(d => d.metric).length;
            document.getElementById('total-actionable').textContent = filteredData.filter(d => d.actionable).length;
        }

        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            const timelineData = data.filter(d => d.year !== null && d.year !== undefined).sort((a,b) => b.year - a.year);
            
            if (timelineData.length === 0) {
                container.innerHTML = '<p class="text-center text-muted italic p-4">No temporal data available with current filters.</p>';
                return;
            }

            let html = '';
            
            timelineData.forEach(item => {
                html += `
                <div class="flex flex-col gap-2 px-4 py-3 ml-6 group bg-white border border-black shadow-[3px_3px_0px_#000] relative">
                    <div class="absolute size-[7px] bg-black -left-[32px] top-[18px] outline outline-white outline-4"></div>
                    
                    <div class="flex items-baseline gap-2 justify-between">
                        <div class="flex items-center gap-2 min-w-0 flex-1">
                            <div class="px-1.5 py-0.5 bg-accent text-black text-[10px] font-medium border border-black">${item.year}</div>
                            <div class="text-xs truncate font-bold font-serif">${item.article}</div>
                        </div>
                    </div>
                    
                    <p class="text-xs text-muted mt-1 leading-relaxed">
                        ${item.claim}
                    </p>
                    
                    ${item.metric ? `<div class="mt-2 text-[10px] font-mono bg-gray-100 p-1 inline-block border border-gray-200">📊 ${item.metric}</div>` : ''}
                </div>
                `;
            });

            container.innerHTML = html;
        }

        function switchView(view) {
            currentView = view;
            
            const btnTable = document.getElementById('btn-table');
            const btnTimeline = document.getElementById('btn-timeline');
            const viewTable = document.getElementById('table-view');
            const viewTimeline = document.getElementById('timeline-view');
            const sortControls = document.getElementById('sort-controls');

            if (view === 'table') {
                btnTable.classList.add('bg-black', 'text-white', 'border-black');
                btnTable.classList.remove('bg-white', 'text-black');
                btnTimeline.classList.add('bg-white', 'text-black');
                btnTimeline.classList.remove('bg-black', 'text-white');
                
                viewTable.style.display = 'block';
                viewTimeline.style.display = 'none';
                sortControls.style.display = 'flex';
                renderCards();
            } else {
                btnTimeline.classList.add('bg-black', 'text-white', 'border-black');
                btnTimeline.classList.remove('bg-white', 'text-black');
                btnTable.classList.add('bg-white', 'text-black');
                btnTable.classList.remove('bg-black', 'text-white');

                viewTable.style.display = 'none';
                viewTimeline.style.display = 'block';
                sortControls.style.display = 'none';
                renderTimeline();
            }
        }

        function sortTable(columnIndex) {
            const isAsc = filteredData._sortAsc !== columnIndex;
            filteredData._sortAsc = isAsc ? columnIndex : null;

            filteredData.sort((a, b) => {
                let valA, valB;
                switch(columnIndex) {
                    case 1: valA = a.article; valB = b.article; break;
                    case 2: valA = a.claim; valB = b.claim; break;
                    case 3: valA = a.type; valB = b.type; break;
                    case 4: valA = a.metric; valB = b.metric; break;
                }
                if (valA < valB) return isAsc ? -1 : 1;
                if (valA > valB) return isAsc ? 1 : -1;
                return 0;
            });

            renderCards();
        }

        // Listeners
        document.getElementById('search').addEventListener('input', applyFilters);
        document.getElementById('filter-metrics').addEventListener('change', applyFilters);
        document.getElementById('filter-counterintuitive').addEventListener('change', applyFilters);
        document.getElementById('filter-actionable').addEventListener('change', applyFilters);
        document.getElementById('filter-causal').addEventListener('change', applyFilters);

        // Init
        renderCards();
        updateStats();
    </script>
</body>
</html>
