<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jina Reader Proxy | Pham Thanh Lam</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>📑</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.2/marked.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['IBM Plex Mono', 'monospace'],
                        mono: ['IBM Plex Mono', 'monospace'],
                        serif: ['IBM Plex Serif', 'serif'],
                    },
                    colors: {
                        background: '#ffffff',
                        foreground: '#000000',
                        muted: '#666666',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-foreground font-mono text-sm antialiased selection:bg-black selection:text-white">

    <div class="p-4 md:p-12 min-h-screen">
        <div class="w-full max-w-xl mx-auto">
            
            <header class="flex justify-between items-center mb-12 border-b border-black pb-4">
                <a class="text-2xl font-serif font-medium tracking-tight" href="/">
                    <span>Jina Reader (λ)</span>
                </a>
                <div class="text-[10px] uppercase tracking-wider text-muted">Content Extraction</div>
            </header>

            <section class="mb-12">
                <form id="url-form" class="flex flex-col gap-4">
                    <div class="flex flex-col gap-2">
                        <label class="text-xs font-bold uppercase">Target URL</label>
                        <input type="text" id="url-input" placeholder="https://example.com" required 
                            class="w-full p-3 border border-black focus:outline-none focus:ring-0 shadow-[3px_3px_0px_#000]">
                    </div>
                    
                    <div class="flex gap-4">
                        <div class="flex-1">
                            <label class="text-xs font-bold uppercase">Format</label>
                            <select id="format-select" class="w-full p-2 border border-black bg-white focus:outline-none mt-1">
                                <option value="markdown">Markdown</option>
                                <option value="html">HTML</option>
                                <option value="text">Text</option>
                                <option value="llm_markdown">LLM Markdown</option>
                            </select>
                        </div>
                        <div class="flex items-end">
                            <button type="submit" id="submit-btn" 
                                class="px-6 py-2 bg-black text-white font-bold hover:bg-muted transition-colors shadow-[3px_3px_0px_#ccc]">
                                EXTRACT
                            </button>
                        </div>
                    </div>
                </form>
            </section>

            <div id="loading" class="hidden animate-pulse mb-8 text-muted italic">Processing source content...</div>

            <div id="result" class="hidden space-y-8">
                <div>
                    <h2 class="font-serif text-lg font-bold mb-4 border-b border-black pb-2">Extracted Content</h2>
                    <div class="border border-black p-1 shadow-[3px_3px_0px_#000] mb-4">
                        <textarea id="markdown-raw" readonly class="w-full h-48 p-2 text-xs bg-gray-50 focus:outline-none border-none resize-y"></textarea>
                    </div>
                    <button id="copy-btn" class="text-xs border border-black px-3 py-1 hover:bg-black hover:text-white transition-colors">
                        COPY RAW
                    </button>
                </div>

                <div class="border border-black p-0 shadow-[5px_5px_0px_#000]">
                    <iframe id="markdown-rendered" sandbox class="w-full h-[400px] block"></iframe>
                </div>

                <div id="prompt-section" class="hidden pt-12 mt-12 border-t border-black">
                    <h2 class="font-serif text-lg font-bold mb-4">Agentic Analysis</h2>
                    <p class="text-xs text-muted mb-4">Run the extracted content through Claude-3-5-Haiku for summarization.</p>
                    
                    <textarea id="prompt-textarea" class="w-full h-32 p-3 border border-black text-xs mb-4 focus:outline-none">Respond in markdown. Provide a high-level summary, key interesting quotes, and unusual ideas found in the text.</textarea>
                    
                    <button id="run-prompt-btn" class="w-full py-3 bg-white border border-black font-bold hover:bg-black hover:text-white transition-all shadow-[3px_3px_0px_#000]">
                        RUN CLAUDE ANALYSIS
                    </button>

                    <div id="prompt-loading" class="hidden mt-4 italic text-muted text-xs">Generating response...</div>
                    
                    <div id="prompt-result" class="hidden mt-8 p-4 bg-gray-50 border-l-4 border-black">
                        <div id="prompt-rendered" class="prose prose-sm max-w-none leading-relaxed"></div>
                        <button id="prompt-copy-btn" class="mt-4 text-[10px] font-bold uppercase underline underline-offset-4">Copy Analysis</button>
                    </div>
                </div>
            </div>

            <footer class="mt-20 border-t border-black pt-6 pb-12 flex justify-between items-baseline text-xs text-muted">
                <p class="font-serif text-sm text-foreground">Pham Thanh Lam (λ)</p>
                <span>&copy; 2025</span>
            </footer>
        </div>
    </div>

    <script>
        const urlForm = document.getElementById('url-form');
        const urlInput = document.getElementById('url-input');
        const formatSelect = document.getElementById('format-select');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const markdownRaw = document.getElementById('markdown-raw');
        const copyBtn = document.getElementById('copy-btn');
        const markdownRendered = document.getElementById('markdown-rendered');
        const promptSection = document.getElementById('prompt-section');

        // Logic for fetching Jina
        urlForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = urlInput.value;
            const format = formatSelect.value;
            
            loading.classList.remove('hidden');
            result.classList.add('hidden');

            try {
                let fetchOptions = { method: 'GET' };
                if (format !== 'llm_markdown') {
                    fetchOptions.headers = { "X-Return-Format": format };
                }

                const response = await fetch(`https://r.jina.ai/${url}`, fetchOptions);
                const content = await response.text();
                markdownRaw.value = content;

                let htmlContent = `
                    <html>
                        <head>
                            <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap" rel="stylesheet">
                            <style>
                                body { font-family: 'IBM Plex Mono', monospace; line-height: 1.6; color: #000; padding: 20px; font-size: 13px; }
                                img { max-width: 100%; height: auto; border: 1px solid #000; }
                                h1, h2, h3 { font-family: serif; border-bottom: 1px solid #eee; }
                                pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
                            </style>
                        </head>
                        <body>
                            ${format === 'text' ? `<pre>${content}</pre>` : (format === 'html' ? content : marked.parse(content))}
                        </body>
                    </html>
                `;
                markdownRendered.srcdoc = htmlContent;
                result.classList.remove('hidden');
                promptSection.classList.remove('hidden');
            } catch (error) {
                console.error('Error:', error);
                alert('Extraction failed. Check the console.');
            } finally {
                loading.classList.add('hidden');
            }
        });

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(markdownRaw.value);
            copyBtn.textContent = 'COPIED';
            setTimeout(() => copyBtn.textContent = 'COPY RAW', 1500);
        });

        // Claude Logic
        const runPromptBtn = document.getElementById('run-prompt-btn');
        const promptLoading = document.getElementById('prompt-loading');
        const promptResult = document.getElementById('prompt-result');
        const promptRendered = document.getElementById('prompt-rendered');

        function getApiKey() {
            let key = localStorage.getItem("ANTHROPIC_API_KEY");
            if (!key) {
                key = prompt("Enter Anthropic API Key:");
                if (key) localStorage.setItem("ANTHROPIC_API_KEY", key);
            }
            return key;
        }

        runPromptBtn.addEventListener('click', async () => {
            const apiKey = getApiKey();
            if (!apiKey) return;

            promptLoading.classList.remove('hidden');
            promptResult.classList.add('hidden');

            try {
                const response = await fetch("https://api.anthropic.com/v1/messages", {
                    method: "POST",
                    headers: {
                        "x-api-key": apiKey,
                        "anthropic-version": "2023-06-01",
                        "content-type": "application/json",
                        "anthropic-dangerous-direct-browser-access": "true"
                    },
                    body: JSON.stringify({
                        model: "claude-3-5-haiku-latest",
                        max_tokens: 2048,
                        system: document.getElementById('prompt-textarea').value,
                        messages: [{ role: "user", content: markdownRaw.value }]
                    })
                });

                const data = await response.json();
                const text = data.content[0].text;
                promptRendered.innerHTML = marked.parse(text);
                promptResult.classList.remove('hidden');
            } catch (error) {
                promptRendered.innerHTML = '<span class="text-red-500">API Error.</span>';
                promptResult.classList.remove('hidden');
            } finally {
                promptLoading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
