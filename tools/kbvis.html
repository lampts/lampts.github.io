<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KB Visualization</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Sans', -apple-system, sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Left Panel - Plot */
        .plot-panel {
            width: 45%;
            padding: 16px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #e0e0e0;
            background: #fff;
        }

        .plot-header {
            margin-bottom: 12px;
        }

        .plot-header h1 {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .plot-header .stats {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        #plot {
            flex: 1;
            min-height: 0;
        }

        /* Right Panel - Text */
        .text-panel {
            width: 55%;
            display: flex;
            flex-direction: column;
            background: #fafafa;
        }

        .search-box {
            padding: 16px;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #FBD45B;
        }

        .search-input::placeholder {
            color: #999;
        }

        .filter-btn {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            padding: 4px 10px;
            border: 2px solid #e0e0e0;
            background: #fff;
            cursor: pointer;
            transition: all 0.15s;
        }

        .filter-btn:hover {
            border-color: #FBD45B;
        }

        .filter-btn.active {
            background: #FBD45B;
            border-color: #1a1a1a;
            box-shadow: 2px 2px 0 #1a1a1a;
        }

        .filter-btn.clear-btn {
            background: #fff;
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .filter-btn.clear-btn:hover {
            background: #ff6b6b;
            color: #fff;
        }

        .filter-row .divider {
            color: #ccc;
            margin: 0 4px;
            align-self: center;
        }

        .filter-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        #product-filters {
            display: contents;
        }

        .text-list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .text-item {
            padding: 14px 16px;
            border-bottom: 1px solid #e8e8e8;
            cursor: pointer;
            transition: background 0.15s;
        }

        .text-item:hover {
            background: #fff;
        }

        .text-item.selected {
            background: #FBD45B;
            box-shadow: inset 3px 0 0 #1a1a1a;
        }

        .text-item.highlighted {
            background: #fffbe6;
        }

        .text-item .idx {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: #999;
            margin-bottom: 4px;
        }

        .text-item .product-tag {
            display: inline-block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            padding: 2px 6px;
            background: #e8e8e8;
            border-radius: 2px;
            margin-left: 8px;
            text-transform: uppercase;
        }

        .text-item .question {
            font-weight: 500;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 6px;
        }

        .text-item .answer {
            font-size: 12px;
            color: #555;
            line-height: 1.5;
        }

        .text-item .highlight {
            background: #FBD45B;
            padding: 0 2px;
        }

        .status-bar {
            padding: 10px 16px;
            background: #1a1a1a;
            color: #fff;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="plot-panel">
            <div class="plot-header">

        <div class="text-panel">

                    <button class="filter-btn clear-btn" id="clear-btn" onclick="clearAllSelections()">✕ Clear Selection</button>
                    <span class="divider">|</span>
                    <span id="product-filters"></span>
                </div>
            </div>
            <div class="text-list" id="text-list"></div>
            <div class="status-bar">
                <span id="status-text">Click points or use lasso to select</span>
                <span id="showing-count">Showing: 0</span>
            </div>
        </div>
    </div>

y": 5.069759368896484, "q": "Thanh toán trả góp thẻ tín dụng như thế nào?", "a": "Số tiền trả góp thẻ tín dụng chia đều từng tháng, riêng kỳ đầu tiên có tính phí chuyển đổi trả góp (chỉ thu 1 lần duy nhất và được cộng vào kỳ đầu tiên)\nSố tiền trả góp hàng tháng sẽ là 1 phần của khoản thanh toán tối thiểu: \nSố tiền tối thiểu = Khoản trả góp hàng tháng + Số tiền quá hạn (nếu có) + 5% Dư nợ sao kê\nNgày đến hạn thanh toán trả góp cũng là ngày đến hạn thanh toán hàng tháng (15 ngày kể từ ngày chốt sao kê)", "product": "card"}, {"idx": 65, "x": 13.482778549194336, "y": 4.7970290184021, "q": "Có cần thực hiện NFC để sử dụng Google Pay?", "a": "Nếu bạn thanh toán qua Google Pay giao tab tại máy POS thì cần NFC, còn nếu giao dịch ECOM thì cần có NFC", "product": "card"}, {"idx": 66, "x": 12.719877243041992, "y": 4.043421745300293, "q": "Cách liên kết thẻ debit với Google Pay?", "a": "B1: Mở Cake, chọn Thẻ thanh toán Visa Cake trên trang chủ.\nB2: Trong màn hình quản lý thẻ, nhấn \"Thêm vào GPay\".\nB3: Hệ thống sẽ đưa mình qua Google Wallet, chọn \"Thêm vào Wallet\".\nB4: Xác thực theo hướng dẫn để hoàn tất liên kết.\nB5: Khi thanh toán, chỉ cần mở Google Wallet chọn Thẻ thanh toán Visa Cake và chạm nhẹ là xong!", "product": "card"}, {"idx": 67, "x": 12.842844009399414, "y": 3.81872296333313, "q": "KH có thẻ ảo debit, nếu add vào google pay có quẹt pos được không?", "a": "Googlepay chỉ sử dụng được với thẻ vật lý", "product": "card"}, {"idx": 68, "x": 11.168664932250977, "y": 5.054487228393555, "q": "Điều kiện giao dịch được trả góp của thẻ tín dụng", "a": "Chủ Thẻ tín dụng có thể đăng ký Chương trình trả góp khi thỏa các điều kiện sau:\n- Áp dụng cho các khách hàng nhận được noti thông báo về chức năng trả góp của Cake.\n- Áp dụng cho giao dịch mua sắm trực tuyến (ECOM) và tại đơn vị chấp nhận thẻ (POS) (không bao gồm giao dịch rút tiền mặt)\n- Giá trị giao dịch từ 2 triệu VND (chỉ tính trên số tiền giao dịch gốc, không bao gồm các loại phí)\n- Giao dịch được ghi nhận (bút toán) trên hệ thống CAKE by VPBank nhưng chưa được thể hiện trên bảng sao kê th", "product": "card"}, {"idx": 69, "x": 12.178705215454102, "y": 4.350953102111816, "q": "Click to pay (C2P) là gì?", "a": "Click to Pay là tiêu chuẩn mới trong thanh toán trực tuyến. Đây là cách mua sắm trực tuyến dễ dàng hơn, nhanh hơn, an toàn hơn và tốt hơn. Với Click to Pay, bạn sẽ không phải nhập thông tin thẻ theo cách thủ công khi thanh toán.\n\nDưới đây là cách hoạt động của thẻ đã đăng ký của bạn:\n\nTìm biểu tượng Click to Pay‍trong quá trình thanh toán\nNhập SĐT và địa chỉ email của bạn\nXác nhận danh tính của bạn\nChọn thẻ để sử dụng\nHoàn tất việc mua hàng, vậy là xong!", "product": "card"}, {"idx": 70, "x": 12.426814079284668, "y": 3.3547251224517822, "q": "1 thẻ có thể được liên kết với nhiều Garmin Pay không?", "a": "1 thẻ có thể được liên kết với nhiều Garmin Pay", "product": "card"}, {"idx": 71, "x": 12.177508354187012, "y": 4.326236724853516, "q": "Click to Pay có áp dụng quốc tế không?", "a": "Có. Click to Pay được phát triển theo chuẩn EMV® Secure Remote Commerce (SRC), được Visa triển khai toàn cầu.\nNếu website/ứng dụng thương mại điện tử quốc tế hiển thị biểu tượng Click to Pay, bạn có thể dùng thẻ Visa phát hành tại Việt Nam để thanh toán.", "product": "card"}, {"idx": 72, "x": 11.365910530090332, "y": 4.22517204284668, "q": "Giới thiệu thẻ Tự do 2in1", "a": "Thẻ 2in1 tích hợp chức năng của thẻ thanh toán và thẻ ghi nợ, không cần duy trì cùng lúc 2 chiếc thẻ, Tối giản và an toàn với thông tin số thẻ, CVV, ngày hết hạn… được bảo mật và chỉ hiển thị tại mục Quản lý thẻ trên Ứng dụng Cake, khách hàng có thể chủ động tùy chọn thứ tự ưu tiên nguồn tiền sử dụng (tài khoản thanh toán hoặc tài khoản tín dụng) cho từng kênh và từng loại giao dịch. Hạn mức tín dụng lên đến 100 triệu đồng, miễn lãi đến 45 ngày.", "product": "card"}, {"idx": 73, "x": 12.807013511657715, "y": 3.9604063034057617, "q": "Sau khi liên kết Google Pay rồi, tôi có thể hủy liên kết bất cứ lúc nào  để rút tiền miễn phí và quẹt POS\nBước 4: Bổ sung thông tin và ký hợp đồng để hoàn tất yêu cầu phát hành thẻ.\nLưu ý: Phát hành thẻ trực tuyến miễn phí, phát hành kèm thẻ vật lý phí 165.000VND (đã gồm VAT).", "product": "card"}, {"idx": 81, "x": 11.72424602508545, "y": 6.63823938369751, "q": "Bao lâu thì tôi nhận được tiền hoàn khi giao dịch bằng thẻ tín dụng?\nTrả cashback khi nào?", "a": "Tiền hoàn của kỳ sao kê tháng T sẽ được chuyển vào Tài khoản Cake (Cashback) của Khách hàng đủ điều\nkiện nhận quà tặng vào ngày 20 của tháng T+1. Trường hợp ngày 20 rơi vào Thứ 7, Chủ Nhật hoặc ngày\nnghỉ lễ, tiền hoàn sẽ được chuyển vào ngày làm việc tiếp theo.", "product": "card"}, {"idx": 82, "x": 13.8300199508667, "y": 5.095388412475586, "q": "Thanh toán bằng Garmin Pay có yêu cầu sử dụng Internet không?", "a": "Không yêu cầu Wi-Fi hay mạng dữ liệu di động.\nKhi thực hiện giao dịch (tap POS), không cần kết nối Wi-Fi hay mạng dữ liệu vì giao dịch được thực hiện qua NFC và mã token được thiết lập từ trước.", "product": "card"}, {"idx": 83, "x": 12.717732429504395, "y": 3.7566001415252686, "q": "1 thẻ có thể thêm được vào nhiều điện thoại hỗ trợ GGpay ko? Tối đa bao nhiêu thiết bị?", "a": "1 thẻ có thể thêm được vào nhiều điện thoại hỗ trợ Google pay.", "product": "card"}, {"idx": 84, "x": 13.582077026367188, "y": 6.455866813659668, "q": "Quên mã bảo mật sổ tiết kiệm thì phải làm gì?\nTắt tính năng bảo mật tiền gửi.", "a": "Bạn vui lòng gọi đến số hotline 1900636686 bằng số điện thoại đăng ký Cake để yêu cầu mở khóa bảo mật.", "product": "savings"}, {"idx": 85, "x": 10.397149085998535, "y": 3.1703312397003174, "q": "Giới thiệu Thẻ tín dụng Cake Freedom", "a": "Thẻ tín dụng Cake Freedom, đăng ký dễ dàng, chỉ cần CCCD, không chứng minh thu nhập, hạn mức lên tới 100 triệu đồng, hoàn tiền 20% đến 1 triệu đồng/tháng cho nhiều ngành hàng phổ biến (*) Ưu đãi hoàn tiền của Thẻ tín dụng Cake Freedom có thể thay đổi tuỳ theo chính sách sản phẩm ở từng thời kỳ. Để có thông tin cập nhật nhất, vui lòng truy cập trang Điều kiện & Điều khoản hoàn tiền của Thẻ tín dụng Cake Freedom.", "product": "card"}, {"idx": 86, "x": 13.052190780639648, "y": 3.6557772159576416, "q": "Tôi có thể sử dụng điện thoại, đồng hồ thông minh để sử dụng Google Pay?", "a": "Có thể sử dụng điện thoại, đồng hồ thông mình có hỗ trợ cài đặt và sử dụng Google pay", "product": "card"}, {"idx": 87, "x": 12.198358535766602, "y": 4.363675594329834, "q": "C2P bảo mật không?", "a": "Click to Pay của Visa bảo mật cao:\nSử dụng mã token thay vì số thẻ thật (PAN)​\nMỗi giao dịch tạo một mã cryptogram riêng biệt​\nGiảm đáng kể nguy cơ gian lận từ việc đánh cắp thông tin thẻ.\n(Thay vì việc nhập thông tin thẻ (số thẻ, tên trên thẻ, CVV, ngày hết hạn) vào hệ thống của merchant, khi thanh toán bằng phương thức Click 2 Pay, KH chỉ cần nhập thông tin email và SDT. Trong trường hợp Merchant gặp sự cố lộ thông tin KH, sẽ không có thông tin liên quan tới thẻ của KH bị lộ)", "product": "card"}, {"idx": 88, "x": 12.429037094116211, "y": 4.774947643280029, "q": "Trong trường hợp giao dịch bị từ chối / lỗi, quy trình xử lý như thế nào?", "a": "Nếu giao dịch lỗi tại bước thanh toán, bạn có thể thử lại hoặc chọn thẻ khác đã lưu trong Click to Pay.\nNếu giao dịch đã trừ tiền nhưng merchant chưa xác nhận đơn hàng, bạn cần liên hệ trực tiếp với merchant.\nNếu nghi ngờ có vấn đề với thẻ, hãy liên liên hệ tổng đài CSKH để được tra soát và hỗ trợ hoàn tiền (nếu cần).\nNói chung, quy trình xử lý giống như giao dịch thẻ Visa trực tuyến thông thường.", "product": "card"}, {"idx": 89, "x": 12.292369842529297, "y": 4.474762916564941, "q": "Phần Click to Pay trên app CAKE có hiển thị những đối tác nào đã liên kết không?", "a": "Bản chất Click To Pay không yêu cầu phải liên kết thẻ với merchant nên sẽ không có danh sách đối tác đã liên kết. Thông tin thẻ không hề được nhập vào bước thanh toán (chỉ có số điện thoại và email) nên merchant sẽ không lưu trữ thông tin thẻ.", "product": "card"}, {"idx": 90, "x": 12.40328598022461, "y": 3.355612277984619, "q": "Thanh toán bằng Garmin Pay có yêu cầu bật tính năng quẹt pos?", "a": "Thanh toán bằng Garmin Pay có yêu cầu bật tính năng quẹt pos.", "product": "card"}, {"idx": 91, "x": 11.7594633102417, "y": 5.534104347229004, "q": "Hạn khi thanh toán bằng C2P như thế nào?", "a": "Hạn mức theo hạn mức khả dụng và hạn mức thanh toán kênh thanh toán trực tuyến bạn đã cài đặt.", "product": "card"}, {"idx": 92, "x": 13.46777057647705, "y": 4.81535005569458, "q": "Có cần thực hiện NFC để sử dụng C2P?", "a": "Click to pay là kênh thanh toán trực tuyến nên theo quy định của NHNN sẽ cần NFC để đảm bảo an toàn.", "product": "card"}, {"idx": 93, "x": 12.894213676452637, "y": 4.431075096130371, "q": "Sau khi liên kết C2P rồi, tôi có thể hủy liên kết bất cứ lúc nào chứ? Nếu hủy thì thao tác thế nào?", "a": "Bạn có thể hủy liên kết C2P bất cứ khi nào.\nThao tác như sau:\nB1: Truy cập app Cake, mục Quản lý thẻ.\nB2: Chọn Click to pay và làm theo hướng dẫn trên app để xác thực OTP để Hủy liên kết.", "product": "card"}, {"idx": 94, "x": 11.946626663208008, "y": 3.914442539215088, "q": "Click to Pay áp dụng cho những loại thẻ nào?", "a": "Áp dụng cho tất cả các thẻ của Cake", "product": "card"}, {"idx": 95, "x": 12.573400497436523, "y": 3.5524990558624268, "q": "Có cần thiết phải đeo đồng hồ khi sử dụng Garmin Pay không?", "a": "Nếu chủ thẻ tháo đồng hồ ra khỏi cổ tay hoặc tắt thiết bị theo dõi nhịp tim, chủ thẻ phải nhập lại mật mã trước khi thực hiện thanh toán.", "product": "card"}, {"idx": 96, "x": 12.57540512084961, "y": 3.5531232357025146, "q": "Khi thực hiện quẹt POS, tôi cần thao tác như thế nào ?", "a": "Mở Garmin Pay trên đồng hồ, chọn thẻ (nếu bạn có nhiều thẻ), đưa đồng hồ vào gần máy POS để thanh toán.", "product": "card"}, {"idx": 97, "x": 13.457144737243652, "y": 4.742588043212891, "q": "Khi thực hiện quẹt Pos, tôi cần thao tác như thế nào ?", "a": "Đảm bảo thiết bị đã bật NFC và đã liên kết thẻ vào GG wallet. Mở Ứng dụng GG wallet, chọn thẻ (nếu bạn có nhiều thẻ), đưa phần quét NFC của thiết bị vào gần máy POS để thanh toán.", "product": "card"}, {"idx": 98, "x": 12.157949447631836, "y": 4.227320671081543, "q": "Click to Pay có mất phí không?", "a": "Các khoản phí giao dịch (nếu có) vẫn áp dụng theo quy định của ngân hàng, tương tự như khi bạn thanh toán online bằng thẻ Visa thông thường.", "product": "card"}, {"idx": 99, "x": 12.23552417755127, "y": 3.9648752212524414, "q": "KH có thẻ ảo, có dùng C2P được không?", "a": "Click to pay là kênh thanh toán trực tuyến nên có thể dùng được cho cả thẻ ảo và thẻ cứng.", "product": "card"}, {"idx": 100, "x": 11.371577262878418, "y": 5.074770927429199, "q": "Các bước đăng ký trả góp của thẻ tín dụng", "a": "Để thực hiện chuyển đổi trả góp giao dịch thẻ tín dụng, bạn vui lòng thao tác theo hướng dẫn sau:\nBước 1: Tại mục Quán lý thẻ, chọn “Chuyển đổi trả góp”\nBước 2: Chọn “Tạo gói trả góp mới”\nBước 3: Chọn giao dịch mong muốn chuyển đổi trả góp\nBước 4: Chọn thời hạn trả góp và xác nhận\nBước 5: Nhận kết quả phê duyệt khoản trả góp\n(*) Lưu ý quan trọng:\n- Chỉ giao dịch thỏa điều kiện mới hiển thị tại mục \"Chuyển đổi trả góp\", trường hợp bạn vừa thực hiện giao dịch, cần đợi vài ngày để giao dịch được gh", "product": "card"}, {"idx": 101, "x": 12.201086044311523, "y": 4.406042098999023, "q": "Ở Việt Nam đang có nhưng Merchant nào cho phép thanh toán qua C2P", "a": "Các Merchant có logo Click to Pay trong phần thanh toán là Merchant cho phép thanh toán qua C2P. Danh sách này ngày càng mở rộng. Hiện nay tại Việt Nam đang có các Merchant sau: LG Việt Nam, AEONE Shop, NEM, Maison Online ...\nhttps://www.vietinbank.vn/assets/7333ebea-ed6a-4425-9dee-ba7155d43dc7", "product": "card"}, {"idx": 102, "x": 14.830817222595215, "y": -4.42811918258667, "q": "Thời hạn thanh toán và nghĩa vụ thanh toán của ví trả sau MWG?", "a": "Quy định chính sách của sản phẩm vay trên ứng dụng MWG có thể thay đổi theo từng thời kỳ. Nếu quan tâm tới sản phẩm vay này, bạn vui lòng kiểm tra thông tin trực tiếp trên ứng dụng Quà tặng VIP.", "product": "lendings"}, {"idx": 103, "x": 11.82809066772461, "y": 4.380039691925049, "q": "Thẻ thanh toán là gì?\nThẻ thanh toán thú cưng là gì?", "a": "Thẻ thanh toán của Cake là thẻ thanh toán quốc tế Visa, được thiết kế với công nghệ Chip, thanh toán bảo mật 3Ds, và thanh toán chạm (Contactless). Thẻ được chấp nhận trên toàn cầu tại hàng chục triệu điểm thanh toán có logo Visa phục vụ nhu cầu mua sắm, chi tiêu và tiền mặt.\nBạn có thể giao dịch thanh toán trực tuyến ngay khi mở thẻ mà không cần chờ thẻ vật lý. Với thẻ vật lý, bạn có thể rút tiền mặt tại các cây ATM có biểu tượng Visa, quẹt POS để mua sắm.", "product": "card"}, {"idx": 104, "x": 15.916031837463379, "y": 7.918950080871582, "q": "Tôi muốn cấp giấy giấy xác nhận dư nợ khoản vay", "a": "Để được cấp giấy tờ theo yêu cầu, bạn vui lòng truy cập đường link bên dưới, chọn mục Phiếu yêu cầu cung cấp dữ liệu cá nhân và tải phiếu.\nBạn vui lòng điền đầy đủ thông tin vào phiếu, ký chữ ký tươi và scan/chụp phiếu, gửi từ email đăng ký Cake của bạn đến email chat@cake.vn để yêu cầu cung cấp giấy tờ. Sau khi nhận được email, nhân viên ngân hàng sẽ liên hệ bạn để hỗ trợ, bạn để ý điện thoại giúp Gato nghen!\nhttps://cake.vn/bieu-phi/bieu_mau_bieu_phi", "product": "account"}, {"idx": 105, "x": 13.010095596313477, "y": 6.486849308013916, "q": "Cách bật tính năng C2P?", "a": "Để bật C2P bạn vui lòng làm theo hướng dẫn sau:\nB1: Truy cập app Cake, mục Quản lý thẻ.\nB2: Chọn \"Click to pay\" và làm theo hướng dẫn trên app Cake để bật tính năng.", "product": "card"}, {"idx": 106, "x": 15.059821128845215, "y": 6.756444454193115, "q": "Nếu tôi không nhớ email / số điện thoại đã đăng ký CAKE, có thể đăng nhập / sử dụng Click to Pay như thế nào?", "a": "Click to Pay xác thực người dùng chủ yếu bằng email hoặc số điện thoại đã đăng ký.\nNếu bạn không nhớ, hãy kiểm tra lại trong mục Quản lý thẻ trên ứng dụng ngân hàng (app CAKE) để xem thông tin đã đăng ký.\nNếu vẫn không tìm đượ 392468452453613, "q": "Có thể xóa Quỹ chung không?", "a": "Hiện tại Cake chưa hỗ trợ xóa quỹ chung.\nNếu muốn rời nhóm đã tạo, bạn thao tác như sau:\nBước 1: Nhấn vào Quỹ chung muốn rời khỏi\nBước 2: Chọn mục Thành viên\nBước 3: Chọn \"Rời khỏi quỹ chung\" và Xác nhận", "product": "account"}, {"idx": 196, "x": 14.297733306884766, "y": 5.701660633087158, "q": "Quy trình eKYC là gì?", "a": "eKYC = Electronic Know Your Customer, là quy trình định danh khách hàng có thể được thực hiện hoàn toàn trực tuyến bằng ứng dụng của Cake. Quy trình này gồm các bước như điền thông tin khách hàng, xác minh khách hàng, và thực hiện kí kết.", "product": "account"}, {"idx": 197, "x": 12.94916820526123, "y": 7.137755870819092, "q": "Liên kết Be- Cake", "a": "Để liên kết Cake làm phương thức thanh toán cho Be, bạn vui lòng thao tác theo hướng dẫn sau đây nhé:\nBước 1: Truy cập app Be, vào mục tài khoản (góc dưới cùng bên phải)\nBước 2: Chọn phần \"Thanh toán\"\nBước 3: Tại mục \" Thêm hình thức thanh toán\", chọn \" Cake by VPBank\"\nBước 4: Điền đầy đủ thông tin tài khoản Cake: số tài khoản Cake (là số điện thoại đăng ký Cake của bạn), CMND/CCCD\nBước 5: Nhập mã OTP và hoàn thiện liên kết", "product": "banking_service"}, {"idx": 198, "x": 13.259541511535645, "y": 8.146464347839355, "q": "mối quan hệ giữa Cake và VPBank", "a": "CAKE by VPBank là một trong các kênh ngân hàng điện tử của VPBank. Các sản phẩm, dịch vụ ngân hàng được VPBank triển khai trên kênh ngân hàng điện tử này được gắn với thương hiệu CAKE. Các vấn đề pháp lý phát sinh với Khách hàng sử dụng các sản phẩm, dịch vụ này sẽ được VPBank giải quyết theo quy định pháp luật. Theo đó, Quý Khách hàng hoàn toàn yên tâm tiếp tục sử dụng các sản phẩm, dịch vụ của VPBank nói chung cũng như các sản phẩm, dịch vụ mang thương hiệu CAKE by VPBank nói riêng.", "product": "account"}, {"idx": 199, "x": 13.63388442993164, "y": 6.111898899078369, "q": "Cake có chi nhánh/phòng giao dịch không?", "a": "Cake là ngân hàng số hướng đến sự tiện lợi cho khách hàng khi giao dịch không cần đến chi nhánh. Trường hợp khách hàng cần hỗ trợ tại quầy như bổ sung hồ sơ, nộp tiền mặt có thể đến PGD của VPBank trên toàn quốc. Ngoài ra trợ lý Gato chăm chỉ sẽ luôn bên cạnh lắng nghe và hỗ trợ bạn tại mọi kênh tiếp nhận như chat qua fanpage, hotline 1900.636.686 và email chat@cake.vn bạn nhé!", "product": "account"}, {"idx": 200, "x": 13.069195747375488, "y": 6.868664264678955, "q": "Làm thế nào để thực hiện VKYC nâng hạn mức và định danh nâng cao?", "a": "Mời bạn chuẩn bị sẵn giấy tờ CMND/CCCD đã đăng ký với Cake, kết nối mạng internet ổn định để nâng cấp tài khoản theo các bước:\nBước 1: Đăng nhập ứng dụng CakeBank, chọn hình đại diện tại góc trên bên trái, chọn \"Nâng cấp tài khoản.\"\nBước 2: Chọn \"Tôi đã hiểu và sẵn sàng\", đọc lưu ý và bấm \"Bắt đầu\" (cho phép quyền truy cập micro, camera nếu có)\nBước 3: Thao tác định danh (quay 2 mặt CCCD/CMND và khuôn mặt) theo hướng dẫn app", "product": "kyc"}, {"idx": 201, "x": 14.83625602722168, "y": -4.434864521026611, "q": "Phí giao dịch/hàng tháng của khoản vay MWG là bao nhiêu", "a": "Quy định chính sách của sản phẩm vay trên ứng dụng MWG có thể thay đổi theo từng thời kỳ. Nếu quan tâm tới sản phẩm vay này, bạn vui lòng kiểm tra thông tin trực tiếp trên ứng dụng Quà tặng VIP.", "product": "lendings"}, {"idx": 202, "x": 9.15829849243164, "y": 8.359390258789062, "q": "HƯỚNG DẪN CHI QUỸ", "a": "HƯỚNG DẪN CHI QUỸ\nCách 1: Nhấn “Chi quỹ” tại Trang chủ của Cake\nCách 2: Tìm quỹ muốn nạp và nhấn “Chi Quỹ”\nBước 3: Nhập số tiền muốn nạp quỹ và ấn “Xác nhận giao dịch”", "product": "account"}, {"idx": 203, "x": 14.809721946716309, "y": -4.407644271850586, "q": "Số tiền tối thiểu, tối đa cho khoản vay MWG là bao nhiêu?\n\nThời gian cho vay MWWG?", "a": "Quy định chính sách của sản phẩm vay trên ứng dụng MWG có thể thay đổi theo từng thời kỳ. Nếu quan tâm tới sản phẩm vay này, bạn vui lòng kiểm tra thông tin trực tiếp trên ứng dụng Quà tặng VIP.", "product": "lendings"}, {"idx": 204, "x": 12.965377807617188, "y": 6.7839765548706055, "q": "Làm thế nào để nâng hạn mức giao dịch?", "a": "Bạn có thể cập nhật hạn mức giao dịch tài khoản bằng cách mở app CAKEBANK, chọn tài khoản tại góc trái phía trên màn hình, chọn quản lý gói hạn mức và cài đặt gói hạn mức phù hợp theo hướng dẫn. \nVới gói hạn mức đặc biệt, bạn cần thực hiện định danh qua cuộc gọi video theo các bước như sau:\nMời bạn chuẩn bị sẵn giấy tờ CMND/CCCD đã đăng ký với Cake, kết nối mạng internet ổn định để nâng cấp tài khoản theo các bước:\nBước 1: Đăng nhập ứng dụng CakeBank, chọn hình đại diện tại góc trên bên trái, ch", "product": "kyc"}, {"idx": 205, "x": 13.767684936523438, "y": 6.063147068023682, "q": "Mình nên làm gì khi mở tài khoản không thành công?", "a": "Cake rất tiếc nếu bạn gặp trục trặc! Trong trường hợp thông tin bạn cung cấp không thể được xác minh để mở tài khoản, Cake sẽ từ chối hồ sơ của bạn và cung cấp lý do vì sao đăng ký của bạn không thành công. Bạn cũng có thể liên lạc qua 1900636686 để được trợ giúp.", "product": "kyc"}, {"idx": 206, "x": 13.527321815490723, "y": 6.7443695068359375, "q": "Làm thế nào để bật/tắt tính năng đăng nhập bằng nhận diện gương mặt hoặc nhận diện vân tay?", "a": "Bạn có thể bật/tắt tính năng đăng nhập bằng nhận diện khuôn mặt hoặc nhận diện vân tay bằng cách đăng nhập app Cake, nhấp vào hình đại diện tại góc trên bên trái màn hình, sau đó chọn “Xác nhận vân tay” hoặc \"Nhận diện khuôn mặt\" để thay đổi.", "product": "account"}, {"idx": 207, "x": 12.32230281829834, "y": 7.5396294593811035, "q": "Mình có thể rút tiền từ tài khoản Cake bằng cách nào?", "a": "Bạn có thể rút tiền từ tài khoản Cake thông qua 2 kênh:\n1. Hệ thống ATMs trong nước với hơn 17,000 ATMs\n2. Hệ thống ATMs khác có liên kết Mastercard/Visa trên toàn cầu với hơn 1 triệu ATMs", "product": "banking_service"}, {"idx": 208, "x": 13.091633796691895, "y": 6.757591724395752, "q": "Hướng dẫn đổi email", "a": "Bạn vui lòng làm theo hướng dẫn sau để đổi địa chỉ email nhé:\n\nBước 1: Đăng nhập app Cake, chọn hình đại diện tài khoản tại góc trên bên trái màn hình.\n\nBước 2: Chọn mục thay đổi thông tin tại góc trên bên phải màn hình\n\nBước 3: Tại mục “Email\" bạn điền địa chỉ email mới và chọn mục “Cập nhật”\n\nBước 4: Bạn vui lòng nhập mã xác thực được gửi về email mới để hoàn tất quá trình thay đổi email.", "product": "kyc"}, {"idx": 209, "x": 14.060465812683105, "y": 6.019484043121338, "q": "Thông tin của mình có được lưu trữ an toàn tại Cake không?", "a": "Cake cam kết hoàn toàn bảo mật thông tin của bạn. Cake chỉ sử dụng thông tin bạn cung cấp để phục vụ cho mục đích xác minh khách hàng theo quy định của Ngân Hàng Nhà Nước.", "product": "account"}, {"idx": 210, "x": 12.648491859436035, "y": 8.14071273803711, "q": "Có những cách nào để mình nạp tiền vào tài khoản Cake?", "a": "Để thực hiện nạp tiền vào Cake, bạn có thể sử dụng một trong các cách sau:\nCách 1: Cake nhận tiền từ tất cả các Ngân hàng chuyển tiền tới qua dịch vụ chuyển tiền nhanh 247Napas:\nNgân hàng thụ hưởng: Cake by VPBank hoặc VPBank - NH số Cake by VPBank; hoặc CAKEBANK (tùy theo hiển thị hệ thống của từng ngân hàng)\nSố tài khoản Cake: Số điện thoại bạn đăng ký với Cake.\nCách 2: Cake nhận tiền từ ngân hàng khác qua dịch vụ chuyển tiền thường Citad với các thông tin:\nTên ngân hàng thụ hưởng: NH TMCP Việ", "product": "banking_service"}, {"idx": 211, "x": 13.144899368286133, "y": 6.691201210021973, "q": "Mình cần thực hiện những bước nào để mở tài khoản Cake?", "a": "Để mở tài khoản Cake, Mời bạn định danh trực tuyến ngay trên ứng dụng Cake – Ngân hàng số để có thể thực hiện được các giao dịch và trải nghiệm các tính năng hữu ích của ứng dụng theo hướng dẫn sau:\n1. Bạn vui lòng cài đặt ứng dụng Cake – Ngân hàng số\n2. Chuẩn bị sẵn CCCD và bắt đầu định danh tài khoản theo hướng dẫn:\nBước 1: Mở ứng dụng Cake by VPBank, nhập Số điện thoại và chọn \"Tiếp tục\" để đăng ký\nBước 2: Nhập OTP xác nhận\nBước 3: Xác thực và bổ sung thông tin cá nhân (chụp ảnh mặt trước và ", "product": "kyc"}, {"idx": 212, "x": 13.037056922912598, "y": 6.944849967956543, "q": "Hướng dẫn cập nhật giấy tờ", "a": "Để cập nhật giấy tờ sang CCCD mới, mời bạn chuẩn bị sẵn giấy tờ CCCD, kết nối mạng internet ổn định để cập nhật thông tin theo các bước:\nBước 1: Đăng nhập ứng dụng CAKEBANK, chọn tài khoản tại góc trên bên trái màn hình\nBước 2: Chọn cập nhật giấy tờ \nBước 3: Xác nhận và thao tác theo hướng dẫn trên ứng dụng", "product": "kyc"}, {"idx": 213, "x": 14.772501945495605, "y": 6.556402206420898, "q": "Chưa đủ 18 tuổi đăng ký Cake được không?", "a": "Cám ơn bạn đã quan tâm. Đối với dịch vụ mở tài khoản trực tuyến thì bạn cần đủ 15 tuổi để đăng ký nhé.", "product": "kyc"}, {"idx": 214, "x": 12.55675220489502, "y": 6.865258693695068, "q": "Kiểm tra lịch sử giao dịch", "a": "Để kiểm tra lịch sử giao dịch, chọn Cake/ chọn Giao dịch. Tại đây, bạn có thể kiểm tra tất cả các giao dịch theo ngày: từ rút tiền, chuyển khoản, cho tới thanh toán online hay quẹt thẻ.", "product": "account"}, {"idx": 215, "x": 9.580765724182129, "y": 7.906716823577881, "q": "Giá NAV là gì?", "a": "– Giá trị tài sản ròng (NAV) là tổng giá trị các tài sản và các khoản đầu tư của Quỹ trừ đi tổng giá trị nợ phải trả của Quỹ tại thời điểm định giá.\n– NAV = (Tổng giá trị tài sản – Tổng nợ) / Số lượng chứng khoán phát hành, trong đó: Tổng giá trị tài sản = Tổng giá trị chứng khoán của quỹ tính theo thị giá + tiền mặt.\n– Người ta thường sử dụng chỉ số NAV/đvq (giá trị tài sản ròng của một đơn vị quỹ) để đánh giá giá trị chứng chỉ quỹ trên sổ sách và giá chứng chỉ quỹ mua vào.", "product": "investment"}, {"idx": 216, "x": 9.450563430786133, "y": 7.806725025177002, "q": "Thời gian khớp lệnh đầu tư/ Mua chứng chỉ quỹ như thế nào?", "a": "Các loại Chứng chỉ quỹ sẽ có thời gian khớp lệnh khác nhau (theo ngày hoặc theo tuần);\nThời gian dự kiến khớp lệnh của cty Quỹ, mời bạn tham khảo trên app Cake, mục Đầu tư.\nLưu ý: Thời gian khớp lệnh sẽ nằm trong thời gian giao dịch CCQ theo quy định. Nếu bạn đặt lệnh đầu tư ngoài thời gian giao dịch, lệnh sẽ được xử lý sau và thời gian khớp lệnh sẽ được duyệt sau.", "product": "investment"}, {"idx": 217, "x": 9.373778343200684, "y": 7.846267223358154, "q": "Quỹ mở là gì?", "a": "– Quỹ mở là hình thức ủy thác đầu tư, bao gồm vốn góp của nhiều Nhà đầu tư, được quản lý và đầu tư bởi các chuyên gia đầu tư của quỹ với mục đích gia tăng vốn nhàn rỗi với mức sinh lời ổn định và dài hạn.\n– Quỹ mở là hình thức đầu tư chứng khoán gián tiếp. Thay vì nhà đầu tư tự đầu tư chứng khoán trực tiếp thì họ đầu tư tiền vào quỹ Mở. Quỹ Mở có các chuyên gia đầu tư kinh nghiệm sẽ đầu tư tiền của quỹ vào cổ phiếu, trái phiếu. Nếu đầu tư vào các công ty thì nhà đầu tư sẽ nhận được cổ phiếu, còn", "product": "investment"}, {"idx": 218, "x": 9.633005142211914, "y": 7.408240795135498, "q": "Vì sao số CCQ bị lẻ và tổng tài sản đầu tư không khớp với số tiền chuyển vào ban đầu?", "a": "Số dư CCQ sẽ là số lẻ, được làm tròn đến chữ số thập phân thứ 2. Bạn có thể lấy số tiền bạn tham gia mua chia cho giá NAV quỹ tại kỳ bạn giao dịch sẽ ra được số dư CCQ, nó sẽ là số lẻ. Bạn có thể lấy số dư CCQ đã được làm tròn nhân ngược lại với giá NAV thì số tiền cũng sẽ bị lệch đi 0.000000001% ạ.\nVà hiện tại nhà đầu tư sẽ nắm giữ CCQ, chứ không nắm giữ tiền mặt nữa. Lợi nhuận sẽ sinh ra từ số dư CCQ mà nhà đầu tư đang nắm giữ ạ.\nQuy định về việc CCQ lấy số lẻ và làm tròn 2 chữ số thập phân tạ", "product": "investment"}, {"idx": 219, "x": 13.909238815307617, "y": 3.225238561630249, "q": "Mình có thể sử dụng ngôn ngữ nào trên ứng dụng Cake?", "a": "Bạn có thể sử dụng tiếng Việt trên ứng dụng Cake", "product": "account"}, {"idx": 220, "x": 11.937661170959473, "y": 6.739841938018799, "q": "Tài khoản hoàn tiền (cashback)", "a": "Cashback là tài khoản tiền hoàn theo các chương trình ưu đãi của Cake. Tiền trong cashback được sử dụng để nạp tiền điện thoại, thanh toán hóa đơn, thanh toán dịch vụ trên ứng dụng Be, thanh toán bằng thẻ thanh toán Cake, thanh toán khoản vay... Lưu ý không gửi tiết kiệm, đầu tư, chuyển khoản hoặc rút tiền mặt ra được bạn nhé. Số tiền thanh toán cần nhỏ hơn hoặc bằng số tiền có trong tài khoản Cashback. Khi thanh toán, bạn có thể lựa chọn nguồn tiền ở tài khoản Cashback hoặc tài khoản thanh toán", "product": "account"}, {"idx": 221, "x": 13.490242958068848, "y": 6.407192707061768, "q": "Làm thế nào để đăng xuất khỏi ứng dụng?", "a": "Bạn có thể đăng xuất khỏi ứng dụng bằng cách nhấp vào Tài khoản cá nhân trên Màn hình chính, sau đó chọn “Đăng xuất”.", "product": "account"}, {"idx": 222, "x": 13.537982940673828, "y": 6.783972263336182, "q": "Mình nên làm gì khi tài khoản đăng nhập bị khóa?", "a": "Khi nhập sai thông tin đăng nhập quá 3 lần, Cake sẽ tạm khóa tài khoản đăng nhập để bảo vệ tài khoản của bạn khỏi lượt truy cập trái phép. Bạn chỉ cần thực hiện đổi mật khẩu để có thể sử dụng App bạn nhé!\nĐể thay đổi mật khẩu mới, bạn làm theo hướng dẫn sau nhé:\nBước 1: Tại màn hình đăng nhập, chọn \"Tạo mật khẩu mới\"\nBước 2: Chọn \"Tên đăng nhập\" hoặc \"Quét khuôn mặt\"\nBước 3: Nhập Tên đăng nhập và số CMT/CCCD hoặc Số tài khoản và số CMT/CCCD\nBước 4: Thay đổi mật khẩu và xác minh bằng cách nhập OT", "product": "account"}, {"idx": 223, "x": 9.419816970825195, "y": 7.747303009033203, "q": "Quỹ đầu tư Trái phiếu DC (DCBF)", "a": "Quỹ đầu tư Trái phiếu DC (DCBF) là quỹ hoạt động theo mô hình Quỹ mở chuyên đầu tư vào trái phiếu chọn lọc, GIAO DỊCH VÀO MỖI THỨ 6 HÀNG TUẦN. Quỹ đã có hơn 9 năm hoạt động, với mục tiêu đầu tư nhằm đem lại lợi nhuận ổn định trong dài hạn và an toàn vốn. Lợi nhuận trung bình 5 năm gần nhất (2016 – 2021) là 10%/năm. Lưu ý, kết quả tăng trưởng của quá khứ không cam kết tăng trưởng của tương lai.\nLỢI ÍCH VÀ THÔNG TIN QUỸ DCBF\n- Danh mục đầu tư 100% trái phiếu chọn lọc\n- Phù hợp với nhà đầu tư thận ", "product": "investment"}, {"idx": 224, "x": 11.336081504821777, "y": 6.711082458496094, "q": "Các chi phí khi sử dụng Cake?", "a": "Cake sẽ hoàn toàn không thu phí của bạn, bao gồm:\n– Không phí duy trì với tài khoản đang hoạt động\n– Không phí chuyển tiền đến tất cả ngân hàng\n– Không phí tin nhắn​\n– Không phí phát hành thẻ tín dụng lần đầu, không phí phát hành thẻ thanh toán trực tuyến, mở tài khoản hay giao thẻ\n\nĐối với những giao dịch bằng ngoại tệ, chi phí cho việc chuyển đổi ngoại tệ được quy định theo biểu phí từng thời kỳ.\nLưu ý:\nĐối với các tài khoản không hoạt động, tài khoản ngủ quên thực hiện thu phí theo thông báo ", "product": "account"}, {"idx": 225, "x": 11.804153442382812, "y": 6.668241024017334, "q": "Phí duy trì tài khoản khi sử dụng Cake", "a": "Hiện tại Cake không thu phí duy trì tài khoản đối với tài khoản đang hoạt động, chỉ thu phí dịch vụ đối với tài khoản không hoạt động từ 181 ngày trở lên là 11.000 VNĐ/tháng (đã bao gồm VAT). Phí này chỉ thu tại tài khoản Cashback (là tài khoản tiền thưởng từ các CTKM, không phải là số tiền bạn nạp vào Cake) và ngừng thu phí đến khi số dư Tài khoản Cashback bằng 0. Phí này không áp dụng đối với các Tài khoản thanh toán đang hoạt động, tài khoản thanh toán được kích hoạt (đăng nhập Ứng dụng CAKE ", "product": "account"}, {"idx": 226, "x": 13.623558044433594, "y": 6.848862648010254, "q": "Làm thế nào để thay đổi mật khẩu đăng nhập?", "a": "Để thay đổi mật khẩu mới, bạn làm theo hướng dẫn sau nhé:\nBước 1: Tại màn hình đăng nhập, chọn \"Tạo mật khẩu mới\"\nBước 2: Chọn \"Quét khuôn mặt\"\nBước 3: Nhập Số tài khoản (số điện thoại) và số CMND/CCCD\nBước 4: Quét khuôn mặt, thay đổi mật khẩu và xác minh bằng cách nhập OTP", "product": "account"}, {"idx": 227, "x": 9.4164400100708, "y": 8.016305923461914, "q": "Quỹ đầu tư có rủi ro cao không? Nếu có, rủi ro càng cao, lợi nhuận càng lớn đúng không?", "a": "– Quỹ hiện tại là quỹ trái phiếu, rủi ro thấp, có mức lợi nhuận dự kiến khoảng 6%;\n– Các sản phẩm ra mắt sau là Quỹ cổ phiếu -> chịu ảnh hưởng nhiều bởi biến động thị trường hơn -> rũi ro cao hơn, nhưng lãi suất có thể up to 20%/năm hoặc hơn.\nKhách hàng có thể tham khảo hiệu suất lợi nhuận của chứng chỉ Quỹ theo kết quả kinh doanh quá khứ của công ty Quỹ, khách hàng quyết định chọn đầu tư vào sản phẩm nào của công ty Quỹ theo khẩu vị rủi ro của mình và giao dịch trực tiếp với công ty Quỹ, CAKE c", "product": "investment"}, {"idx": 228, "x": 12.918920516967773, "y": 7.20888090133667, "q": "Rút tiền đầu tư/ Bán chứng chỉ quỹ như thế nào?", "a": "Để rút tiền đầu tư bạn làm theo hướng dẫn sau nhé:\nBước 1: Đăng nhập app Cake, trên màn hình hiển thị, chọn mục \" Đầu tư\"\nBước 2: Chọn \"Bán CCQ\"\nBước 3: Nhập số tiền muốn rút và nhấn \"Tiếp tục\" và \"Xác nhận\"\nBước 4: Nhập mã OTP để xác thực giao dịch và chờ tiền về tài khoản bạn nha!\nLưu ý khi bán CCQ trên app Cake, bạn cần đảm bảo số lượng bán ra tối thiểu như gợi ý trên app.\nKhi thực hiện bán CCQ trên app CAKE, tiền bán sẽ trực tiếp về tài khoản thanh toán của bạn, bạn không cần phải thực hiện ", "product": "investment"}, {"idx": 229, "x": 13.335667610168457, "y": 6.95313024520874, "q": "Cách đổi Smart OTP cho tài khoản", "a": "Để thay đổi Smart OTP bạn vui lòng làm theo hướng dẫn sau:\nBước 1: Đăng nhập app Cakebank, chọn biểu tượng avatar tại góc trên bên trái\nBước 2: Chọn Thay đổi mã PIN Smart OTP\nBước 3: Nhập mã PIN cũ và thực hiện thay đổi theo hướng dẫn trên ứng dụng", "product": "account"}, {"idx": 230, "x": 13.349752426147461, "y": 6.915520668029785, "q": "Cách bật Smart OTP", "a": "Để bật chức năng Smart OTP bạn vui lòng thao tác như sau:\nBước 1: Đăng nhập ứng dụng Cake, vào tài khoản cá nhân bằng cách bấm vào hình đại diện tại góc trái màn hình\nBước 2: Chọn \"Sử dụng Smart OTP\" và quét khuôn mặt để bật tính năng Smart OTP\nBước 3: Nhập mã OTP đã được gửi tới số điện thoại đăng ký\nBước 3: Cài đặt mã PIN OTP và hoàn thiện việc bật tính năng Smart OTP", "product": "account"}, {"idx": 231, "x": 10.187737464904785, "y": 4.802380561828613, "q": "Hạn mức nạp tiền/ chuyển tiền của tài khoản thanh toán", "a": "1. NHẬN TIỀN VÀO TÀI KHOẢN THANH TOÁN/ THẺ CAKE\n- Từ TK VPBank: Theo quy định của VPBank\n- Nộp tiền từ CDM VPBank: Theo quy định của VPBank\n- Nộp tiền tại CN VPBank: Theo quy định của VPBank\n- Nộp tiền từ thẻ ghi nợ nội địa Napas: 20 triệu/lần, 30 triệu/ngày\n- Nhận tiền từ chuyển khoản Napas ngân hàng khác: Theo chính sách ngân hàng thành viên\n2. RÚT TIỀN TỪ TÀI KHOẢN THANH TOÁN/THẺ GHI NỢ VẬT LÝ CAKE\n- Rút tiền tại máy ATM của VPBank: 10 triệu/lần, 50 triệu/ngày\n- Rút tiền tại máy ATM của Ngân ", "product": "account"}, {"idx": 232, "x": 9.55639362335205, "y": 7.694670677185059, "q": "Thời gian tiền về tài khoản sau khi thực hiện lệnh bán chứng chỉ quỹ (CCQ)?", "a": "Các loại chứng chỉ quỹ khác nhau sẽ có thời gian khớp lệnh và cộng tiền khác nhau. Thời gian tiền về dự kiến, mời bạn kiểm tra trực tiếp trên app Cake.\nThời gian tiền về tài khoản cụ thể cho từng CCQ:\n- 3 ngày làm việc cho quỹ cổ phiếu (DCDS, DCBC).\n- 5 ngày làm việc cho quỹ trái phiếu (DCBF).\n- Ngày giao dịch cho DCIP (không tính ngày nghỉ lễ, cuối tuần).", "product": "investment"}, {"idx": 233, "x": 14.610404014587402, "y": 5.521523952484131, "q": "Vì sao số tiền phê duyệt nhỏ hơn số tiền khách hàng đăng ký", "a": "Dựa trên nhu cầu của khách hàng và thông tin khách hàn kê khai, hệ thống sẽ chấm điểm tín dụng của khách hàng. Căn cứ mức điểm tín dụng của khách hàng, ngân hàng sẽ phê duyệt số tiền vay <= số tiền khách hàng đăng ký vay. Do đó có trường hợp khách hàng đăng ký vay và được phê duyệt số tiền vay thấp hơn số tiền đăng ký vay.", "product": "postpay"}, {"idx": 234, "x": 12.356216430664062, "y": 7.339500427246094, "q": "Từ ứng dụng Cake, có những kênh nào mình có thể chuyển tiền đến?", "a": "Từ ứng dụng Cake, bạn có thể chuyển tiền đến:\n\n1. Nội bộ ngân hàng Cake thông qua số tài khoản/ số điện thoại\n2. Các ngân hàng khác thông qua số tài khoản/ số thẻ", "product": "account"}, {"idx": 235, "x": 9.431127548217773, "y": 7.605505466461182, "q": "Quỹ đầu tư Chứng khoán Năng động DC (DCDS)", "a": "Quỹ DCDS là quỹ đại chúng đầu tiên trên thị trường với hơn 18 năm hoạt động. Danh mục đầu tư: Phân bổ chủ yếu vào cổ phiếu. Mục tiêu nhằm tăng trưởng vốn trong dài hạn. Mức lợi nhuận đầu tư bình quân trong vòng 5 năm gần nhất (2016 – 2021) là 22.8%/năm. (*) Lưu ý, kết quả tăng trưởng của quá khứ không phải cam kết tăng trưởng của tương lai.\nLỢI ÍCH VÀ THÔNG TIN QUỸ DCDS\n- Danh mục đầu tư được phân bổ chủ yếu vào cổ phiếu\n- Mục tiêu nhằm tăng trưởng vốn trong thời gian dài hạn với mức độ rủi ro v", "product": "investment"}, {"idx": 236, "x": 14.906272888183594, "y": 5.562385559082031, "q": "Lý do đăng ký vay bị từ chối trên PostPay?", "a": "Có rất nhiều yếu tố dẫn đến việc hồ sơ của KH bị từ chối ví dụ như lịch sử tín dụng xấu hay đang có quá nhiều khoản vay, thu nhập không ổn định hoặc quá thấp... mỗi hồ sơ KH là 1 hồ sơ khác nhau. Ngân hàng dựa trên hệ thống điểm tín dụng của KH để đưa ra kết quả có đủ điều kiện vay ở thời điểm mà KH đăng ký sẽ được phê duyệt hay từ chối, nên nếu khoản vay bị từ chối KH có thể đăng ký lại vào thời điểm khác vì ở thời điểm này KH có thể không đủ điều kiện đăng ký nhưng thời gian khác sau khi KH đư", "product": "postpay"}, {"idx": 237, "x": 9.399415016174316, "y": 4.388605117797852, "q": "Rút tiền  khỏi ví Postpay chỉ được 5.000.000/giao dịch ?", "a": "Hiện tại 1 số ngân hàng liên kết sẽ bị giới hạn giao dịch, để thực hiện giao dịch nạp/rút cao nhất anh/chị có thể liên kết tài khoản với ngân hàng Cake để  giao dịch với hạn mức\n- Tối đa/giao dịch: 210,000,000 vnđ\n- Tối đa/ngày: 420,000,000 vnđ\n- Tối đa/tháng: 1,050,000,000 vnđ\"", "product": "postpay"}, {"idx": 238, "x": 9.40219497680664, "y": 7.907778263092041, "q": "Công ty CP Quản lý quỹ Dragon Capital Việt Nam – DCVFM là ai?", "a": "DCVFM là Quỹ đầu tư lớn và lâu đời tại Việt Nam với tổng tài sản đang quản lý là hơn 7 Tỷ Đô. Bên canh Quỹ có triết lý đầu tư rõ ràng, đội ngũ đầu tư giàu kinh nghiệm sẽ giúp cho Quỹ không bỏ lỡ bất kì cơ hội đầu tư nào bằng chứng là trong 5 năm quỹ đã đạt được mức tăng trưởng lớn tại tất cả các sản phẩm Quỹ mở đang quản lý.", "product": "investment"}, {"idx": 239, "x": 13.734403610229492, "y": 6.8532257080078125, "q": "Tại sao tôi không nhận được OTP đăng nhập?", "a": "Để tăng cường bảo mật tài khoản, số lần nhận OTP đổi mật khẩu tài khoản Cake by VPBank có giới hạn 3 SMS OTP/ ngày, 20 SMS OTP/ 30 ngày. Gato rất tiếc nếu hiện tại bạn đã hết lượt nhận OTP, bạn vui lòng thử lại sau 24h (nếu hết lượt nhận OTP trong ngày) hoặc thử lại vào tháng sau (nếu hết lượt nhận OTP trong tháng). Bạn có thể bật tính năng đăng nhập quét khuôn mặt hoặc quét vân tay để tránh phải đổi mật khẩu thường xuyên do quên mật khẩu nhé!", "product": "account"}, {"idx": 240, "x": 9.565404891967773, "y": 7.54119873046875, "q": "Quỹ đầu tư Trái phiếu Gia tăng Thu nhập Cố định DC (DCIP)", "a": "Quỹ Trái phiếu DCIP nhằm giúp Khách hàng tối ưu hóa nguồn tiền của mình trong thời gian từ 3 tháng – 6 tháng so với việc gửi tiết kiệm thông thường. Mục tiêu nhằm an toàn vốn và linh hoạt về thanh khoản. Lợi nhuận kỳ vọng cao hơn lãi suất tiền gửi kỳ hạn ngắn (3-6 tháng). Rút vốn linh hoạt. Nhận tiền sau 24 giờ (trừ thứ 7, chủ nhật và ngày lễ).\nTHÔNG TIN CHÍNH CỦA QUỸ DCIP\n- Danh mục đầu tư 100% trái phiếu và tiền gửi có kỳ hạn\n- Mục tiêu nhằm an toàn vốn và linh hoạt về thanh khoản\n- Lợi nhuận ", "product": "investment"}, {"idx": 241, "x": 13.627066612243652, "y": 6.3889079093933105, "q": "Mình cần làm gì để bảo vệ tài khoản của mình khỏi đăng nhập trái phép?", "a": "Bạn có thể bảo vệ tài khoản của bạn khỏi những đăng nhập trái phép bằng những cách sau:\n\n1. Thiết lập bảo mật cho ứng dụng Cake qua điện thoại và email dùng để đăng ký tài khoản theo hướng dẫn của nhà cung cấp dịch vụ (Gmail, Yahoo,…)\n2. Không thiết lập mật khẩu quá đơn giản, trùng lặp hoặc liên quan đến thông tin cá nhân được công bố\n3. Thường xuyên thay đổi mật khẩu mỗi 03 tháng\n4. Liên hệ 1900636686 khi có bất kỳ vấn đề hoặc giao dịch bất thường nào\n5. Không tiết lộ mã OTP cho bất kỳ ai", "product": "account"}, {"idx": 242, "x": 9.55799674987793, "y": 4.708654403686523, "q": "Hiện tại đang có chương trình thi đua nào đối với sản phẩm vay nhanh", "a": "Hiện tại đối với sản phẩm Vay nhanh trên Postpay đang có chương trình \"GIẢI NGÂN BỨT PHÁ - ĐÓN TẾT CỰC ĐÃ\" triển khai từ ngày 1/10/2025 đến hết 31/12/2025, áp dụng cho toàn bộ lực lượng bán hàng đã đăng ký tài khoản bán hàng cho sản phẩm Vay nhanh, bao gồm các chương trình:\n\n1. Chương trình thưởng bứt phá cho Nhân viên kinh doanh\nĐối Với mỗi Hồ sơ vay được gán mã giới thiệu hợp lệ:\n- Thưởng thêm 20.000đ/ hồ sơ đăng ký thành công\n- Thưởng thêm 80.000đ/ Hồ sơ giải ngân thành công + có mua bảo hiểm", "product": "postpay"}, {"idx": 243, "x": 13.598742485046387, "y": 6.30935525894165, "q": "Mình nên làm gì khi quên tên đăng nhập?", "a": "Khi quên tên đăng nhập, bạn có thể vui lòng thử đăng nhập bằng tính năng quét khuôn mặt nhé. Trường hợp cần hỗ trợ, mời bạn liên hệ hotlinr 1900 636 686 hoặc email chat@cake.vn.", "product": "account"}, {"idx": 244, "x": 13.664824485778809, "y": 5.997665882110596, "q": "Khi gửi TKOL có xác nhận số dư bản song ngữ cho KH sử dụng đi du lịch nước ngoài không ?", "a": "Cake có cung cấp xác nhận số dư tiết kiệm song ngữ cho KH, KH liên hệ tổng đài Cake (1900 636 686)  để được hỗ trợ nhé", "product": "postpay"}, {"idx": 245, "x": 12.487785339355469, "y": 8.218689918518066, "q": "Có chuyển tiền đi từ ví Postpay được không", "a": "Hiện tại ví chỉ đang hỗ trợ chuyển tiền sang ví Postpay chưa hỗ trợ chuyển tiền sang tài khoản ngân hàng. Bạn có thể chọn thao tác rút tiền để rút tiền về ngân hàng liên kết", "product": "postpay"}, {"idx": 246, "x": 14.820590019226074, "y": 7.761876106262207, "q": "Nhân viên cần làm gì để thực hiện những bước nào trên hệ thống để rút tiền mặt tại quầy bưu điện", "a": "B1: KH thực hiện bấm vào \nRút tiền => Liên hệ hỗ trợ tại quầy GD \n=> nhập số tiền cần rút, hệ thống sẽ sinh 1 mã GD có hiệu lực 30' \nB2: GDV vào web\nhttp://bdvn.postpay.vn\nChọn chi hộ => tạo yêu cầu => nhập mã GD KH cung cấp & thông tin \nB3: KSV vào trang quản trị phê duyệt \nhttp://buudienvn.postpay.vn\nPhân hệ Vận hành dịch vụ \n=> Quản lý yêu cầu \n=> Yêu cầu thu hộ/chi hộ \nB4: GDV xác nhận \nhttp://bdvn.postpay.vn", "product": "postpay"}, {"idx": 247, "x": 9.77922248840332, "y": 7.154479026794434, "q": "Chi phí đầu tư như thế nào?", "a": "Phí mua và phí bán được quy định bởi công ty Quỹ, CAKE không thu phí hỗ trợ chi hộ cho dịch vụ này.\n\nTheo Đối tác DCVFM, hiện tại, NĐT sẽ không mất phí mở tài khoản và phí mua.\nPhí bán sẽ phụ thuộc vào thời gian nắm giữ CCQ và loại CCQ khách hàng nắm giữ.\nThuế sau bán sẽ là 0.1% trên tổng giá trị giao dịch.", "product": "investment"}, {"idx": 248, "x": 13.522717475891113, "y": 6.072762966156006, "q": "Mình phải làm gì khi thiết bị của mình bị thất lạc hay mất cắp?", "a": "Cake rất tiếc nếu bạn không may thất lạc thiết bị hay bị mất cắp. Trong trường hợp này, bạn hãy:\nBước 1: Liên hệ 1900636686 để khoá tài khoản và thẻ ngay lập tức.\nBước 2: Liên hệ với đơn vị cung cấp dịch vụ viễn thông của bạn (Mobifone, Vinaphone, Viettel,…) để yêu cầu khoá số điện thoại di động nhằm tránh mọi giao dịch trái phép.\nBước 3: Để tiếp tục sử dụng dịch vụ của Cake trên thiết bị mới, bạn cần khôi phục lại thẻ SIM và thực hiện mở lại tài khoản.", "product": "account"}, {"idx": 249, "x": 12.268120765686035, "y": 6.879691123962402, "q": "Tài khoản thanh toán Cake là gì?", "a": "Tài khoản thanh toán Cake chính là số điện thoại bạn đăng ký Cake, đây là tài khoản ngân hàng bạn có thể giao dịch rút tiền, thanh toán, gửi tiết kiệm hưởng lãi suất cao, chuyển khoản sang các ngân hàng khác bạn nhé.", "product": "account"}, {"idx": 250, "x": 11.535297393798828, "y": 7.0426716804504395, "q": "Hoa hồng tiết kiệm được tính trên sổ 1 lần hay như thế nào", "a": "Hoa hồng tiết kiệm được tính trên số dư tiết kiệm hàng ngày, do đó nếu sổ còn gửi thì sẽ vẫn được tính hoa hồng cho các ngày tiếp theo, hoặc tháng tiếp theo theo số ngày thực tế gửi của khoản tiền đó.", "product": "postpay"}, {"idx": 251, "x": 13.372309684753418, "y": 6.967151165008545, "q": "Smart OTP cho tài khoản", "a": "Bạn có thể bật Smart OTP theo hướng dẫn sau:\nNhấp vào tài khoản tại góc trên bên trái trên Màn hình chính, sau đó bật nút \"Sử dụng Smart OTP\" và tạo mã PIN 6 số bạn nhé.\nĐể thay đổi mã PIN Smart OTP, nhấp vào tài khoản tại góc trên bên trái trên Màn hình chính, sau đó chọn \"Thay đổi mã PIN Smart OTP\" và thao tác theo hướng dẫn.", "product": "account"}, {"idx": 252, "x": 13.603927612304688, "y": 6.223740577697754, "q": "Khi ở nước ngoài có nhận SMS OTP được không?", "a": "Trường hợp đang ở nước ngoài, bạn vui lòng liên hệ hỗ trợ của nhà mạng đang sử dụng đăng ký dịch vụ Chuyển vùng quốc tế để nhận OTP khi ở nước ngoài nha!", "product": "account"}, {"idx": 253, "x": 9.51229476928711, "y": 4.544925212860107, "q": "Hiện tại đang có chương trình thi đua nào đối với sản phẩm tiết kiệm", "a": "Hiện tại đối với sản phẩm tiết kiệm online đang có chương trình \"“SẮP KẾT NĂM - SĂN THƯỞNG TẾT”\" triển khai từ ngày 1/10/2025 đến hết 31/12/2025, áp dụng cho toàn bộ Lực lượng bán hàng đã đăng ký tài khoản bán hàng cho sản phẩm tiết kiệm, bao gồm các chương trình:\n1. Chương trình “Khách hàng MỚI - Thật tuyệt vời”\n(i)Điều kiện:\n-Khách hàng gửi tiết kiệm trong thời hạn diễn ra chương trình\n- Số tiền gửi từ 10 triệu và kỳ hạn từ 6 tháng trở lên, không rút trước hạn toàn bộ tiền gửi trong suốt thời ", "product": "postpay"}, {"idx": 254, "x": 13.312368392944336, "y": 8.205916404724121, "q": "Cake là gì", "a": "CAKE by VPBank là một trong các kênh ngân hàng điện tử của VPBank. Các sản phẩm, dịch vụ ngân hàng được VPBank triển khai trên kênh ngân hàng điện tử này được gắn với thương hiệu CAKE. Sứ mệnh của mình là không ngừng đổi mới vì một trải nghiệm ngân hàng số đáp ứng mọi nhu cầu trong cuộc sống hàng ngày của bạn.", "product": "account"}, {"idx": 255, "x": 13.683493614196777, "y": 6.61224365234375, "q": "Hướng dẫn đăng nhập", "a": "Chào bạn, hiện tại bạn có thể đă stpay"}, {"idx": 353, "x": 15.14774227142334, "y": 6.691781997680664, "q": "Đã gửi yêu cầu tạo tài khoản từ lâu mà không có tài khoản truy cập hệ thống quản lý bán hàng trên PostPay", "a": "Có thể việc tạo tài khoản không thành công vì nhiều lý do (thông tin chưa đầy đủ, không định danh được mã bưu cục, số điện thoại đã được NVKD khác sử dụng đăng ký, email đã được NVKD khác sử dụng đăng ký....).\nCách nhanh và hiệu quả nhất để ghi nhận được doanh thu cho NVKD là đơn vị tổng hợp thông tin đầy đủ và gửi lại yêu cầu tạo tài khoản.\n(Cũng có thể kiểm tra lại xem đã nhận được tài khoản truy cập chưa bằng cách: \nKiểm tra trong thư mục thư rác/spam nếu không tìm thấy email\nTrong trường hợp", "product": "postpay"}, {"idx": 354, "x": 14.079346656799316, "y": 7.182685852050781, "q": "Giới thiệu chung về Sản phẩm cho vay trực tuyến trên ví PostPay", "a": "Hiện nay trên ví điện tử PostPay đang triển khai sản phẩm cho vay trực tuyến Vay nhanh dành cho khách hàng cá nhân với thủ tục đăng ký, giải ngân online nhanh chóng và lãi suất cạnh tranh. Xin mời anh, chị truy cập ví PostPay trải nghiệm ngay!", "product": "postpay"}, {"idx": 355, "x": 11.274894714355469, "y": 7.36094856262207, "q": "Có thể rút 1 phần tiền gửi trên Postpay không", "a": "Bạn có thể rút 1 phần tiền gửi hoặc rút toàn bộ giá trị tiền gửi", "product": "postpay"}, {"idx": 356, "x": 15.388482093811035, "y": 6.53782320022583, "q": "Có thể thay đổi phân quyền xem báo cáo từ NVKD thành quản lý cấp tỉnh hoặc cấp huyện được không", "a": "Bạn có thể thay đổi phân quyền xem báo cáo từ NVKD sang quản lý cấp tỉnh hoặc quản lý cấp huyện hoặc ngược lại nhé ạ. Bạn đăng ký lại user bán hàng với phân quyền xem báo cáo mới ghi rõ lý do ở cột ghi chú, rồi gửi lại cho đầu mối của TCT như trong văn bản triển khai nhé ạ.", "product": "postpay"}, {"idx": 357, "x": 15.957962989807129, "y": 6.476650714874268, "q": "Cách ghi nhận doanh thu cho BĐT trên ví Postpay là như thế nào", "a": "Lúc mở ví/ mở tiết kiệm Khách hàng có nhập mã giới 61151123047, "y": 7.335477828979492, "q": "Liên kết với tài khoản CAKE by VPBank gặp lỗi Bưu tá/CTV/Đại lý trên ví Postpay nhưng liên kết ngân hàng bằng đối tượng cá nhân", "a": "Thực hiện đăng nhập App PostPay -> Chọn \"Tài Khoản\" -> chọn \"Tài khoản PostPay\" -> chọn \"Nâng hạn mức\" -> tiếp tục hoàn thành các bước -> Thoát ra & đăng nhập lại ->Liên kết theo đối tượng CTV/ Bưu tá.", "product": "postpay"}, {"idx": 420, "x": 12.886261940002441, "y": 8.251252174377441, "q": "Tôi có thể rút tiền miễn phí từ thẻ Visa Debit tại ATM của những ngân hàng nào?", "a": "Hiện tại thẻ Visa Debit đang hỗ trợ rút tiền miễn phí tại 7 ngân hàng sau:\n1. Ngân hàng TMCP Đầu Tư & Phát Triển Việt Nam (BIDV)\n2. Ngân hàng TMCP Á Châu (ACB)\n3. Ngân hàng TMCP Sài Gòn Thương Tín (Sacombank)\n4. Ngân hàng TMCP Kỹ Thương (Techcombank)\n5. Ngân hàng TMCP Việt Nam Thịnh Vượng (VPbank)\n6. Ngân hàng TMCP Sài Gòn Hà Nội (SHB)\n7. Ngân hàng HSBC", "product": "card"}, {"idx": 421, "x": 10.677810668945312, "y": 4.556025505065918, "q": "Các loại phí thẻ Thanh toán/ thẻ ghi nợ debit card là gì?", "a": "Các loại phí trên thẻ thanh toán/ thẻ ghi nợ Debit card: \nPhí phát hành & phát hành lại thẻ trực tuyến: Không thu phí\nPhí phát hành & phát hành lại thẻ vật lý: 165.000 VNĐ/thẻ (đã bao gồm VAT)\nPhí thường niên: Không thu phí\nPhí giao dịch ngoại tệ *: 4.4% giá trị giao dịch (đã bao gồm VAT)\nPhí giao dịch nội tệ ở nước ngoài**: 4.4% giá trị giao dịch (đã bao gồm VAT)\n(*) Áp dụng cho các giao dịch khác VND\n(**) Áp dụng cho các giao dịch bằng VND được thực hiện tại đơn vị bán hàng có mã nước khác Việ", "product": "card"}, {"idx": 422, "x": 13.600889205932617, "y": 6.106815814971924, "q": "Liên kết với tài khoản CAKE by VPBank trên ví Postpay gặp lỗi số điện thoại không khớp với tài khoản ngân hàng", "a": "Để thực hiện đổi SĐT của tài khoản tại CAKE, thực hiện theo các bước:\nChuẩn bị CCCD, kết nối mạng mạnh và ổn định trong môi trường đủ ánh sáng và yên tĩnh.\nThực hiện tải app CAKE, đăng nhập bằng SĐT cũ sau đó thao tác:\n1. Chọn Biểu tượng hồ sơ (avatar hoặc tên của anh chị ở góc trên bên trái)\n2. Chọn Đổi số điện thoại\n3. Bấm Cập nhật ngay và thực hiện quay video theo hướng dẫn\nLưu ý: Trong trường hợp không thao tác được, liên hệ tổng đài CAKE (1900 636 686) để được hỗ trợ đổi SĐT", "product": "postpay"}, {"idx": 423, "x": 11.028848648071289, "y": 4.0817484855651855, "q": "Làm thế nào để xem mật khẩu email sao kê thẻ tín dụng?", "a": "Mật khẩu email sao kê tín dụng là ngày tháng năm sinh - ddmmyyyy và 4 số cuối cùng trên Thẻ tín dụng.\nVí dụ KH sinh ngày 15/9/1999, 4 số cuối thẻ là 1234 thì mật khẩu là 150919991234", "product": "card"}, {"idx": 424, "x": 13.332935333251953, "y": 7.737735748291016, "q": "Mối quan hệ giữa VietnamPost và CAKE by VPBank", "a": "CAKE by VPBank là đối tác của VIETNAMPOST, cung cấp các sản phẩm \"Tiết kiệm online trên Ứng dụng Postpay\"  và \"Vay nhanh trên Ứng dụng Postpay\" trên mạng lưới của VIETNAMPOST", "product": "postpay"}, {"idx": 425, "x": 11.378251075744629, "y": 4.134527206420898, "q": "Các loại thẻ tín dụng ở Cake có những loại nào?", "a": "Thẻ tín dụng (Credit card) là thẻ cho phép chủ thẻ thực hiện giao dịch thẻ trong phạm vi hạn mức tín dụng đã được cấp theo thỏa thuận với tổ chức phát hành thẻ. Nói một cách đơn giản, thẻ tín dụng là loại thẻ giúp bạn mua hàng trước và thanh toán lại cho ngân hàng sau.\nHiện tại khách hàng có thể phát hành thẻ tín dụng Cake Freedom 2in1 dễ dàng ngay trên ứng dụng Cake với tính năng Tích hợp 2 trong 1: Kết hợp cả thẻ ghi nợ quốc tế và thẻ tín dụng trên cùng một chiếc thẻ, tiện lợi cho mọi nhu cầu ", "product": "card"}, {"idx": 426, "x": 9.830209732055664, "y": 4.399135589599609, "q": "Các loại phí thẻ Freedom và VieOn là gì?", "a": "Các loại phí của thẻ Freedom và VieOn, Hiệu lực Biểu phí thẻ Freedom và thẻ VieOn Cake: Từ 01/06/2025\nPhí phát hành lần đầu: Miễn phí\nPhí thường niên thẻ chính: 599.000 đồng\nĐiều kiện Miễn phí thường niên (thẻ chính): Chi tiêu hợp lệ từ 150 triệu đồng/năm. (Không gồm MCC 4900, 4111, 5541).\nQuy định và thời gian thu phí thường niên: Phí thường niên sẽ được thu trong kì sao kê của tháng đầu tiên thuộc chu kì năm. Đối với Khách hàng đáp ứng điều kiện hoàn phí thường niên, số tiền phí đã thu sẽ được", "product": "card"}, {"idx": 427, "x": 10.339059829711914, "y": 4.000455856323242, "q": "Phí thường niên của thẻ Be Cake là bao nhiêu?", "a": "- Phí thường niên thẻ Be Cake:\n▪️ Phí thường niên 299.000đ/năm (chưa gồm VAT).\n▪️ Hoàn phí thường niên nếu Khách hàng đạt tổng chi tiêu hợp lệ từ 100 triệu đồng trong năm đó. Các giao dịch có mã MCC 4900 (Dịch vụ tiện ích), MCC 4111 (Vận tải hành khách) và MCC 5541 (Xăng dầu) không được tính vào tổng chi tiêu hợp lệ.\n▪️ Phí thường niên sẽ được thu trong kì sao kê của tháng đầu tiên thuộc chu kì năm. Đối với Khách hàng đáp ứng điều kiện hoàn phí thường niên, số tiền phí đã thu sẽ được hoàn trả và", "product": "card"}, {"idx": 428, "x": 11.81396198272705, "y": 6.724784851074219, "q": "Làm thế nào để xem sao kê cashback của thẻ tín dụng?", "a": "Tiền hoàn được chuyển vào Tài khoản Cake (Cashback) vào ngày 20 của tháng T+1 (tháng kế tiếp kỳ sao kê T). Trường hợp ngày 20 rơi vào Thứ 7, Chủ Nhật hoặc ngày nghi lễ, tiền hoàn sẽ được chuyển vào ngày làm việc tiếp theo. Sử dụng để thanh toán mua sắm/dịch vụ trên Ứng dụng Cake by VPBank hoặc thanh toán dư nợ qua Ứng dụng Cake by VPBank. Không rút tiền mặt, không chuyển khoản. Hiển thị ở mục \"Tiền Cashback\" trong Ứng dụng.", "product": "card"}, {"idx": 429, "x": 11.333399772644043, "y": 4.014294147491455, "q": "Làm thế nào để phát hành thẻ tín dụng?/ Mở thẻ tín dụng / Cách mở thẻ tín dụng", "a": "Hiện khách hàng có thể mở thẻ Cake Freedom 2in1 trên app Cake. Để mở thẻ tín dụng Cake Freedom 2in1, bạn thao tác như sau: \n- Bước 1: Tại màn hình trang chủ, chọn Thẻ tự do 2in1\n- Bước 2: Thực hiện quét khuôn mặt theo yêu cầu\n- Bước 3: Chọn mẫu thẻ yêu thích\n- Bước 4: Điền thông tin theo yêu cầu và chọn \"Tiếp tục\"\n- Bước 5: Chờ kết quả phê duyệt trong 2 phút\nSau khi bạn phát hành thẻ tín dụng thì trên app sẽ chỉ còn loại thẻ bạn đã phát hành\nNếu bạn chưa đăng ký thẻ thành công thì sau 7 ngày, bạ", "product": "card"}, {"idx": 430, "x": 11.326627731323242, "y": 4.030237197875977, "q": "Làm thế nào để khóa thẻ tín dụng của tôi?", "a": "Các bước khóa thẻ tín dụng trên app Cake: \n- Bước 1: Tại màn hình trang chủ, chọn hình Thẻ cần khóa\n- Bước 2: Chọn Khóa thẻ tại màn hình Quản lý thẻ\nTrường hợp thẻ của bạn thất lạc, hay nghi ngờ lộ thông tin, bạn không khóa được thẻ trên ứng dụng, bạn vui lòng liên hệ trực tiếp tổng đài 1900 636 686 hoặc email chat@cake,vn để được hỗ trợ", "product": "card"}, {"idx": 431, "x": 12.731491088867188, "y": 7.838328838348389, "q": "Liên kết với thẻ ATM ghi nợ nội địa trong hệ thống liên kết thẻ Napas  trên ví Postpay", "a": "Để liên kết với thẻ ATM ghi nợ nội địa, thực hiện các bước:\nBước 1: Chọn Thêm Liên kết ở Trang chủ ví PostPay\nBước 2: Chọn Ngân hàng ở mục liên kết qua thẻ ATM nội địa (Napas)\nBước 3: Nhập số thẻ & ngày hết hạn của thẻ\nBước 4: Nhập mã xác thực\nBước 5: Nhận kết quả thành công liên kết ví và tài khoản", "product": "postpay"}, {"idx": 432, "x": 13.174955368041992, "y": 7.663670063018799, "q": "Cần làm gì để sử dụng dịch vụ của ví PostPay", "a": "\"Tải ứng dụng, đăng ký ví PostPay và sử dụng các dịch vụ trên ví\n1. Tải Ứng dụng PostPay\n2. Chọn Đăng nhập/Đăng ký\n3. Thực hiện các bước tạo tài khoản ví (trong các bước này đã bao gồm bước tạo tài khoản CAKE byVPBank và liên kết với TK CAKE by VPBank)\"", "product": "postpay"}, {"idx": 433, "x": 11.167472839355469, "y": 5.108225345611572, "q": "Làm thế nào để hoàn tiền linh hoạt cho thẻ tín dụng?", "a": "Với Hoàn tiền linh hoạt thẻ, mỗi kỳ sao kê, bạn cần chọn đủ 2 danh mục chi tiêu trong mục Hoàn tiền của thẻ tín dụng Cake trên ứng dụng CAKE BANK.\n\nCách chọn và thay đổi danh mục:\n+ Nếu chưa từng đăng ký, bạn có thể chọn danh mục cho kỳ sao kê hiện tại (tháng T) bất kỳ lúc nào trong tháng T.\n→ hí thường niên sẽ được thu trong kì sao kê của tháng đầu tiên thuộc chu kì năm. Đối với Khách hàng đáp ứng điều kiện hoàn phí thường niên, số tiền phí đã thu sẽ được hoàn trả vào Tài khoản Cake của Khách", "product": "card"}, {"idx": 438, "x": 13.01786994934082, "y": 7.648166179656982, "q": "Cách đăng ký Ví PostPay", "a": "\"Để đăng kí ví Postpay,Thực hiện các bước :\n1. Tải Ứng dụng Postpay\n2. Chọn Đăng nhập/Đăng ký\n3. Thực hiện các bước tạo tài khoản ví (trong các bước này đã bao gồm bước tạo tài khoản CAKE byVPBank và liên kết với TK CAKE by VPBank)\"", "product": "postpay"}, {"idx": 439, "x": 13.025797843933105, "y": 7.203600883483887, "q": "Đổi thông tin GTTT đăng ký trên Ứng dụng PostPay bằng cách nào", "a": "Để thực hiện đổi giấy tờ tuỳ thân trên ví Postpay, thực hiện các bước:\nBước 1: Chọn Tài khoản\nBước 2: Chọn Thay đổi Giấy tờ tùy thân\nBước 3: Thực hiện các bước theo luồng cập nhật thông tin", "product": "postpay"}, {"idx": 440, "x": 10.207483291625977, "y": 4.655012607574463, "q": "Làm thế nào để kiểm tra hạn mức giao dịch của thẻ?", "a": "Hạn mức giao dịch của thẻ tín dụng là \nLoại giao dịch:\nGiao dịch tại ATM: Tối đa 85% hạn mức tín dụng, tối đa 100 triệu trong nước và 30 triệu tại nước ngoài. Tối đa 10 lần/ngày\nGiao dịch quẹt POS: tối đa 400 triệu/ngày;  Tối đa 50 lần/ngày\nGiao dịch Ecom: tối đa 400 triệu/ngày.Tối đa 50 lần/ngày \nLưu ý:\nTheo tỷ giá ngoại tệ quy đổi tại thời điểm giao dịch.\nĐối với khách hàng định danh bằng hình thức e-KYC: Số tiền giao dịch tối đa 100 triệu đồng/tháng, không được thực hiện thanh toán quốc tế, r", "product": "card"}, {"idx": 441, "x": 14.311055183410645, "y": 6.779128074645996, "q": "Gặp lỗi tài khoản ví điện tử khoản không hợp lệ  trên ví Postpay", "a": "Khi gặp lỗi tài khoản không hợp lệ, Thực hiện xóa ví PostPay đi sau đó đăng ký và định danh ví lại từ đầu", "product": "postpay"}, {"idx": 442, "x": 11.733193397521973, "y": 5.393890380859375, "q": "Làm thế nào để biết được khoản thanh toán tối thiểu và ngh                     mode: 'markers',
                    type: 'scatter',
                    name: product || 'other',
                    marker: {
                        size: 7,
                        color: colors[i % colors.length],
                        opacity: 0.7,
                        line: { width: 1, color: '#fff' }
                    },
                    hovertemplate: '%{customdata}<extra></extra>'
                };
            });

            const layout = {
                margin: { l: 40, r: 20, t: 20, b: 40 },
                xaxis: { title: '', showgrid: true, gridcolor: '#eee', zeroline: false },
                yaxis: { title: '', showgrid: true, gridcolor: '#eee', zeroline: false },
                legend: { orientation: 'h', y: -0.15, font: { family: 'IBM Plex Mono', size: 10 } },
                dragmode: 'lasso',
                hovermode: 'closest',
                paper_bgcolor: '#fff',
                plot_bgcolor: '#fff'
            };

            const config = {
                responsive: true,
                displayModeBar: true,
                modeBarButtonsToRemove: ['autoScale2d', 'hoverClosestCartesian', 'hoverCompareCartesian'],
                displaylogo: false
            };

            Plotly.newPlot('plot', traces, layout, config);

            // Click handler
            document.getElementById('plot').on('plotly_click', function(data) {
                const idx = data.points[0].customdata;
                toggleSelection(idx);
            });

            // Lasso selection handler
            document.getElementById('plot').on('plotly_selected', function(data) {
                if (data && data.points && data.points.length > 0) {
                    selectedIndices.clear();
                    data.points.forEach(p => selectedIndices.add(p.customdata));
                    renderTextList();
                    updatePlotSelection();
                    updateStatus();
                }
            });

            // Double-click to clear selection
            document.getElementById('plot').on('plotly_doubleclick', function() {
                clearAllSelections();
            });

            // Deselect event (clicking empty space after lasso)
            document.getElementById('plot').on('plotly_deselect', function() {
                clearAllSelections();
            });
        }

        // Clear all selections and reset view
        function clearAllSelections() {
            selectedIndices.clear();
            highlightedIndices.clear();

            // Reset plot opacity and size
            const products = [...new Set(DATA.map(d => d.product))];
            products.forEach((product, traceIdx) => {
                const points = DATA.filter(d => d.product === product);
                Plotly.restyle('plot', {
                    'marker.opacity': [points.map(() => 0.7)],
                    'marker.size': [points.map(() => 7)]
                }, [traceIdx]);
            });

            renderTextList();
            updateStatus();
        }

        // Render text list
        function renderTextList() {
            const container = document.getElementById('text-list');

            let filtered = DATA;

            // Filter by product
            if (activeProduct) {
                filtered = filtered.filter(d => d.product === activeProduct);
            }

            // Filter by search
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filtered = filtered.filter(d =>
                    (d.q && d.q.toLowerCase().includes(term)) ||
                    (d.a && d.a.toLowerCase().includes(term))
                );
                highlightedIndices = new Set(filtered.map(d => d.idx));
            } else {
                highlightedIndices.clear();
            }

            // Sort: selected first, then by index
            filtered.sort((a, b) => {
                const aSelected = selectedIndices.has(a.idx);
                const bSelected = selectedIndices.has(b.idx);
                if (aSelected !== bSelected) return bSelected - aSelected;
                return a.idx - b.idx;
            });

            container.innerHTML = filtered.map(d => {
                const isSelected = selectedIndices.has(d.idx);
                const isHighlighted = highlightedIndices.has(d.idx);

                let q = escapeHtml(d.q || '');
                let a = escapeHtml(d.a || '');

                // Highlight search term
                if (searchTerm) {
                    const regex = new RegExp(`(${escapeRegex(searchTerm)})`, 'gi');
                    q = q.replace(regex, '<span class="highlight">$1</span>');
                    a = a.replace(regex, '<span class="highlight">$1</span>');
                }

                return `
                    <div class="text-item ${isSelected ? 'selected' : ''} ${isHighlighted && !isSelected ? 'highlighted' : ''}"
                         data-idx="${d.idx}"
                         onclick="toggleSelection(${d.idx})">
                        <div class="idx">#${d.idx} ${d.product ? `<span class="product-tag">${d.product}</span>` : ''}</div>
                        <div class="question">${q}</div>
                        <div class="answer">${a}</div>
                    </div>
                `;
            }).join('');

            document.getElementById('showing-count').textContent = `Showing: ${filtered.length}`;
        }

        // Render product filter buttons
        function renderProductFilters() {
            const products = [...new Set(DATA.map(d => d.product).filter(Boolean))];
            const container = document.getElementById('product-filters');

            container.innerHTML = `
                <button class="filter-btn ${!activeProduct ? 'active' : ''}" onclick="filterByProduct(null)">All</button>
                ${products.map(p => `
                    <button class="filter-btn ${activeProduct === p ? 'active' : ''}" onclick="filterByProduct('${p}')">${p}</button>
                `).join('')}
            `;
        }

        // Toggle point selection
        function toggleSelection(idx) {
            if (selectedIndices.has(idx)) {
                selectedIndices.delete(idx);
            } else {
                selectedIndices.add(idx);
            }
            renderTextList();
            updatePlotSelection();
            updateStatus();
        }

        // Update plot to show selection
        function updatePlotSelection() {
            const updates = DATA.map(d => ({
                opacity: selectedIndices.size === 0 ? 0.7 : (selectedIndices.has(d.idx) ? 1 : 0.2),
                size: selectedIndices.has(d.idx) ? 10 : 7
            }));

            // Group by trace (product)
            const products = [...new Set(DATA.map(d => d.product))];
            products.forEach((product, traceIdx) => {
                const points = DATA.filter(d => d.product === product);
                Plotly.restyle('plot', {
                    'marker.opacity': [points.map(d => selectedIndices.size === 0 ? 0.7 : (selectedIndices.has(d.idx) ? 1 : 0.2))],
                    'marker.size': [points.map(d => selectedIndices.has(d.idx) ? 10 : 7)]
                }, [traceIdx]);
            });
        }

        // Filter by product
        function filterByProduct(product) {
            activeProduct = product;
            renderProductFilters();
            renderTextList();
        }

        // Update status bar
        function updateStatus() {
            const status = document.getElementById('status-text');
            if (selectedIndices.size > 0) {
                status.textContent = `${selectedIndices.size} selected (click to deselect)`;
            } else {
                status.textContent = 'Click points or use lasso to select';
            }
        }

        // Setup event listeners
        function setupEventListeners() {
            const searchInput = document.getElementById('search');

            // Real-time search
            searchInput.addEventListener('input', (e) => {
                searchTerm = e.target.value;
                renderTextList();
                highlightPlotPoints();
            });

            // Clear selection on Escape
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchTerm = '';
                    searchInput.value = '';
                    activeProduct = null;
                    renderProductFilters();
                    clearAllSelections();
                }
            });
        }

        // Highlight matching points on plot
        function highlightPlotPoints() {
            const products = [...new Set(DATA.map(d => d.product))];
            products.forEach((product, traceIdx) => {
                const points = DATA.filter(d => d.product === product);
                Plotly.restyle('plot', {
                    'marker.opacity': [points.map(d => {
                        if (highlightedIndices.size === 0) return 0.7;
                        return highlightedIndices.has(d.idx) ? 1 : 0.15;
                    })],
                    'marker.size': [points.map(d => highlightedIndices.has(d.idx) ? 10 : 7)]
                }, [traceIdx]);
            });
        }

        // Utilities
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function escapeRegex(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // Start
        init();
    </script>
</body>
</html>
