<html lang="en">
<head>

  <meta charset="UTF-8">
  <title>Inkflow – Focus Mode</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✒️</text></svg>">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fffff8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Inkflow">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap');

    :root {
      --font-content: 'Inter', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --bg-color: #fffff8;
      --text-color: #2b2b2b;
      --placeholder-color: #a8a8a8;
      --selection-bg: #d4e4f7;
      --button-bg: rgba(0, 0, 0, 0.04);
      --button-hover-bg: rgba(0, 0, 0, 0.08);
      --button-icon: '☀️';
      --stats-bg: rgba(255, 255, 248, 0.9);
      --stats-text: #6b6b6b;
      --stats-border: rgba(0, 0, 0, 0.06);
      --panel-bg: #ffffff;
      --panel-border: rgba(0, 0, 0, 0.1);
      --agent-icon: '✨';
      --accent-color: #4a90e2;
    }

    body.dark-mode {
      --bg-color: #1a1a1a;
      --text-color: #d8d8d8;
      --placeholder-color: #5a5a5a;
      --selection-bg: #3d4f5f;
      --button-bg: rgba(255, 255, 255, 0.08);
      --button-hover-bg: rgba(255, 255, 255, 0.15);
      --button-icon: '🌙';
      --stats-bg: rgba(26, 26, 26, 0.9);
      --stats-text: #8a8a8a;
      --stats-border: rgba(255, 255, 255, 0.06);
      --panel-bg: #242424;
      --panel-border: rgba(255, 255, 255, 0.1);
      --accent-color: #5da3f5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: var(--font-ui);
      background: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    #editor {
      width: 100%;
      height: 100vh;
      padding: 6vh max(5vw, calc((100vw - 68ch) / 2)) 10vh;
      border: none;
      resize: none;
      outline: none;
      background: transparent;
      color: inherit;
      font-family: var(--font-content);
      font-size: 1.1rem;
      line-height: 1.7;
      overflow-y: auto;
      caret-color: var(--text-color);
      white-space: pre-wrap;
      tab-size: 4;
    }

    #editor::placeholder { color: var(--placeholder-color); opacity: 1; }
    ::selection { background: var(--selection-bg); }

    #stats-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 0.6rem max(5vw, calc((100vw - 68ch) / 2));
      background: var(--stats-bg);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--stats-border);
      color: var(--stats-text);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      text-align: center;
      user-select: none;
      z-index: 5;
    }

    .top-buttons {
      position: fixed;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      background: var(--button-bg);
      border: none;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      opacity: 0.5;
      transition: all 0.2s;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover { background: var(--button-hover-bg); opacity: 1; transform: scale(1.08); }
    #theme-toggle::before { content: var(--button-icon); }
    #agent-toggle::before { content: var(--agent-icon); }
    #share-toggle::before { content: '🔗'; }

    /* Agent Panel */
    #agent-panel {
      position: fixed;
      top: 70px;
      right: 15px;
      width: min(420px, calc(100vw - 30px));
      max-height: calc(100vh - 140px);
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      display: none;
      flex-direction: column;
      gap: 1rem;
      z-index: 9;
      overflow-y: auto;
    }

    #agent-panel.active { display: flex; }

    /* Share Panel */
    #share-panel {
      position: fixed;
      top: 70px;
      right: 15px;
      width: min(360px, calc(100vw - 30px));
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      display: none;
      flex-direction: column;
      gap: 1rem;
      z-index: 9;
    }

    #share-panel.active { display: flex; }

    #qr-container {
      display: flex;
      justify-content: center;
      padding: 1rem;
      background: white;
      border-radius: 8px;
    }

    #qr-container svg {
      max-width: 200px;
      max-height: 200px;
    }

    #share-url {
      width: 100%;
      padding: 0.6rem;
      background: var(--button-bg);
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      color: var(--text-color);
      font-family: var(--font-ui);
      font-size: 0.75rem;
      word-break: break-all;
      max-height: 80px;
      overflow-y: auto;
    }

    .share-stats {
      font-size: 0.75rem;
      color: var(--stats-text);
      text-align: center;
    }

    .section-divider {
      border-top: 1px solid var(--panel-border);
      margin: 0.5rem 0;
    }

    .preset-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .preset-btn, .action-btn {
      padding: 0.5rem 0.75rem;
      background: var(--button-bg);
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      font-size: 0.85rem;
      font-family: var(--font-ui);
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-color);
    }

    .preset-btn:hover, .action-btn:hover { background: var(--button-hover-bg); }

    .action-btn.primary {
      background: var(--accent-color);
      color: white;
      border-color: var(--accent-color);
    }

    .action-btn.primary:hover { opacity: 0.9; }

    textarea, input {
      width: 100%;
      padding: 0.6rem;
      background: var(--button-bg);
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      color: var(--text-color);
      font-family: var(--font-ui);
      font-size: 0.9rem;
      resize: vertical;
      outline: none;
    }

    #custom-prompt { min-height: 80px; }

    #agent-result, #coach-result {
      min-height: 150px;
      max-height: 300px;
      overflow-y: auto;
      padding: 1rem;
      background: var(--button-bg);
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      font-family: var(--font-content);
      font-size: 0.9rem;
      line-height: 1.6;
      display: none;
      white-space: pre-wrap;
    }

    #agent-result.active, #coach-result.active { display: block; }

    .button-row { display: flex; gap: 0.5rem; }

    #loading {
      display: none;
      text-align: center;
      color: var(--stats-text);
      font-size: 0.85rem;
    }

    #loading.active { display: block; }

    .label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--stats-text);
      margin-bottom: 0.3rem;
      letter-spacing: 0.02em;
    }

    .label.clickable {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .label.clickable::after {
      content: '▼';
      font-size: 0.7rem;
      transition: transform 0.2s;
    }

    .label.clickable.collapsed::after { transform: rotate(-90deg); }
    .label.clickable:hover { color: var(--text-color); }

    .collapsible-section { display: flex; flex-direction: column; gap: 0.5rem; }
    .collapsible-section.collapsed { display: none; }

    .settings-link {
      font-size: 0.75rem;
      color: var(--stats-text);
      text-decoration: underline;
      cursor: pointer;
    }

    .settings-link:hover { color: var(--text-color); }

    .progress-badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      background: var(--accent-color);
      color: white;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .coach-buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.5rem;
    }

    .warning-text {
      font-size: 0.7rem;
      color: #e57373;
      text-align: center;
    }
  </style>
</head>
<body>
  <textarea id="editor" placeholder="Just write… (Tab=Quote, Ctrl/Cmd+U=Underline)" spellcheck="true" autofocus></textarea>
  <div id="stats-bar">0 words · 0 characters · 1 line</div>
   
  <div class="top-buttons">
    <button id="share-toggle" class="icon-btn" aria-label="Share via URL/QR"></button>
    <button id="agent-toggle" class="icon-btn" aria-label="Toggle agent"></button>
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme"></button>
  </div>

  <!-- Share Panel -->
  <div id="share-panel">
    <div class="label">Share via URL</div>
    <div id="qr-container"></div>
    <div id="share-url"></div>
    <div class="share-stats" id="share-stats"></div>
    <div class="warning-text" id="qr-warning" style="display: none;">⚠️ Content too long for QR (~2.5KB max). Use URL instead.</div>
    <div class="button-row">
      <button id="copy-url" class="action-btn primary" style="flex: 1;">Copy URL</button>
      <button id="clear-url" class="action-btn" style="flex: 1;">New Draft</button>
    </div>
  </div>

  <div id="agent-panel">
    <!-- Quick Actions -->
    <div class="label">Quick Actions</div>
    <div class="preset-buttons">
      <button class="preset-btn" data-prompt="Review this text critically. Point out weak arguments, unclear phrasing, logical gaps, and areas for improvement. Be direct and constructive.">Criticize</button>
      <button class="preset-btn" data-prompt="Revise this text to improve clarity, flow, and impact. Keep the core message but make it sharper and more compelling.">Revise</button>
      <button class="preset-btn" data-prompt="Summarize this text in three resolutions: 5 words | 15 words | 30 words.">Summarize</button>
      <button class="preset-btn" data-prompt="Rewrite this in a professional, formal tone suitable for business communication.">Professional Tone</button>
      <button class="preset-btn" data-prompt="Translate this to Vietnamese while preserving the original tone and nuance.">→ Vietnamese</button>
      <button class="preset-btn" data-prompt="Translate this to English while preserving the original tone and nuance.">→ English</button>
    </div>

    <!-- Custom Prompt (Collapsible) -->
    <div class="label clickable" id="custom-prompt-toggle">Custom Prompt</div>
    <div class="collapsible-section collapsed" id="custom-prompt-section">
      <textarea id="custom-prompt" placeholder="Or write your own prompt..."></textarea>
      <button id="run-agent" class="action-btn">Run Agent</button>
    </div>

    <!-- Agent Results -->
    <div id="loading">Processing...</div>
    <div id="agent-result"></div>
    <div class="button-row" id="agent-actions" style="display: none;">
      <button id="copy-result" class="action-btn">Copy Result</button>
      <button id="export-json" class="action-btn">Export JSON</button>
    </div>

    <div class="section-divider"></div>

    <!-- Daily Writing Coach -->
    <div class="label">
      Daily Writing Coach – PG Style
      <span id="streak-badge" class="progress-badge" style="margin-left: 0.5rem;">Day 0</span>
    </div>

    <div class="coach-buttons">
      <button id="insert-patterns" class="action-btn primary">Insert Pattern Practice</button>
      <button id="analyze-writing" class="action-btn">Analyze PG Style</button>
      <button id="save-practice" class="action-btn">Save Practice</button>
    </div>

    <!-- Coach Results -->
    <div id="coach-result"></div>
    <a class="settings-link" id="settings-link">Configure API Key</a>
  </div>

  <!-- QR Code Library (qrcode-generator) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

  <script>
    (function() {
      // ========================================
      // URL-as-Database Module
      // ========================================
      const URLDatabase = {
        // Compress: text → URL-safe base64
        async compress(str) {
          const bytes = new TextEncoder().encode(str);
          const stream = new CompressionStream('deflate-raw');
          const writer = stream.writable.getWriter();
          writer.write(bytes);
          writer.close();
          const buf = await new Response(stream.readable).arrayBuffer();
          return btoa(String.fromCharCode(...new Uint8Array(buf)))
            .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        },

        // Decompress: URL-safe base64 → text
        async decompress(b64) {
          try {
            const str = atob(b64.replace(/-/g, '+').replace(/_/g, '/'));
            const bytes = new Uint8Array(str.length);
            for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i);
            const stream = new DecompressionStream('deflate-raw');
            const writer = stream.writable.getWriter();
            writer.write(bytes);
            writer.close();
            const buf = await new Response(stream.readable).arrayBuffer();
            return new TextDecoder().decode(buf);
          } catch (e) {
            console.error('Decompress failed:', e);
            return '';
          }
        },

        // Save: content → URL hash
        async save(content) {
          if (content.trim()) {
            const hash = '#' + await this.compress(content);
            history.replaceState({}, '', hash);
            return location.href;
          } else {
            history.replaceState({}, '', location.pathname);
            return location.href;
          }
        },

        // Load: URL hash → content
        async load() {
          if (location.hash && location.hash.length > 1) {
            return await this.decompress(location.hash.slice(1));
          }
          return '';
        },

        // Get compressed size info
        getStats(content, compressed) {
          const originalBytes = new TextEncoder().encode(content).length;
          const compressedBytes = compressed.length;
          const ratio = originalBytes > 0 ? ((1 - compressedBytes / originalBytes) * 100).toFixed(0) : 0;
          const urlLength = location.origin.length + location.pathname.length + 1 + compressedBytes;
          const qrFits = urlLength <= 2500; // Conservative limit for QR v40-L
          return { originalBytes, compressedBytes, ratio, urlLength, qrFits };
        },

        // Render QR code
        renderQR(container, url) {
          try {
            const qr = qrcode(0, 'L'); // Auto version, low error correction
            qr.addData(url);
            qr.make();
            container.innerHTML = qr.createSvgTag(4, 0);
            return true;
          } catch (e) {
            container.innerHTML = '<div style="padding:2rem;color:#888;text-align:center;">URL too long for QR</div>';
            return false;
          }
        }
      };

      // ========================================
      // DOM Elements
      // ========================================
      const editor = document.getElementById('editor');
      const statsBar = document.getElementById('stats-bar');
      const themeToggle = document.getElementById('theme-toggle');
      const agentToggle = document.getElementById('agent-toggle');
      const shareToggle = document.getElementById('share-toggle');
      const agentPanel = document.getElementById('agent-panel');
      const sharePanel = document.getElementById('share-panel');
      const customPrompt = document.getElementById('custom-prompt');
      const customPromptToggle = document.getElementById('custom-prompt-toggle');
      const customPromptSection = document.getElementById('custom-prompt-section');
      const runAgent = document.getElementById('run-agent');
      const loading = document.getElementById('loading');
      const agentResult = document.getElementById('agent-result');
      const copyResult = document.getElementById('copy-result');
      const exportJson = document.getElementById('export-json');
      const agentActions = document.getElementById('agent-actions');
      const settingsLink = document.getElementById('settings-link');
      const presetButtons = document.querySelectorAll('.preset-btn');

      // Share panel elements
      const qrContainer = document.getElementById('qr-container');
      const shareUrl = document.getElementById('share-url');
      const shareStats = document.getElementById('share-stats');
      const qrWarning = document.getElementById('qr-warning');
      const copyUrl = document.getElementById('copy-url');
      const clearUrl = document.getElementById('clear-url');

      // Coach elements
      const insertPatterns = document.getElementById('insert-patterns');
      const analyzeWriting = document.getElementById('analyze-writing');
      const coachResult = document.getElementById('coach-result');
      const savePractice = document.getElementById('save-practice');
      const streakBadge = document.getElementById('streak-badge');

      let lastAgentResponse = '';

      // PG essay list
      const pgEssays = [
        'avg.html', 'worked.html', 'smart.html', 'simply.html', 'die.html',
        'greatwork.html', 'writes.html', 'procrastination.html', 'think.html',
        'startupideas.html', 'before.html', 'wealth.html', 'disagree.html',
        'say.html', 'foundervisa.html', 'ambitious.html', 'popular.html'
      ];

      // ========================================
      // Share Panel Functions
      // ========================================
      async function updateSharePanel() {
        const content = editor.value;
        if (!content.trim()) {
          qrContainer.innerHTML = '<div style="padding:2rem;color:#888;text-align:center;">Write something first</div>';
          shareUrl.textContent = location.origin + location.pathname;
          shareStats.textContent = '';
          qrWarning.style.display = 'none';
          return;
        }

        const url = await URLDatabase.save(content);
        const compressed = location.hash.slice(1);
        const stats = URLDatabase.getStats(content, compressed);

        shareUrl.textContent = url;
        shareStats.textContent = `${stats.originalBytes} bytes → ${stats.compressedBytes} bytes (${stats.ratio}% smaller) · URL: ${stats.urlLength} chars`;

        const qrOk = URLDatabase.renderQR(qrContainer, url);
        qrWarning.style.display = stats.qrFits && qrOk ? 'none' : 'block';
      }

      // ========================================
      // Coach State Management
      // ========================================
      const getCoachState = () => {
        const state = localStorage.getItem('inkflowCoach');
        return state ? JSON.parse(state) : { history: [], streak: 0, lastPracticeDate: null };
      };

      const saveCoachState = (state) => {
        localStorage.setItem('inkflowCoach', JSON.stringify(state));
      };

      const updateStreak = () => {
        const state = getCoachState();
        const today = new Date().toDateString();
        if (state.lastPracticeDate === today) {
          // Already practiced today
        } else if (state.lastPracticeDate === new Date(Date.now() - 86400000).toDateString()) {
          state.streak += 1;
        } else if (state.lastPracticeDate) {
          state.streak = 1;
        } else {
          state.streak = 1;
        }
        state.lastPracticeDate = today;
        saveCoachState(state);
        streakBadge.textContent = `Day ${state.streak}`;
      };

      // ========================================
      // Core Functions
      // ========================================
      const updateStats = () => {
        const text = editor.value;
        const chars = text.length;
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        const lines = text ? text.split('\n').length : 1;
        statsBar.textContent = `${words} words · ${chars} characters · ${lines} lines`;
      };

      // Auto-save to localStorage (draft backup)
      const saveDraft = () => localStorage.setItem('inkflowDraft', editor.value);

      // Load: URL hash takes priority, then localStorage draft
      const load = async () => {
        const urlContent = await URLDatabase.load();
        if (urlContent) {
          editor.value = urlContent;
        } else {
          const draft = localStorage.getItem('inkflowDraft');
          if (draft) editor.value = draft;
        }
        updateStats();
        const state = getCoachState();
        streakBadge.textContent = `Day ${state.streak}`;
      };

      const setTheme = (dark) => {
        document.body.classList.toggle('dark-mode', dark);
        localStorage.setItem('inkflowTheme', dark ? 'dark' : 'light');
        // Update PWA theme color
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#1a1a1a' : '#fffff8');
      };

      const getApiKey = () => {
        let apiKey = localStorage.getItem('ANTHROPIC_API_KEY');
        if (!apiKey) {
          apiKey = prompt('Please enter your Anthropic API key:');
          if (apiKey) localStorage.setItem('ANTHROPIC_API_KEY', apiKey);
        }
        return apiKey;
      };

      const callClaude = async (prompt, content) => {
        const apiKey = getApiKey();
        if (!apiKey) {
          alert('API key required. Click "Configure API Key" to set it.');
          return null;
        }

        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'content-type': 'application/json',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 4096,
            messages: [{ role: 'user', content: content ? `${prompt}\n\n---\n\n${content}` : prompt }]
          })
        });

        const data = await response.json();
        return data.content[0].text;
      };

      const runAgentTask = async (prompt) => {
        const content = editor.value.trim();
        if (!content) {
          alert('Nothing to process. Write something first.');
          return;
        }

        loading.classList.add('active');
        agentResult.classList.remove('active');
        agentActions.style.display = 'none';
        lastAgentResponse = '';

        try {
          const result = await callClaude(prompt, content);
          lastAgentResponse = result;
          agentResult.textContent = result;
          agentResult.classList.add('active');
          agentActions.style.display = 'flex';
        } catch (error) {
          console.error('Agent error:', error);
          agentResult.textContent = 'Error: ' + error.message;
          agentResult.classList.add('active');
        } finally {
          loading.classList.remove('active');
        }
      };

      // Insert pattern practice
      const insertPatternPractice = async () => {
        loading.classList.add('active');
        coachResult.classList.remove('active');

        try {
          const randomEssay = pgEssays[Math.floor(Math.random() * pgEssays.length)];
          const essayUrl = `https://www.paulgraham.com/${randomEssay}`;
          const response = await fetch(`https://r.jina.ai/${essayUrl}`);
          const essayText = await response.text();

          const patternPrompt = `Analyze this Paul Graham essay and extract 5 distinct sentence structure patterns.

For each pattern:
1. Identify the structural template with [placeholders]
2. Explain what makes it effective
3. Provide 2-3 topic suggestions

Format as quoted blocks:

> Pattern 1: [Name]
> Template: [structure]
> Why it works: [explanation]
> Practice topics: [topics]
> 
> [Your answer here]

          const patterns = await callClaude(patternPrompt);
          const cursorPos = editor.selectionStart;
          const before = editor.value.substring(0, cursorPos);
          const after = editor.value.substring(cursorPos);

          editor.value = before + '\n\n' + patterns + '\n\n' + after;
          editor.dispatchEvent(new Event('input'));

          const newPos = cursorPos + patterns.length + 4;
          editor.focus();
          editor.setSelectionRange(newPos, newPos);
          alert('Pattern practice inserted!');
        } catch (error) {
          console.error('Pattern insertion error:', error);
          alert('Error: ' + error.message);
        } finally {
          loading.classList.remove('active');
        }
      };

      // Analyze PG style
      const analyzePGStyle = async () => {
        const content = editor.value.trim();
        if (!content) {
          alert('Write something first.');
          return;
        }

        loading.classList.add('active');
        coachResult.classList.remove('active');

        const prompt = `Analyze this using Paul Graham's style criteria:

1. Sentence Length: ~15 words avg, varied rhythm
2. Conversational Tone: contractions, direct address
3. Logic Flow: clear because/therefore/but structure
4. Clarity: concrete examples, minimal jargon
5. Contrarian Insight: challenges assumptions

Provide:
- Score: X/10
- Strengths
- Improvements
- Rewrite 2-3 sentences in PG style
- Next exercise`;

        try {
          const result = await callClaude(prompt, content);
          coachResult.textContent = result;
          coachResult.classList.add('active');
        } catch (error) {
          coachResult.textContent = 'Error: ' + error.message;
          coachResult.classList.add('active');
        } finally {
          loading.classList.remove('active');
        }
      };

      // Save practice session
      const savePracticeSession = () => {
        const state = getCoachState();
        state.history.push({
          date: new Date().toISOString(),
          content: editor.value,
          wordCount: editor.value.trim() ? editor.value.trim().split(/\s+/).length : 0
        });
        saveCoachState(state);
        updateStreak();
        alert(`Practice saved! Streak: ${state.streak} days`);
      };

      // Keyboard handlers
      const handleTab = (e) => {
        if (e.key !== 'Tab') return;
        const { selectionStart: start, selectionEnd: end, value } = editor;
        if (start === end) return;

        e.preventDefault();
        const lineStart = value.lastIndexOf('\n', start - 1) + 1;
        const lineEnd = value.indexOf('\n', end) === -1 ? value.length : value.indexOf('\n', end);
        const lines = value.substring(lineStart, lineEnd).split('\n');

        const newLines = lines.map(line => {
          if (e.shiftKey) return line.replace(/^>\s?/, '');
          return line.trim() ? '> ' + line : line;
        });

        const newText = newLines.join('\n');
        editor.value = value.substring(0, lineStart) + newText + value.substring(lineEnd);
        editor.selectionStart = lineStart;
        editor.selectionEnd = lineStart + newText.length;
        editor.dispatchEvent(new Event('input'));
      };

      const handleUnderline = (e) => {
        if (e.key !== 'u' || (!e.ctrlKey && !e.metaKey)) return;
        const { selectionStart: start, selectionEnd: end, value } = editor;
        if (start === end) return;

        e.preventDefault();
        const selected = value.substring(start, end);
        const isUnderlined = value.substring(start - 2, start) === '++' && value.substring(end, end + 2) === '++';

        if (isUnderlined) {
          editor.value = value.substring(0, start - 2) + selected + value.substring(end + 2);
          editor.selectionStart = start - 2;
          editor.selectionEnd = end - 2;
        } else {
          editor.value = value.substring(0, start) + '++' + selected + '++' + value.substring(end);
          editor.selectionStart = start + 2;
          editor.selectionEnd = end + 2;
        }
        editor.dispatchEvent(new Event('input'));
      };

      // ========================================
      // Event Listeners
      // ========================================
      editor.addEventListener('input', () => {
        saveDraft();
        updateStats();
      });
      editor.addEventListener('keydown', handleTab);
      editor.addEventListener('keydown', handleUnderline);

      themeToggle.addEventListener('click', () => setTheme(!document.body.classList.contains('dark-mode')));

      agentToggle.addEventListener('click', () => {
        agentPanel.classList.toggle('active');
        sharePanel.classList.remove('active');
      });

      shareToggle.addEventListener('click', async () => {
        sharePanel.classList.toggle('active');
        agentPanel.classList.remove('active');
        if (sharePanel.classList.contains('active')) {
          await updateSharePanel();
        }
      });

      customPromptToggle.addEventListener('click', () => {
        customPromptToggle.classList.toggle('collapsed');
        customPromptSection.classList.toggle('collapsed');
      });

      presetButtons.forEach(btn => {
        btn.addEventListener('click', () => runAgentTask(btn.dataset.prompt));
      });

      runAgent.addEventListener('click', () => {
        const prompt = customPrompt.value.trim();
        if (!prompt) {
          alert('Enter a custom prompt first.');
          return;
        }
        runAgentTask(prompt);
      });

      copyResult.addEventListener('click', () => {
        if (!lastAgentResponse) return;
        navigator.clipboard.writeText(lastAgentResponse).then(() => {
          const original = copyResult.textContent;
          copyResult.textContent = 'Copied!';
          setTimeout(() => copyResult.textContent = original, 1500);
        });
      });

      exportJson.addEventListener('click', () => {
        const data = {
          originalText: editor.value,
          agentResponse: lastAgentResponse,
          wordCount: editor.value.trim() ? editor.value.trim().split(/\s+/).length : 0,
          charCount: editor.value.length,
          timestamp: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `inkflow-${Date.now()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });

      // Share panel actions
      copyUrl.addEventListener('click', async () => {
        await URLDatabase.save(editor.value);
        navigator.clipboard.writeText(location.href).then(() => {
          const original = copyUrl.textContent;
          copyUrl.textContent = 'Copied!';
          setTimeout(() => copyUrl.textContent = original, 1500);
        });
      });

      clearUrl.addEventListener('click', () => {
        if (confirm('Clear editor and start new draft?')) {
          editor.value = '';
          history.replaceState({}, '', location.pathname);
          localStorage.removeItem('inkflowDraft');
          updateStats();
          updateSharePanel();
        }
      });

      // Coach actions
      insertPatterns.addEventListener('click', insertPatternPractice);
      analyzeWriting.addEventListener('click', analyzePGStyle);
      savePractice.addEventListener('click', savePracticeSession);

      settingsLink.addEventListener('click', () => {
        const currentKey = localStorage.getItem('ANTHROPIC_API_KEY');
        const newKey = prompt('Enter your Anthropic API key:', currentKey || '');
        if (newKey !== null) {
          localStorage.setItem('ANTHROPIC_API_KEY', newKey);
          alert('API key saved.');
        }
      });

      // Handle URL changes (back/forward)
      window.addEventListener('popstate', async () => {
        const content = await URLDatabase.load();
        if (content) {
          editor.value = content;
          updateStats();
        }
      });

      // ========================================
      // Initialize
      // ========================================
      const savedTheme = localStorage.getItem('inkflowTheme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(savedTheme === 'dark' || (!savedTheme && prefersDark));
      load();

      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW registration failed:', err));
      }
    })();
  </script>
