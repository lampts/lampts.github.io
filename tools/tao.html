<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VC31GENS6S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-VC31GENS6S');
    </script>
  <meta charset="UTF-8">
  <title>Inkflow – Focus Mode</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✒️</text></svg>">
  <style>
    /* IMPORT: Inter (Distill-style) and Roboto Mono (Berkeley-style fallback) 
       Includes support for Cyrillic (Russian) and Vietnamese */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap');

    :root {
      /* OPTION 1: Distill Pub / Modern Research Style (Active)
         'Inter' is widely used in modern research/tech blogs (like Distill) 
         and has perfect support for Vietnamese and Russian. */
      --font-content: 'Inter', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      
      /* OPTION 2: Berkeley Mono / Hacker Style (Uncomment to use)
         Use this if you prefer the technical terminal feel. 
         Includes fallbacks to Roboto Mono/Fira Code if Berkeley isn't installed. */
      /* --font-content: 'Berkeley Mono', 'Roboto Mono', 'Fira Code', 'Consolas', monospace; */

      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      
      /* Light Mode */
      --bg-color: #fffff8;
      --text-color: #2b2b2b;
      --placeholder-color: #a8a8a8;
      --selection-bg: #d4e4f7;
      --button-bg: rgba(0, 0, 0, 0.04);
      --button-hover-bg: rgba(0, 0, 0, 0.08);
      --button-icon: '☀️';
      --stats-bg: rgba(255, 255, 248, 0.9);
      --stats-text: #6b6b6b;
      --stats-border: rgba(0, 0, 0, 0.06);
      --panel-bg: #ffffff;
      --panel-border: rgba(0, 0, 0, 0.1);
      --agent-icon: '✨';
      --accent-color: #4a90e2;
    }

    body.dark-mode {
      --bg-color: #1a1a1a;
      --text-color: #d8d8d8;
      --placeholder-color: #5a5a5a;
      --selection-bg: #3d4f5f;
      --button-bg: rgba(255, 255, 255, 0.08);
      --button-hover-bg: rgba(255, 255, 255, 0.15);
      --button-icon: '🌙';
      --stats-bg: rgba(26, 26, 26, 0.9);
      --stats-text: #8a8a8a;
      --stats-border: rgba(255, 255, 255, 0.06);
      --panel-bg: #242424;
      --panel-border: rgba(255, 255, 255, 0.1);
      --accent-color: #5da3f5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: var(--font-ui);
      background: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    #editor {
      width: 100%;
      height: 100vh;
      padding: 6vh max(5vw, calc((100vw - 68ch) / 2)) 10vh;
      border: none;
      resize: none;
      outline: none;
      background: transparent;
      color: inherit;
      font-family: var(--font-content);
      font-size: 1.1rem;
      line-height: 1.7;
      overflow-y: auto;
      caret-color: var(--text-color);
      white-space: pre-wrap;
      tab-size: 4;
    }

    #editor::placeholder { 
      color: var(--placeholder-color); 
      opacity: 1; 
    }

    ::selection { 
      background: var(--selection-bg); 
    }

    #stats-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 0.6rem max(5vw, calc((100vw - 68ch) / 2));
      background: var(--stats-bg);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--stats-border);
      color: var(--stats-text);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      text-align: center;
      user-select: none;
      z-index: 5;
    }

    .top-buttons {
      position: fixed;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      background: var(--button-bg);
      border: none;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      opacity: 0.5;
      transition: all 0.2s;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover { 
      background: var(--button-hover-bg); 
      opacity: 1; 
      transform: scale(1.08); 
    }

    #theme-toggle::before { content: var(--button-icon); }
    #agent-toggle::before { content: var(--agent-icon); }

    /* Agent Panel */
    #agent-panel {
      position: fixed;
      top: 70px;
      right: 15px;
      width: min(420px, calc(100vw - 30px));
      max-height: calc(100vh - 140px);
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 1.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      display: none;
      flex-direction: column;
      gap: 1rem;
      z-index: 9;
      overflow-y: auto;
    }

    #agent-panel.active { display: flex; }

    .section-divider {
      border-top: 1px solid var(--panel-border);
      margin: 0.5rem 0;
    }

    .preset-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .preset-btn, .action-btn {
      padding: 0.5rem 0.75rem;
      background: var(--button-bg);
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      font-size: 0.85rem;
      font-family: var(--font-ui);
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-color);
    }

    .preset-btn:hover, .action-btn:hover {
      background: var(--button-hover-bg);
    }

    .action-btn.primary {
      background: var(--accent-color);
      color: white;
      border-color: var(--accent-color);
    }

    .action-btn.primary:hover {
      opacity: 0.9;
    }

    textarea, input {
      width: 100%;
      padding: 0.6rem;
      background: var(--button-bg);
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      color: var(--text-color);
      font-family: var(--font-ui);
      font-size: 0.9rem;
      resize: vertical;
      outline: none;
    }

    #custom-prompt {
      min-height: 80px;
    }

    #agent-result, #coach-result {
      min-height: 150px;
      max-height: 300px;
      overflow-y: auto;
      padding: 1rem;
      background: var(--button-bg);
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      font-family: var(--font-content);
      font-size: 0.9rem;
      line-height: 1.6;
      display: none;
      white-space: pre-wrap;
    }

    #agent-result.active, #coach-result.active { display: block; }

    .button-row {
      display: flex;
      gap: 0.5rem;
    }

    #loading {
      display: none;
      text-align: center;
      color: var(--stats-text);
      font-size: 0.85rem;
    }

    #loading.active { display: block; }

    .label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--stats-text);
      margin-bottom: 0.3rem;
      letter-spacing: 0.02em;
    }

    .label.clickable {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .label.clickable::after {
      content: '▼';
      font-size: 0.7rem;
      transition: transform 0.2s;
    }

    .label.clickable.collapsed::after {
      transform: rotate(-90deg);
    }

    .label.clickable:hover {
      color: var(--text-color);
    }

    .collapsible-section {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .collapsible-section.collapsed {
      display: none;
    }

    .settings-link {
      font-size: 0.75rem;
      color: var(--stats-text);
      text-decoration: underline;
      cursor: pointer;
    }

    .settings-link:hover {
      color: var(--text-color);
    }

    .progress-badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      background: var(--accent-color);
      color: white;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .coach-buttons {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.5rem;
    }
  </style>
</head>
<body>
  <textarea id="editor" placeholder="Just write… (Tab=Quote, Ctrl/Cmd+U=Underline)" spellcheck="true" autofocus></textarea>
  <div id="stats-bar">0 words · 0 characters · 1 line</div>
   
  <div class="top-buttons">
    <button id="agent-toggle" class="icon-btn" aria-label="Toggle agent"></button>
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme"></button>
  </div>

  <div id="agent-panel">
    <!-- Quick Actions -->
    <div class="label">Quick Actions</div>
    <div class="preset-buttons">
      <button class="preset-btn" data-prompt="Review this text critically. Point out weak arguments, unclear phrasing, logical gaps, and areas for improvement. Be direct and constructive.">Criticize</button>
      <button class="preset-btn" data-prompt="Revise this text to improve clarity, flow, and impact. Keep the core message but make it sharper and more compelling.">Revise</button>
      <button class="preset-btn" data-prompt="Summarize this text in three resolutions: 5 words | 15 words | 30 words.">Summarize</button>
      <button class="preset-btn" data-prompt="Rewrite this in a professional, formal tone suitable for business communication.">Professional Tone</button>
      <button class="preset-btn" data-prompt="Translate this to Vietnamese while preserving the original tone and nuance.">→ Vietnamese</button>
      <button class="preset-btn" data-prompt="Translate this to English while preserving the original tone and nuance.">→ English</button>
    </div>

    <!-- Custom Prompt (Collapsible) -->
    <div class="label clickable" id="custom-prompt-toggle">Custom Prompt</div>
    <div class="collapsible-section collapsed" id="custom-prompt-section">
      <textarea id="custom-prompt" placeholder="Or write your own prompt..."></textarea>
      <button id="run-agent" class="action-btn">Run Agent</button>
    </div>

    <!-- Agent Results -->
    <div id="loading">Processing...</div>
    <div id="agent-result"></div>
    <div class="button-row" id="agent-actions" style="display: none;">
      <button id="copy-result" class="action-btn">Copy Result</button>
      <button id="export-json" class="action-btn">Export JSON</button>
    </div>

    <div class="section-divider"></div>

    <!-- Daily Writing Coach -->
    <div class="label">
      Daily Writing Coach – PG Style
      <span id="streak-badge" class="progress-badge" style="margin-left: 0.5rem;">Day 0</span>
    </div>

    <div class="coach-buttons">
      <button id="insert-patterns" class="action-btn primary">Insert Pattern Practice</button>
      <button id="analyze-writing" class="action-btn">Analyze PG Style</button>
      <button id="save-practice" class="action-btn">Save Practice</button>
    </div>

    <!-- Coach Results (for analysis feedback) -->
    <div id="coach-result"></div>

    <a class="settings-link" id="settings-link">Configure API Key</a>
  </div>

  <script>
    (function() {
      const editor = document.getElementById('editor');
      const statsBar = document.getElementById('stats-bar');
      const themeToggle = document.getElementById('theme-toggle');
      const agentToggle = document.getElementById('agent-toggle');
      const agentPanel = document.getElementById('agent-panel');
      const customPrompt = document.getElementById('custom-prompt');
      const customPromptToggle = document.getElementById('custom-prompt-toggle');
      const customPromptSection = document.getElementById('custom-prompt-section');
      const runAgent = document.getElementById('run-agent');
      const loading = document.getElementById('loading');
      const agentResult = document.getElementById('agent-result');
      const copyResult = document.getElementById('copy-result');
      const exportJson = document.getElementById('export-json');
      const agentActions = document.getElementById('agent-actions');
      const settingsLink = document.getElementById('settings-link');
      const presetButtons = document.querySelectorAll('.preset-btn');

      // Coach elements
      const insertPatterns = document.getElementById('insert-patterns');
      const analyzeWriting = document.getElementById('analyze-writing');
      const coachResult = document.getElementById('coach-result');
      const savePractice = document.getElementById('save-practice');
      const streakBadge = document.getElementById('streak-badge');

      let lastAgentResponse = '';

      // PG essay list
      const pgEssays = [
        'avg.html', 'worked.html', 'smart.html', 'simply.html', 'die.html',
        'greatwork.html', 'writes.html', 'procrastination.html', 'think.html',
        'startupideas.html', 'before.html', 'wealth.html', 'disagree.html',
        'say.html', 'foundervisa.html', 'ambitious.html', 'popular.html'
      ];
       
      // Coach state management
      const getCoachState = () => {
        const state = localStorage.getItem('inkflowCoach');
        return state ? JSON.parse(state) : {
          history: [],
          streak: 0,
          lastPracticeDate: null
        };
      };

      const saveCoachState = (state) => {
        localStorage.setItem('inkflowCoach', JSON.stringify(state));
      };

      const updateStreak = () => {
        const state = getCoachState();
        const today = new Date().toDateString();
         
        if (state.lastPracticeDate === today) {
          // Already practiced today
        } else if (state.lastPracticeDate === new Date(Date.now() - 86400000).toDateString()) {
          // Yesterday - continue streak
          state.streak += 1;
        } else if (state.lastPracticeDate) {
          // Streak broken
          state.streak = 1;
        } else {
          // First time
          state.streak = 1;
        }
         
        state.lastPracticeDate = today;
        saveCoachState(state);
        streakBadge.textContent = `Day ${state.streak}`;
      };

      const updateStats = () => {
        const text = editor.value;
        const chars = text.length;
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        const lines = text ? text.split('\n').length : 1;
        statsBar.textContent = `${words} words · ${chars} characters · ${lines} lines`;
      };

      const save = () => localStorage.setItem('inkflowContent', editor.value);
       
      const load = () => {
        const saved = localStorage.getItem('inkflowContent');
        if (saved) editor.value = saved;
        updateStats();
         
        // Load streak
        const state = getCoachState();
        streakBadge.textContent = `Day ${state.streak}`;
      };

      const setTheme = (dark) => {
        document.body.classList.toggle('dark-mode', dark);
        localStorage.setItem('inkflowTheme', dark ? 'dark' : 'light');
      };

      const getApiKey = () => {
        let apiKey = localStorage.getItem('ANTHROPIC_API_KEY');
        if (!apiKey) {
          apiKey = prompt('Please enter your Anthropic API key:');
          if (apiKey) localStorage.setItem('ANTHROPIC_API_KEY', apiKey);
        }
        return apiKey;
      };

      const callClaude = async (prompt, content) => {
        const apiKey = getApiKey();
        if (!apiKey) {
          alert('API key required. Click "Configure API Key" to set it.');
          return null;
        }

        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'content-type': 'application/json',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 4096,
            messages: [{
              role: 'user',
              content: content ? `${prompt}\n\n---\n\n${content}` : prompt
            }]
          })
        });

        const data = await response.json();
        return data.content[0].text;
      };

      const runAgentTask = async (prompt) => {
        const content = editor.value.trim();
        if (!content) {
          alert('Nothing to process. Write something first.');
          return;
        }

        loading.classList.add('active');
        agentResult.classList.remove('active');
        agentActions.style.display = 'none';
        lastAgentResponse = '';

        try {
          const result = await callClaude(prompt, content);
          lastAgentResponse = result;
          agentResult.textContent = result;
          agentResult.classList.add('active');
          agentActions.style.display = 'flex';
        } catch (error) {
          console.error('Agent error:', error);
          agentResult.textContent = 'Error: ' + error.message;
          agentResult.classList.add('active');
        } finally {
          loading.classList.remove('active');
        }
      };

      // Insert pattern practice into editor
      const insertPatternPractice = async () => {
        loading.classList.add('active');
        coachResult.classList.remove('active');

        try {
          // Pick random essay
          const randomEssay = pgEssays[Math.floor(Math.random() * pgEssays.length)];
          const essayUrl = `https://www.paulgraham.com/${randomEssay}`;

          // Fetch via Jina Reader API (bypasses CORS)
          const response = await fetch(`https://r.jina.ai/${essayUrl}`);
          const essayText = await response.text();

          // Analyze patterns with Claude
          const patternPrompt = `Analyze this Paul Graham essay and extract 5 distinct sentence structure patterns (not content, just structure).

For each pattern:
1. Identify the structural template with [placeholders]
2. Explain what makes it effective in PG's style
3. Provide 2-3 topic suggestions for practice

Format output EXACTLY as quoted blocks for direct insertion:

> Pattern 1: [Name]
> Template: [structure with [placeholders]]
> Why it works: [brief explanation]
> Practice topics: [topic1, topic2, topic3]
> 
> [Your answer here]

> Pattern 2: [Name]
> Template: [structure with [placeholders]]
> Why it works: [brief explanation]
> Practice topics: [topic1, topic2, topic3]
> 
> [Your answer here]

Continue for 5 patterns total.

Focus on patterns like:
- Contrarian openings ("Most people X, but Y")
- Question-answer rhythm
- Anecdote-to-principle bridges
- Clear cause-effect chains
- Direct address to reader

Essay text (first 3000 chars):
${essayText.slice(0, 3000)}`;

          const patterns = await callClaude(patternPrompt);

          // Insert at cursor or end
          const cursorPos = editor.selectionStart;
          const before = editor.value.substring(0, cursorPos);
          const after = editor.value.substring(cursorPos);
           
          editor.value = before + '\n\n' + patterns + '\n\n' + after;
          editor.dispatchEvent(new Event('input'));
           
          // Position cursor after inserted text
          const newPos = cursorPos + patterns.length + 4;
          editor.focus();
          editor.setSelectionRange(newPos, newPos);

          alert('Pattern practice inserted! Write your answers below each prompt.');

        } catch (error) {
          console.error('Pattern insertion error:', error);
          alert('Error fetching patterns: ' + error.message);
        } finally {
          loading.classList.remove('active');
        }
      };

      // Analyze PG style
      const analyzePGStyle = async () => {
        const content = editor.value.trim();
        if (!content) {
          alert('Write something first to analyze.');
          return;
        }

        loading.classList.add('active');
        coachResult.classList.remove('active');

        const prompt = `Analyze this writing sample using Paul Graham's style criteria:

1. **Sentence Length**: Average ~15 words, varied rhythm
2. **Conversational Tone**: Uses contractions, direct address, natural phrasing
3. **Logic Flow**: Clear because/therefore/but structure, no hand-waving
4. **Clarity**: Concrete examples, no jargon unless necessary
5. **Contrarian Insight**: Challenges assumptions, reveals non-obvious truth

Provide:
- Overall score: X/10
- Strengths: What works well
- Improvements: Specific areas to fix
- Rewrite: Pick 2-3 sentences and rewrite them in PG's style
- Next practice: One concrete exercise to improve

Be direct and constructive. This is for a non-native speaker practicing English.`;

        try {
          const result = await callClaude(prompt, content);
          coachResult.textContent = result;
          coachResult.classList.add('active');
        } catch (error) {
          console.error('Analysis error:', error);
          coachResult.textContent = 'Error: ' + error.message;
          coachResult.classList.add('active');
        } finally {
          loading.classList.remove('active');
        }
      };

      // Save practice session
      const savePracticeSession = () => {
        const state = getCoachState();
        const session = {
          date: new Date().toISOString(),
          content: editor.value,
          wordCount: editor.value.trim() ? editor.value.trim().split(/\s+/).length : 0
        };

        state.history.push(session);
        saveCoachState(state);
        updateStreak();
         
        alert(`Practice saved! Streak: ${state.streak} days`);
      };

      const handleTab = (e) => {
        if (e.key !== 'Tab') return;
         
        const { selectionStart: start, selectionEnd: end, value } = editor;
        if (start === end) return;
         
        e.preventDefault();
        const lineStart = value.lastIndexOf('\n', start - 1) + 1;
        const lineEnd = value.indexOf('\n', end) === -1 ? value.length : value.indexOf('\n', end);
        const lines = value.substring(lineStart, lineEnd).split('\n');
         
        const newLines = lines.map(line => {
          if (e.shiftKey) return line.replace(/^>\s?/, '');
          return line.trim() ? '> ' + line : line;
        });
         
        const newText = newLines.join('\n');
        editor.value = value.substring(0, lineStart) + newText + value.substring(lineEnd);
        editor.selectionStart = lineStart;
        editor.selectionEnd = lineStart + newText.length;
        editor.dispatchEvent(new Event('input'));
      };

      const handleUnderline = (e) => {
        if (e.key !== 'u' || (!e.ctrlKey && !e.metaKey)) return;
         
        const { selectionStart: start, selectionEnd: end, value } = editor;
        if (start === end) return;
         
        e.preventDefault();
        const selected = value.substring(start, end);
        const isUnderlined = value.substring(start - 2, start) === '++' && 
                             value.substring(end, end + 2) === '++';
         
        if (isUnderlined) {
          editor.value = value.substring(0, start - 2) + selected + value.substring(end + 2);
          editor.selectionStart = start - 2;
          editor.selectionEnd = end - 2;
        } else {
          editor.value = value.substring(0, start) + '++' + selected + '++' + value.substring(end);
          editor.selectionStart = start + 2;
          editor.selectionEnd = end + 2;
        }
        editor.dispatchEvent(new Event('input'));
      };

      // Toggle custom prompt section
      customPromptToggle.addEventListener('click', () => {
        customPromptToggle.classList.toggle('collapsed');
        customPromptSection.classList.toggle('collapsed');
      });

      // Event Listeners
      editor.addEventListener('input', () => { save(); updateStats(); });
      editor.addEventListener('keydown', handleTab);
      editor.addEventListener('keydown', handleUnderline);
       
      themeToggle.addEventListener('click', () => 
        setTheme(!document.body.classList.contains('dark-mode'))
      );

      agentToggle.addEventListener('click', () => 
        agentPanel.classList.toggle('active')
      );

      presetButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const prompt = btn.dataset.prompt;
          runAgentTask(prompt);
        });
      });

      runAgent.addEventListener('click', () => {
        const prompt = customPrompt.value.trim();
        if (!prompt) {
          alert('Enter a custom prompt first.');
          return;
        }
        runAgentTask(prompt);
      });

      copyResult.addEventListener('click', () => {
        if (!lastAgentResponse) {
          alert('No result to copy.');
          return;
        }
         
        navigator.clipboard.writeText(lastAgentResponse).then(() => {
          const original = copyResult.textContent;
          copyResult.textContent = 'Copied!';
          setTimeout(() => {
            copyResult.textContent = original;
          }, 1500);
        });
      });

      exportJson.addEventListener('click', () => {
        const data = {
          originalText: editor.value,
          agentResponse: lastAgentResponse,
          wordCount: editor.value.trim() ? editor.value.trim().split(/\s+/).length : 0,
          charCount: editor.value.length,
          timestamp: new Date().toISOString()
        };

        const blob = new Blob([JSON.stringify(data, null, 2)], { 
          type: 'application/json' 
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `inkflow-${Date.now()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });

      // Coach event listeners
      insertPatterns.addEventListener('click', insertPatternPractice);
      analyzeWriting.addEventListener('click', analyzePGStyle);
      savePractice.addEventListener('click', savePracticeSession);

      settingsLink.addEventListener('click', () => {
        const currentKey = localStorage.getItem('ANTHROPIC_API_KEY');
        const newKey = prompt('Enter your Anthropic API key:', currentKey || '');
        if (newKey !== null) {
          localStorage.setItem('ANTHROPIC_API_KEY', newKey);
          alert('API key saved.');
        }
      });

      // Initialize
      const savedTheme = localStorage.getItem('inkflowTheme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(savedTheme === 'dark' || (!savedTheme && prefersDark));
       
      load();
    })();
  </script>
</body>
</html>
