<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Learner - HSK 1-2 Mastery</title>
    <style>
        :root {
            --color-bg: #111827;
            --color-card: #1f2937;
            --color-card-hover: #374151;
            --color-text: #f3f4f6;
            --color-text-dim: #9ca3af;
            --color-green: #10b981;
            --color-red: #ef4444;
            --color-blue: #3b82f6;
            --color-purple: #8b5cf6;
            --color-amber: #f59e0b;
            --color-orange: #f97316;
            --color-green-dark: #047857;
            --color-red-dark: #b91c1c;
            --color-green-feedback: #065f46;
            --color-red-feedback: #991b1b;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        /* Smooth scrolling for all elements */
        html {
            scroll-behavior: smooth;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            display: grid;
            place-items: center;
        }
        
        /* Custom Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--color-card);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--color-card-hover);
            border-radius: 10px;
            transition: background 0.2s;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563; /* gray-600 */
        }
        
        /* Firefox Scrollbar */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--color-card-hover) var(--color-card);
        }
        
        /* Momentum scrolling for iOS/mobile */
        #roadmap-screen,
        #options-area {
            -webkit-overflow-scrolling: touch;
        }
        
        #app-wrapper {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            padding: 1rem;
        }
        
        button {
            font-family: inherit;
            border: none;
            background: none;
            cursor: pointer;
            color: inherit;
        }

        #app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 900px;
            background-color: var(--color-bg);
            border-radius: 1.5rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        
        @media (min-width: 768px) {
            #app-container {
                max-width: 480px;
            }
        }
        
        @media (max-width: 375px) {
            #app-container {
                border-radius: 0;
                max-height: 100%;
            }
            #app-wrapper {
                padding: 0;
            }
        }

        .app-screen {
            display: none;
            flex-direction: column;
            flex-grow: 1;
        }
        
        .app-screen.active {
            display: flex;
        }

        .hidden {
            display: none !important;
        }
        
        .icon {
            width: 1.5rem;
            height: 1.5rem;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
        }
        .icon-lg {
            width: 2rem;
            height: 2rem;
        }
        .icon-xl {
            width: 4rem;
            height: 4rem;
            stroke-width: 1.5;
        }

        .loader {
            width: 1.5rem;
            height: 1.5rem;
            border: 2px solid var(--color-text-dim);
            border-top-color: var(--color-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Roadmap Screen */
        #roadmap-screen {
            overflow-y: auto;
            overflow-x: hidden;
            padding: 1.5rem;
            padding-right: 1rem; /* Space for scrollbar */
            scroll-behavior: smooth;
        }
        
        /* Add padding when scrollbar is visible */
        #roadmap-screen::-webkit-scrollbar {
            width: 6px;
        }
        
        #roadmap-screen::-webkit-scrollbar-track {
            background: transparent;
            margin: 0.5rem 0;
        }
        
        #roadmap-screen::-webkit-scrollbar-thumb {
            background: var(--color-card-hover);
            border-radius: 3px;
        }
        
        #roadmap-screen::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }
        
        #roadmap-screen-header {
            text-align: center;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 1rem;
        }
        
        #progress-summary {
            text-align: center;
            margin-bottom: 2rem;
            padding: 1rem;
            background-color: var(--color-card);
            border-radius: 0.75rem;
        }
        
        #progress-summary h3 {
            font-size: 1rem;
            color: var(--color-text-dim);
            margin-bottom: 0.5rem;
        }
        
        #progress-summary .stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 0.5rem;
        }
        
        #progress-summary .stat {
            display: flex;
            flex-direction: column;
        }
        
        #progress-summary .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-green);
        }
        
        #progress-summary .stat-label {
            font-size: 0.75rem;
            color: var(--color-text-dim);
        }
        
        .unit-container {
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .unit-header {
            padding: 0.5rem 1.25rem;
            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
        }
        
        .unit-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: white;
        }
        
        .lesson-nodes {
            display: grid;
            grid-template-columns: repeat(auto-fit, 65px);
            justify-content: center;
            gap: 1rem;
            max-width: 320px;
            width: 100%;
        }
        
        @media (max-width: 375px) {
            .lesson-nodes {
                gap: 0.75rem;
                grid-template-columns: repeat(auto-fit, 60px);
            }
            .lesson-node {
                width: 60px;
                height: 60px;
                font-size: 0.9rem;
            }
        }
        
        .lesson-node {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background-color: var(--color-card);
            border: 4px solid var(--color-card-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
            color: var(--color-text);
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            position: relative;
        }
        
        .lesson-node:not(:disabled):hover {
            background-color: var(--color-card-hover);
            transform: scale(1.05);
            border-color: var(--color-blue);
        }
        
        .lesson-node:disabled {
            background-color: #333;
            border-color: #444;
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .lesson-node.completed {
            border-color: var(--color-green);
        }
        
        .lesson-node.completed:hover {
            border-color: var(--color-green);
        }

        /* Main Quiz Screen */
        #main-content {
            padding: 1.25rem 1.25rem 0 1.25rem;
        }

        @media (min-width: 768px) {
            #main-content {
                padding: 1.5rem 1.5rem 0 1.5rem;
            }
        }

        #progress-bar-container {
            width: 100%;
            height: 16px;
            background-color: var(--color-card);
            border-radius: 8px;
            margin-bottom: 1.25rem;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--color-blue), #60a5fa);
            border-radius: 8px;
            transition: width 0.3s ease-out;
            box-shadow: 0 1px 3px rgba(59, 130, 246, 0.5);
        }
        
        #quit-lesson-button {
            position: absolute;
            top: 1.25rem;
            left: 1rem;
            color: var(--color-text-dim);
            padding: 0.25rem;
            z-index: 20;
        }
        
        #quit-lesson-button:hover {
            color: var(--color-text);
        }

        #prompt-area {
            flex-shrink: 0;
            text-align: center;
            margin-bottom: 2rem;
            margin-top: 1.5rem;
            padding: 0 0.5rem;
        }

        #prompt-text {
            font-size: 1.125rem;
            color: var(--color-text-dim);
            margin-bottom: 1.75rem;
            font-weight: 500;
            line-height: 1.5;
        }
        
        #prompt-focus {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        #prompt-focus-audio {
            padding: 0.75rem;
            background-color: var(--color-card);
            border-radius: 0.75rem;
            transition: background-color 0.2s;
        }
        
        #prompt-focus-audio:hover {
            background-color: var(--color-card-hover);
        }
        
        #prompt-focus-text {
            text-align: center;
        }
        
        #prompt-hanzi {
            font-size: 2.25rem;
            font-weight: 700;
        }
        
        #prompt-pinyin {
            font-size: 1.125rem;
            color: var(--color-text-dim);
        }

        #options-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 0.5rem;
            margin-right: -0.5rem;
            padding-bottom: 0.5rem;
        }
        
        /* Custom scrollbar for options area */
        #options-area::-webkit-scrollbar {
            width: 4px;
        }
        
        #options-area::-webkit-scrollbar-track {
            background: transparent;
        }
        
        #options-area::-webkit-scrollbar-thumb {
            background: var(--color-card-hover);
            border-radius: 2px;
        }
        
        #options-area::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }
        
        .option-button {
            width: 100%;
            min-height: 65px;
            border: 2px solid var(--color-card);
            background-color: var(--color-card);
            border-radius: 0.75rem;
            transition: all 0.2s;
            overflow: hidden;
            display: flex;
            align-items: stretch;
        }
        
        .option-button:not(:disabled):hover {
            background-color: var(--color-card-hover);
            border-color: var(--color-card-hover);
        }
        
        .option-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .option-button.correct {
            background-color: var(--color-green-dark);
            border-color: var(--color-green);
            opacity: 1;
        }

        .option-button.incorrect {
            background-color: var(--color-red-dark);
            border-color: var(--color-red);
            opacity: 1;
        }
        
        .option-content-text {
            padding: 1.25rem 1.5rem;
            font-size: 1.125rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 65px;
            word-wrap: break-word;
            line-height: 1.4;
        }
        
        .option-content-image-text {
            display: flex;
            min-height: 8rem;
            height: auto;
        }

        .option-content-image-text .image-container {
            width: 65%;
            min-height: 8rem;
            position: relative;
        }

        .option-content-image-text .text-container {
            width: 35%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            font-size: 1.125rem;
            font-weight: 600;
            line-height: 1.3;
        }

        .option-content-image {
            display: flex;
            flex-direction: column;
            min-height: 10rem;
            height: auto;
        }

        .option-content-image .image-container {
            flex: 2;
            min-height: 7rem;
            width: 100%;
            position: relative;
        }

        .option-content-image .text-container {
            flex: 1;
            min-height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1rem;
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.2;
        }
        
        .image-container {
            background-color: var(--color-card-hover);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }
        
        .image-container .error-text {
            font-size: 0.75rem;
            color: var(--color-text-dim);
            padding: 0.5rem;
            text-align: center;
        }

        /* Footer & Feedback Panel */
        #footer {
            flex-shrink: 0;
            padding: 0 1.25rem 1.25rem 1.25rem;
            position: relative;
            z-index: 10;
        }

        @media (min-width: 768px) {
            #footer {
                padding: 0 1.5rem 1.5rem 1.5rem;
            }
        }

        #continue-button {
            width: 100%;
            font-size: 1.125rem;
            font-weight: 700;
            padding: 1rem 1.5rem;
            min-height: 54px;
            border-radius: 0.75rem;
            transition: all 0.2s ease;
            position: relative;
            z-index: 15;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        #continue-button:active {
            transform: translateY(1px);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        }
        
        #continue-button.green {
            background-color: var(--color-green);
            color: white;
        }
        
        #continue-button.green:hover {
            background-color: #059669;
        }
        
        #continue-button.red {
            background-color: var(--color-red);
            color: white;
        }
        
        #continue-button.red:hover {
            background-color: #dc2626;
        }
        
        #feedback-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 2rem 1.5rem 6.5rem 1.5rem;
            border-top-left-radius: 1.5rem;
            border-top-right-radius: 1.5rem;
            transition: transform 0.4s ease-in-out;
            transform: translateY(100%);
            z-index: 5;
        }
        
        #feedback-panel.show {
            transform: translateY(0);
        }

        #feedback-panel.correct {
            background-image: linear-gradient(to top, var(--color-green-feedback), var(--color-green-dark));
        }
        
        #feedback-panel.incorrect {
            background-image: linear-gradient(to top, var(--color-red-feedback), var(--color-red-dark));
        }

        #feedback-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }
        
        #feedback-header .icon-container {
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        #feedback-header .icon-container.correct {
            background-color: var(--color-green);
        }
        
        #feedback-header .icon-container.incorrect {
            background-color: var(--color-red);
        }
        
        #feedback-title {
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        #feedback-text p:first-child {
            color: var(--color-text-dim);
            margin-bottom: 0.25rem;
        }
        
        #feedback-text span {
            font-weight: 700;
        }
        
        #feedback-text p:last-child {
            color: var(--color-text-dim);
        }

        /* Quiz Complete Screen */
        #quiz-complete-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 1rem;
        }
        
        #quiz-complete-icon {
            color: var(--color-green);
            margin-bottom: 1.5rem;
        }
        
        #quiz-complete-screen h1 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        
        #quiz-complete-screen p {
            font-size: 1.125rem;
            color: var(--color-text-dim);
            margin-bottom: 2rem;
        }
        
        #roadmap-button {
            width: 100%;
            max-width: 320px;
            background-color: var(--color-blue);
            color: white;
            font-weight: 700;
            padding: 0.85rem;
            border-radius: 0.75rem;
            font-size: 1.125rem;
            transition: background-color 0.2s;
        }
        
        #roadmap-button:hover {
            background-color: #2563eb;
        }

        /* Enhanced Responsive Design */

        /* Tablet landscape and small desktops */
        @media (min-width: 768px) and (max-width: 1024px) {
            #app-container {
                max-width: 520px;
            }

            #prompt-area {
                margin-top: 2rem;
                margin-bottom: 2.5rem;
            }

            #prompt-hanzi {
                font-size: 2.5rem;
            }

            .option-content-text {
                font-size: 1.25rem;
                padding: 1.5rem 2rem;
            }

            #options-area {
                gap: 1.25rem;
            }
        }

        /* Small phones - refined */
        @media (max-width: 375px) {
            #prompt-area {
                margin-top: 1rem;
                margin-bottom: 1.5rem;
                padding: 0 0.75rem;
            }

            #prompt-text {
                font-size: 1rem;
                margin-bottom: 1.25rem;
            }

            #prompt-hanzi {
                font-size: 2rem;
            }

            #prompt-pinyin {
                font-size: 1rem;
            }

            .option-content-text {
                padding: 1rem 1.25rem;
                font-size: 1rem;
            }

            #options-area {
                gap: 0.875rem;
            }

            #feedback-panel {
                padding: 1.5rem 1rem 6rem 1rem;
            }

            #feedback-title {
                font-size: 1.25rem;
            }

            .option-content-image-text {
                min-height: 7rem;
            }

            .option-content-image {
                min-height: 9rem;
            }
        }

        /* Very small phones */
        @media (max-width: 320px) {
            #main-content {
                padding: 0.75rem 0.75rem 0 0.75rem;
            }

            #prompt-hanzi {
                font-size: 1.75rem;
            }

            .option-content-text {
                padding: 0.875rem 1rem;
                font-size: 0.9375rem;
            }

            #progress-bar-container {
                height: 14px;
                margin-bottom: 1rem;
            }

            .option-content-image-text {
                min-height: 6.5rem;
            }

            .option-content-image-text .text-container {
                font-size: 1rem;
                padding: 0.75rem;
            }

            .option-content-image {
                min-height: 8.5rem;
            }

            .option-content-image .text-container {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div id="app-wrapper">
        <div id="app-container">
            <!-- Screen 1: Learning Roadmap -->
            <div id="roadmap-screen" class="app-screen active">
                <h1 id="roadmap-screen-header">Your Learning Path</h1>
                <div id="progress-summary">
                    <h3>Progress</h3>
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-value" id="completed-lessons">0</div>
                            <div class="stat-label">Lessons</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" id="total-progress">0%</div>
                            <div class="stat-label">Complete</div>
                        </div>
                    </div>
                </div>
                <div id="roadmap-content"></div>
            </div>

            <!-- Screen 2: Main Content Area (Quiz) -->
            <div id="main-content" class="app-screen">
                <button id="quit-lesson-button" aria-label="Quit lesson">
                    <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
                <div id="progress-bar-container">
                    <div id="progress-bar"></div>
                </div>
                
                <div id="prompt-area">
                    <h1 id="prompt-text"></h1>
                    <div id="prompt-focus">
                        <button id="prompt-focus-audio" aria-label="Play audio">
                            <svg id="icon-volume" class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                        <div id="prompt-focus-text">
                            <h2 id="prompt-hanzi"></h2>
                            <p id="prompt-pinyin"></p>
                        </div>
                    </div>
                </div>
                <div id="options-area"></div>
            </div>

            <!-- Screen 3: Quiz Complete Screen -->
            <div id="quiz-complete-screen" class="app-screen">
                <svg id="quiz-complete-icon" class="icon-xl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <h1>Lesson Complete!</h1>
                <p id="quiz-complete-subtitle"></p>
                <button id="roadmap-button">Back to Roadmap</button>
            </div>

            <!-- Footer (Shared by Quiz Screen) -->
            <div id="footer" class="hidden">
                <button id="continue-button" class="hidden"></button>
                <div id="feedback-panel">
                    <div id="feedback-header">
                        <div class="icon-container">
                            <svg id="icon-feedback" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></svg>
                        </div>
                        <h3 id="feedback-title"></h3>
                    </div>
                    <div id="feedback-text">
                        <p id="feedback-text-label"></p>
                        <p>
                            <span id="feedback-hanzi"></span>
                            (<span id="feedback-pinyin"></span>)
                        </p>
                        <p id="feedback-english"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // COMPREHENSIVE HSK 1-2 CURRICULUM DATA
        const CURRICULUM_DATA = {
            // Unit 1: Greetings & Basics (7 lessons × 3 questions = 21 questions)
            'u1l1': {
                id: 'u1l1',
                title: 'Hello & Goodbye',

            { id: 'u6', title: 'Unit 6: Time & Travel', color: 'var(--color-orange)', lessons: ['u6l1', 'u6l2', 'u6l3', 'u6l4', 'u6l5', 'u6l6', 'u6l7'] },
            { id: 'u7', title: 'Unit 7: Daily Life', color: 'var(--color-blue)', lessons: ['u7l1', 'u7l2', 'u7l3', 'u7l4', 'u7l5', 'u7l6', 'u7l7'] },
            { id: 'u8', title: 'Unit 8: Integration', color: 'var(--color-purple)', lessons: ['u8l1', 'u8l2', 'u8l3', 'u8l4', 'u8l5', 'u8l6', 'u8l7'] },
        ];

        // ============================================
        // STATE & DOM
        // ============================================

        const state = {
            currentQuestionIndex: 0,
            showFeedback: false,
            isCorrect: false,
            quizComplete: false,
            imageCache: {},
            currentLessonData: null,
            lessonProgress: {},
        };

        const dom = {
            roadmapScreen: document.getElementById('roadmap-screen'),
            roadmapContent: document.getElementById('roadmap-content'),
            completedLessons: document.getElementById('completed-lessons'),
            totalProgress: document.getElementById('total-progress'),
            mainContent: document.getElementById('main-content'),
            quizCompleteScreen: document.getElementById('quiz-complete-screen'),
            quitLessonButton: document.getElementById('quit-lesson-button'),
            progressBar: document.getElementById('progress-bar'),
            promptText: document.getElementById('prompt-text'),
            promptHanzi: document.getElementById('prompt-hanzi'),
            promptPinyin: document.getElementById('prompt-pinyin'),
            promptFocusAudio: document.getElementById('prompt-focus-audio'),
            optionsArea: document.getElementById('options-area'),
            footer: document.getElementById('footer'),
            continueButton: document.getElementById('continue-button'),
            feedbackPanel: document.getElementById('feedback-panel'),
            iconFeedback: document.getElementById('icon-feedback'),
            feedbackTitle: document.getElementById('feedback-title'),
            feedbackTextLabel: document.getElementById('feedback-text-label'),
            feedbackHanzi: document.getElementById('feedback-hanzi'),
            feedbackPinyin: document.getElementById('feedback-pinyin'),
            feedbackEnglish: document.getElementById('feedback-english'),
            quizCompleteSubtitle: document.getElementById('quiz-complete-subtitle'),
            roadmapButton: document.getElementById('roadmap-button'),
        };

        const icons = {
            check: '<polyline points="20 6 9 17 4 12"></polyline>',
            x: '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
        };

        // ============================================
        // PERSISTENCE
        // ============================================

        function loadProgress() {
            try {
                const saved = localStorage.getItem('chineseLearnerProgress');
                if (saved) {
                    state.lessonProgress = JSON.parse(saved);
                }
            } catch (e) {
                console.error('Error loading progress:', e);
            }
        }

        function saveProgress() {
            try {
                localStorage.setItem('chineseLearnerProgress', JSON.stringify(state.lessonProgress));
            } catch (e) {
                console.error('Error saving progress:', e);
            }
        }

        // ============================================
        // API & IMAGE GENERATION
        // ============================================

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function generateImage(prompt, imgElement, loaderElement, errorElement) {
            // Check cache first
            if (state.imageCache[prompt]) {
                imgElement.src = state.imageCache[prompt];
                loaderElement.classList.add('hidden');
                imgElement.classList.remove('hidden');
                return;
            }

            // IMPORTANT: Add your Google AI API key here
            const apiKey = "YOUR_API_KEY_HERE";
            
            if (!apiKey || apiKey === "YOUR_API_KEY_HERE") {
                errorElement.textContent = 'API key needed';
                errorElement.classList.remove('hidden');
                loaderElement.classList.add('hidden');
                return;
            }

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-001:predict?key=${apiKey}`;
            const payload = {
                instances: [{ prompt: prompt }],
                parameters: { sampleCount: 1 }
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`API error: ${response.status}`);

                const result = await response.json();

                if (result.predictions?.[0]?.bytesBase64Encoded) {
                    const imageUrl = `data:image/png;base64,${result.predictions[0].bytesBase64Encoded}`;
                    state.imageCache[prompt] = imageUrl;
                    imgElement.src = imageUrl;
                    imgElement.classList.remove('hidden');
                } else {
                    throw new Error('Invalid response');
                }
            } catch (err) {
                console.error('Image generation error:', err);
                errorElement.textContent = 'Could not load image';
                errorElement.classList.remove('hidden');
            } finally {
                loaderElement.classList.add('hidden');
            }
        }

        // ============================================
        // EVENT HANDLERS
        // ============================================

        function handlePlayAudio() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const text = dom.promptHanzi.textContent;
                if (!text) return;

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function handleAnswerSelect(selectedIndex, correctIndex) {
            if (state.showFeedback) return;

            state.isCorrect = selectedIndex === correctIndex;
            state.showFeedback = true;

            // Disable all buttons and mark correct/incorrect
            Array.from(dom.optionsArea.children).forEach((button, index) => {
                button.disabled = true;
                if (index === correctIndex) {
                    button.classList.add('correct');
                } else if (index === selectedIndex) {
                    button.classList.add('incorrect');
                }
            });

            updateFeedbackPanel(state.isCorrect);
            dom.feedbackPanel.classList.add('show');

            dom.continueButton.textContent = 'Continue';
            dom.continueButton.className = state.isCorrect ? 'green' : 'red';
            dom.continueButton.classList.remove('hidden');
        }

        function handleContinue() {
            state.showFeedback = false;
            state.isCorrect = false;

            dom.feedbackPanel.classList.remove('show');
            dom.continueButton.classList.add('hidden');

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }

            const lesson = state.currentLessonData;
            if (state.currentQuestionIndex + 1 < lesson.quizQuestions.length) {
                state.currentQuestionIndex++;
                renderCurrentQuestion();
            } else {
                // Lesson complete
                state.quizComplete = true;
                state.lessonProgress[lesson.id] = 'completed';
                saveProgress();
                renderQuizComplete();
            }
            updateProgressBar();
        }

        function handleGoToRoadmap() {
            state.currentQuestionIndex = 0;
            state.quizComplete = false;
            state.currentLessonData = null;

            dom.quizCompleteScreen.classList.remove('active');
            dom.mainContent.classList.remove('active');
            dom.footer.classList.add('hidden');

            dom.roadmapScreen.classList.add('active');
            renderRoadmap();
        }

        function handleStartLesson(lessonId) {
            const lessonData = CURRICULUM_DATA[lessonId];
            if (!lessonData) {
                console.error('No lesson data for:', lessonId);
                return;
            }

            state.currentLessonData = lessonData;
            state.currentQuestionIndex = 0;
            state.quizComplete = false;
            state.showFeedback = false;
            state.isCorrect = false;

            dom.roadmapScreen.classList.remove('active');
            dom.mainContent.classList.add('active');
            dom.footer.classList.remove('hidden');

            dom.continueButton.classList.add('hidden');
            dom.feedbackPanel.classList.remove('show');

            renderCurrentQuestion();
            updateProgressBar();
        }

        // ============================================
        // RENDERING
        // ============================================

        function renderRoadmap() {
            dom.roadmapContent.innerHTML = '';

            // Update progress summary
            const totalLessons = Object.keys(CURRICULUM_DATA).length;
            const completedCount = Object.values(state.lessonProgress).filter(v => v === 'completed').length;
            const progressPercent = Math.round((completedCount / totalLessons) * 100);

            dom.completedLessons.textContent = completedCount;
            dom.totalProgress.textContent = progressPercent + '%';

            // Render units
            ROADMAP_STRUCTURE.forEach(unit => {
                const unitContainer = document.createElement('div');
                unitContainer.className = 'unit-container';

                const unitHeader = document.createElement('div');
                unitHeader.className = 'unit-header';
                unitHeader.style.backgroundColor = unit.color;
                unitHeader.innerHTML = `<h2>${unit.title}</h2>`;

                const lessonNodes = document.createElement('div');
                lessonNodes.className = 'lesson-nodes';

                unit.lessons.forEach((lessonId, index) => {
                    const lessonData = CURRICULUM_DATA[lessonId];
                    if (!lessonData) return;

                    const node = document.createElement('button');
                    node.className = 'lesson-node';
                    node.dataset.lessonId = lessonId;
                    node.innerHTML = `<span>${index + 1}</span>`;

                    if (state.lessonProgress[lessonId] === 'completed') {
                        node.classList.add('completed');
                    }

                    node.onclick = () => handleStartLesson(lessonId);
                    lessonNodes.appendChild(node);
                });

                unitContainer.appendChild(unitHeader);
                unitContainer.appendChild(lessonNodes);
                dom.roadmapContent.appendChild(unitContainer);
            });
        }

        function updateProgressBar() {
            if (!state.currentLessonData) return;

            const total = state.currentLessonData.quizQuestions.length;
            const current = state.currentQuestionIndex + 1;
            const percent = (current / total) * 100;
            dom.progressBar.style.width = `${percent}%`;
        }

        function updateFeedbackPanel(isCorrect) {
            const question = state.currentLessonData.quizQuestions[state.currentQuestionIndex];

            if (isCorrect) {
                dom.feedbackPanel.className = 'correct';
                dom.iconFeedback.innerHTML = icons.check;
                dom.feedbackTitle.textContent = 'Nicely done!';
                dom.feedbackTextLabel.textContent = 'Meaning:';
            } else {
                dom.feedbackPanel.className = 'incorrect';
                dom.iconFeedback.innerHTML = icons.x;
                dom.feedbackTitle.textContent = 'Incorrect';
                dom.feedbackTextLabel.textContent = 'Correct answer:';
            }

            const iconContainer = dom.feedbackPanel.querySelector('.icon-container');
            iconContainer.className = isCorrect ? 'icon-container correct' : 'icon-container incorrect';

            dom.feedbackHanzi.textContent = question.hanzi;
            dom.feedbackPinyin.textContent = question.pinyin;
            dom.feedbackEnglish.textContent = question.english;
        }

        function createOptionButton(option, index, question) {
            const button = document.createElement('button');
            button.className = 'option-button';
            button.onclick = () => handleAnswerSelect(index, question.correctAnswer);

            if (question.type === 'matchText') {
                button.innerHTML = `<div class="option-content-text">${option.text}</div>`;
            } else if (question.type === 'matchImageAndText') {
                button.innerHTML = `
                    <div class="option-content-image-text">
                        <div class="image-container">
                            <div class="loader"></div>
                            <img class="hidden" alt="${option.text}">
                            <div class="error-text hidden"></div>
                        </div>
                        <div class="text-container">${option.text}</div>
                    </div>`;

                const img = button.querySelector('img');
                const loader = button.querySelector('.loader');
                const error = button.querySelector('.error-text');
                generateImage(option.imagePrompt, img, loader, error);
            } else if (question.type === 'matchImage') {
                button.innerHTML = `
                    <div class="option-content-image">
                        <div class="image-container">
                            <div class="loader"></div>
                            <img class="hidden" alt="${option.text}">
                            <div class="error-text hidden"></div>
                        </div>
                        <div class="text-container">${option.text}</div>
                    </div>`;

                const img = button.querySelector('img');
                const loader = button.querySelector('.loader');
                const error = button.querySelector('.error-text');
                generateImage(option.imagePrompt, img, loader, error);
            }

            return button;
        }

        function renderCurrentQuestion() {
            const question = state.currentLessonData.quizQuestions[state.currentQuestionIndex];

            dom.promptText.textContent = question.prompt;
            dom.promptHanzi.textContent = question.hanzi;
            dom.promptPinyin.textContent = question.pinyin;

            dom.optionsArea.innerHTML = '';

            question.options.forEach((option, index) => {
                const button = createOptionButton(option, index, question);
                dom.optionsArea.appendChild(button);
            });
        }

        function renderQuizComplete() {
            dom.mainContent.classList.remove('active');
            dom.footer.classList.add('hidden');
            dom.quizCompleteScreen.classList.add('active');
            dom.quizCompleteSubtitle.textContent = `You finished "${state.currentLessonData.title}"`;
        }

        // ============================================
        // INITIALIZATION
        // ============================================

        function initApp() {
            // Verify DOM elements
            for (const key in dom) {
                if (!dom[key]) {
                    console.error(`Missing DOM element: ${key}`);
                    return;
                }
            }

            // Load saved progress
            loadProgress();

            // Attach event listeners
            dom.continueButton.addEventListener('click', handleContinue);
            dom.promptFocusAudio.addEventListener('click', handlePlayAudio);
            dom.roadmapButton.addEventListener('click', handleGoToRoadmap);
            dom.quitLessonButton.addEventListener('click', handleGoToRoadmap);

            // Render initial roadmap
            renderRoadmap();
        }

        // Start the app
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
