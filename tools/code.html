<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PyConsole TUI</title>
    
    <!-- Fonts: JetBrains Mono for that premium coding feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Pyodide -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
    
    <!-- Marked for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- DOMPurify for sanitizing HTML/Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        // Using CSS variables for dynamic theme switching
                        background: 'var(--bg-primary)',
                        surface: 'var(--bg-surface)',
                        border: 'var(--border-color)',
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS Variables for Theming */
        :root {
            /* Light Mode Defaults */
            --bg-primary: #ffffff;      /* White */
            --bg-surface: #f4f4f5;      /* Zinc 100 */
            --border-color: #e4e4e7;    /* Zinc 200 */
            
            --text-main: #27272a;       /* Zinc 800 */
            --text-muted: #71717a;      /* Zinc 500 */
        }

        .dark {
            /* Dark Mode Overrides */
            --bg-primary: #09090b;      /* Zinc 950 */
            --bg-surface: #18181b;      /* Zinc 900 */
            --border-color: #27272a;    /* Zinc 800 */
            
            --text-main: #d4d4d8;       /* Zinc 300 */
            --text-muted: #a1a1aa;      /* Zinc 400 */
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary); 
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #71717a; 
        }

        /* Markdown and Dataframe Styling within Output */
        .prose-custom {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-main);
        }
        .prose-custom h1, .prose-custom h2, .prose-custom h3 {
            color: var(--text-main);
            font-weight: 600;
            margin-top: 1em;
            margin-bottom: 0.5em;
        }
        .prose-custom p { margin-bottom: 0.5em; }
        .prose-custom code {
            background-color: var(--bg-surface);
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-size: 0.85em;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }
        .prose-custom pre {
            background-color: var(--bg-surface);
            padding: 1em;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        /* Pandas DataFrame / HTML Table Styling */
        .dataframe, table {
            border-collapse: collapse;
            width: 100%;
            margin: 10px 0;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
        }
        .dataframe th, table th {
            background-color: var(--bg-surface);
            color: var(--text-muted);
            font-weight: 600;
            text-align: left;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .dataframe td, table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }
        .dataframe tr:hover td {
            background-color: var(--bg-surface);
        }
        .dataframe tr:last-child td {
            border-bottom: none;
        }

        textarea:focus {
            outline: none;
        }
    </style>
</head>
<!-- Use h-[100dvh] for dynamic viewport height on mobile browsers -->
<body class="bg-background text-zinc-800 dark:text-zinc-300 font-mono h-[100dvh] flex flex-col overflow-hidden selection:bg-zinc-200 dark:selection:bg-zinc-700 selection:text-black dark:selection:text-white transition-colors duration-300">

    <!-- Header / Status Bar -->
    <header class="h-12 border-b border-border flex items-center justify-between px-3 md:px-4 bg-background select-none transition-colors duration-300 flex-shrink-0">
        <div class="flex items-center gap-3">
            <i data-lucide="terminal" class="w-5 h-5 text-zinc-500 dark:text-zinc-400"></i>
            <span class="font-semibold text-sm tracking-wide text-zinc-800 dark:text-zinc-200">PyConsole <span class="hidden sm:inline text-zinc-400 dark:text-zinc-600">v1.3</span></span>
        </div>
        
        <div class="flex items-center gap-2 md:gap-3 text-xs">
            <!-- Mobile: Hide full text status, show only dot -->
            <div id="status-indicator" class="flex items-center gap-2 text-yellow-500 transition-colors duration-300 mr-1 md:mr-2">
                <span class="relative flex h-2.5 w-2.5">
                  <span id="status-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span>
                  <span id="status-dot" class="relative inline-flex rounded-full h-2.5 w-2.5 bg-yellow-500"></span>
                </span>
                <span id="status-text" class="hidden sm:inline">Booting...</span>
            </div>

            <!-- Restart Kernel Button -->
            <button id="restart-btn" class="p-2 rounded-full hover:bg-zinc-200 dark:hover:bg-zinc-800 text-zinc-500 dark:text-zinc-400 transition-colors relative group" title="Restart Kernel">
                <i data-lucide="rotate-cw" class="w-4 h-4"></i>
            </button>

            <!-- Theme Toggle Button -->
            <button id="theme-btn" class="p-2 rounded-full hover:bg-zinc-200 dark:hover:bg-zinc-800 text-zinc-500 dark:text-zinc-400 transition-colors" title="Toggle Theme">
                <i id="theme-icon-sun" data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                <i id="theme-icon-moon" data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
            </button>
        </div>
    </header>

    <!-- Main Output Area (Scrollable) -->
    <main id="output-container" class="flex-1 overflow-y-auto p-3 md:p-4 space-y-6 scroll-smooth pb-8 transition-colors duration-300">
        <!-- Welcome Message -->
        <div class="opacity-60 text-sm mb-8 border-b border-border pb-4">
            <p>Welcome to the interactive Python TUI.</p>
            <p class="mt-2">Packages: <span class="text-green-600 dark:text-green-400">numpy</span>, <span class="text-green-600 dark:text-green-400">pandas</span>.</p>
        </div>
    </main>

    <!-- Input Area (Fixed Bottom) -->
    <div class="border-t border-border bg-background p-3 md:p-4 transition-colors duration-300 flex-shrink-0">
        <div class="max-w-4xl mx-auto relative group">
            
            <!-- Prompt Label: Smaller width on mobile -->
            <div class="absolute left-0 top-3 md:top-3.5 text-zinc-400 dark:text-zinc-500 select-none w-[3rem] md:w-[4.5rem] text-right text-xs font-mono">
                In [ ]:
            </div>

            <!-- Code Input: Less padding on mobile to maximize typing space -->
            <!-- text-base on mobile prevents iOS zoom, text-sm on desktop looks cleaner -->
            <textarea 
                id="code-input"
                class="w-full bg-surface text-zinc-900 dark:text-zinc-100 rounded-lg pl-14 md:pl-20 pr-12 md:pr-24 py-2.5 md:py-3 resize-none border border-border focus:border-zinc-400 dark:focus:border-zinc-600 focus:bg-white dark:focus:bg-zinc-900 transition-all shadow-sm min-h-[50px] max-h-[300px] leading-relaxed text-base md:text-sm"
                placeholder="Code..."
                rows="1"
                disabled
            ></textarea>

            <!-- Actions -->
            <div class="absolute right-2 bottom-2 flex items-center gap-2">
                <span class="text-[10px] text-zinc-400 dark:text-zinc-600 hidden md:inline-block mr-2 font-medium">SHIFT + ENTER</span>
                <button 
                    id="run-btn"
                    class="p-1.5 rounded-md bg-zinc-200 dark:bg-zinc-800 hover:bg-zinc-300 dark:hover:bg-zinc-700 text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-white disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                    disabled
                    title="Run Code"
                >
                    <i data-lucide="play" class="w-4 h-4 fill-current"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Setup Icons ---
        lucide.createIcons();

        // --- DOM Elements ---
        const outputContainer = document.getElementById('output-container');
        const codeInput = document.getElementById('code-input');
        const runBtn = document.getElementById('run-btn');
        const restartBtn = document.getElementById('restart-btn');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        const statusPing = document.getElementById('status-ping');
        const statusIndicator = document.getElementById('status-indicator');
        const themeBtn = document.getElementById('theme-btn');

        let pyodide = null;
        let executionCounter = 0;

        // --- Theme Logic ---
        themeBtn.addEventListener('click', () => {
            const html = document.documentElement;
            html.classList.toggle('dark');
        });

        // --- UI Logic: Auto-resize Textarea ---
        codeInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // --- UI Logic: Status Helper ---
        function setStatus(msg, type) {
            statusText.textContent = msg;
            
            // Reset classes
            statusIndicator.className = "flex items-center gap-2 transition-colors duration-300 mr-1 md:mr-2";
            statusDot.className = "relative inline-flex rounded-full h-2.5 w-2.5";
            statusPing.className = "animate-ping absolute inline-flex h-full w-full rounded-full opacity-75";

            if (type === 'loading') {
                statusIndicator.classList.add("text-yellow-500");
                statusDot.classList.add("bg-yellow-500");
                statusPing.classList.add("bg-yellow-400");
                statusPing.style.display = 'inline-flex';
            } else if (type === 'ready') {
                statusIndicator.classList.add("text-emerald-600", "dark:text-emerald-500");
                statusDot.classList.add("bg-emerald-600", "dark:bg-emerald-500");
                statusPing.style.display = 'none';
            } else if (type === 'working') {
                statusIndicator.classList.add("text-blue-600", "dark:text-blue-500");
                statusDot.classList.add("bg-blue-600", "dark:bg-blue-500");
                statusPing.classList.add("bg-blue-400");
                statusPing.style.display = 'inline-flex';
            } else if (type === 'error') {
                statusIndicator.classList.add("text-red-600", "dark:text-red-500");
                statusDot.classList.add("bg-red-600", "dark:bg-red-500");
                statusPing.style.display = 'none';
            }
        }

        // --- Output Rendering Engine ---
        
        function createOutputBlock(inputCode, count) {
            const blockId = 'block-' + Date.now();
            
            // Calculate line numbers
            const lines = inputCode.split('\n');
            const lineCount = lines.length;
            const lineNumbers = Array.from({length: lineCount}, (_, i) => i + 1).join('\n');

            // Wrapper
            const div = document.createElement('div');
            div.className = "animate-fade-in group mb-6"; 
            
            // Input Cell Structure (Notebook Style)
            const inputEcho = document.createElement('div');
            inputEcho.className = "flex gap-2 md:gap-4 opacity-100 transition-opacity";
            
            // Prompt Label (In [N]:) - Responsive width
            const promptLabel = `<div class="text-zinc-400 dark:text-zinc-500 font-mono text-xs pt-2.5 select-none w-[3rem] md:w-[4.5rem] text-right flex-shrink-0">In [${count}]:</div>`;
            
            // Code Block with Line Numbers
            const codeBlock = `
                <div class="flex-1 bg-surface border border-transparent group-hover:border-zinc-200 dark:group-hover:border-zinc-800 rounded-md transition-colors overflow-hidden min-w-0">
                    <div class="flex text-sm font-mono">
                        <!-- Line Numbers Gutter -->
                        <div class="bg-zinc-50 dark:bg-zinc-800/30 text-zinc-400 dark:text-zinc-600 select-none text-right py-2 pl-1 pr-2 md:pl-2 md:pr-3 border-r border-border leading-relaxed flex-shrink-0 min-w-[1.5rem] md:min-w-[2rem]">
                            <pre class="whitespace-pre-wrap">${lineNumbers}</pre>
                        </div>
                        <!-- Code Content -->
                        <div class="flex-1 py-2 pl-2 pr-2 overflow-x-auto">
                            <pre class="text-zinc-700 dark:text-zinc-300 whitespace-pre-wrap leading-relaxed">${escapeHtml(inputCode)}</pre>
                        </div>
                    </div>
                </div>
            `;

            inputEcho.innerHTML = promptLabel + codeBlock;
            
            // Result Container - aligned to right of prompt label
            const outputArea = document.createElement('div');
            outputArea.id = blockId;
            outputArea.className = "ml-[3.5rem] md:ml-[5.5rem] mt-2 text-sm space-y-2 overflow-x-auto"; 

            div.appendChild(inputEcho);
            div.appendChild(outputArea);
            outputContainer.appendChild(div);
            
            // Scroll to bottom
            outputContainer.scrollTo({ top: outputContainer.scrollHeight, behavior: 'smooth' });

            return outputArea;
        }

        function appendToBlock(block, content, type) {
            const el = document.createElement('div');
            
            if (type === 'error') {
                el.className = "bg-red-50 dark:bg-red-900/20 border-l-2 border-red-500 text-red-700 dark:text-red-200 p-3 rounded-r text-xs font-mono whitespace-pre-wrap break-words";
                el.textContent = content;
            } else if (type === 'stdout') {
                el.className = "text-zinc-600 dark:text-zinc-400 whitespace-pre-wrap font-mono mb-1 break-words";
                el.textContent = content;
            } else if (type === 'result') {
                if (typeof content === 'string' && content.trim().startsWith('<table') && content.includes('dataframe')) {
                    el.className = "overflow-x-auto block w-full";
                    el.innerHTML = DOMPurify.sanitize(content);
                } else {
                    el.className = "text-emerald-600 dark:text-emerald-400 font-mono mt-1 whitespace-pre-wrap break-words";
                    el.textContent = content;
                }
            } else if (type === 'markdown') {
                el.className = "prose-custom max-w-none";
                el.innerHTML = DOMPurify.sanitize(marked.parse(content));
            } else if (type === 'html') {
                el.className = "overflow-x-auto block w-full";
                el.innerHTML = DOMPurify.sanitize(content);
            }

            block.appendChild(el);
            outputContainer.scrollTo({ top: outputContainer.scrollHeight, behavior: 'smooth' });
        }

        // Helper to escape HTML for code echo
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // --- JavaScript <-> Python Bridge Functions ---
        
        window.render_markdown = (text) => {
            const currentBlock = window.activeOutputBlock;
            if(currentBlock) appendToBlock(currentBlock, text, 'markdown');
        };

        window.render_html = (html) => {
            const currentBlock = window.activeOutputBlock;
            if(currentBlock) appendToBlock(currentBlock, html, 'html');
        };

        // --- Pyodide Execution Logic ---
        
        // Define setup script as a string constant to reuse in init and restart
        const PYTHON_SETUP_SCRIPT = `
            import sys
            import io
            import js
            import numpy as np
            import pandas as pd

            def display_markdown(text):
                js.render_markdown(text)
            
            def display_html(html_str):
                js.render_html(html_str)
            
            def display_df(df):
                display_html(df.to_html(classes='dataframe'))

            # Signal that we are ready
            print("Environment initialized.")
        `;

        async function initPyodide() {
            try {
                pyodide = await loadPyodide();
                setStatus("Loading...", "loading");
                
                await pyodide.loadPackage(["numpy", "pandas"]);
                
                // Run setup
                pyodide.runPython(PYTHON_SETUP_SCRIPT);

                setStatus("Ready", "ready");
                codeInput.disabled = false;
                runBtn.disabled = false;
                codeInput.focus();
                
            } catch (err) {
                setStatus("Init Error", "error");
                console.error(err);
                const block = createOutputBlock("System Start", 0);
                appendToBlock(block, err.message, 'error');
            }
        }

        // --- Kernel Restart Logic ---
        async function restartKernel() {
            if (!pyodide) return;
            
            setStatus("Restarting...", "working");
            
            try {
                // Clear user namespace (keep builtins)
                await pyodide.runPythonAsync(`
                    keep = {'__name__', '__doc__', '__package__', '__loader__', '__spec__', '__annotations__', '__builtins__'}
                    for name in list(globals().keys()):
                        if name not in keep:
                            del globals()[name]
                `);
                
                // Re-run setup script to restore imports and helpers
                await pyodide.runPythonAsync(PYTHON_SETUP_SCRIPT);

                // Reset Counter
                executionCounter = 0;
                
                // Visual Indicator
                const div = document.createElement('div');
                div.className = "flex justify-center my-6 animate-fade-in";
                div.innerHTML = `<span class="bg-zinc-100 dark:bg-zinc-800 text-zinc-500 text-xs px-3 py-1 rounded-full border border-border flex items-center gap-2"><i data-lucide="rotate-cw" class="w-3 h-3"></i> Kernel Restarted</span>`;
                outputContainer.appendChild(div);
                outputContainer.scrollTo({ top: outputContainer.scrollHeight, behavior: 'smooth' });
                
                lucide.createIcons(); // Refresh icons for the badge
                setStatus("Ready", "ready");

            } catch (err) {
                setStatus("Error", "error");
                console.error(err);
                const block = createOutputBlock("Kernel Restart", 0);
                appendToBlock(block, "Failed to restart kernel: " + err.message, 'error');
            }
        }

        async function runCode() {
            const code = codeInput.value;
            if (!code.trim() || !pyodide) return;

            // Increment Counter
            executionCounter++;

            // UI Updates
            codeInput.value = '';
            codeInput.style.height = 'auto'; // Reset height
            codeInput.disabled = true;
            runBtn.disabled = true;
            setStatus("Running...", "working");

            // Create a new output block for this execution
            const block = createOutputBlock(code, executionCounter);
            window.activeOutputBlock = block; // Global ref for Python helpers

            try {
                pyodide.runPython(`
                    sys.stdout = io.StringIO()
                    sys.stderr = io.StringIO()
                `);

                // Execute
                let result = await pyodide.runPythonAsync(code);

                // Fetch stdout/stderr
                let stdout = pyodide.runPython("sys.stdout.getvalue()");
                let stderr = pyodide.runPython("sys.stderr.getvalue()");

                if (stdout) appendToBlock(block, stdout.trimEnd(), 'stdout');
                if (stderr) appendToBlock(block, stderr.trimEnd(), 'error');

                // Handle Return Value
                if (result !== undefined && result !== null) {
                    let isDf = false;
                    try {
                         isDf = pyodide.runPython("isinstance(result, pd.DataFrame)", { globals: pyodide.toPy({ result: result }) });
                    } catch(e) {} 

                    if (isDf) {
                        let html = pyodide.runPython("result.to_html(classes='dataframe')");
                        appendToBlock(block, html, 'html');
                    } else {
                        let repr = result.toString();
                        try {
                             repr = pyodide.globals.get('repr')(result);
                        } catch(e) {}
                        appendToBlock(block, repr, 'result');
                    }
                }

            } catch (err) {
                let stderr = "";
                try { stderr = pyodide.runPython("sys.stderr.getvalue()"); } catch(e){}
                if (stderr) appendToBlock(block, stderr.trimEnd(), 'error');
                
                appendToBlock(block, err.message, 'error');
            } finally {
                codeInput.disabled = false;
                runBtn.disabled = false;
                codeInput.focus();
                setStatus("Ready", "ready");
                window.activeOutputBlock = null;
            }
        }

        // --- Event Listeners ---
        
        runBtn.addEventListener('click', runCode);
        restartBtn.addEventListener('click', restartKernel);

        codeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.shiftKey) {
                e.preventDefault();
                runCode();
            }
        });

        // Initialize
        initPyodide();

    </script>
</body>
</html>
