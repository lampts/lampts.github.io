<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Stories - by AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lora', serif; /* Default serif font for text */
            background-color: #F5F5F0; /* Off-white/cream background */
            color: #333333; /* Dark gray text */
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden; /* Prevent horizontal scrollbar from app-container potentially */
        }

        #app-container {
            display: flex;
            flex-grow: 1; /* Allow app-container to fill vertical space */
            width: 100%;
            max-width: 1600px; /* Optional: Max width for very large screens */
            margin: 0 auto; /* Center the app container */
        }

        /* Sidebar Styling */
        #sidebar {
            width: 250px; /* Fixed width for sidebar */
            background-color: #F5F5F0; /* Same as body or slightly different */
            padding: 40px 20px 20px 40px;
            font-family: 'Courier Prime', monospace; /* Monospace font */
            font-size: 14px;
            border-right: 1px solid #e0e0e0; /* Subtle separator */
            position: fixed; /* Fixed position */
            left: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto; /* Scroll if many stories */
            display: flex;
            flex-direction: column;
        }

        #story-list {
            list-style-type: none;
            flex-grow: 1; /* Allow list to take available space before button */
        }

        #story-list li {
            margin-bottom: 12px;
            cursor: pointer;
            color: #777;
            transition: color 0.2s ease-in-out;
        }

        #story-list li:hover {
            color: #333;
        }

        #story-list li.active {
            color: #000;
            font-weight: 700; /* Bold for active item */
        }

        #toggle-visual-btn {
            display: block; 
            margin-top: 20px; 
            padding: 8px 10px;
            font-family: 'Courier Prime', monospace;
            font-size: 13px;
            background-color: #e0e0e0;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            width: 100%; 
        }

        #toggle-visual-btn:hover {
            background-color: #d0d0d0;
        }


        /* Main Content Area */
        #main-content {
            flex-grow: 1; /* Takes remaining space */
            display: flex;
            padding: 40px;
            margin-left: 250px; /* Account for fixed sidebar width */
            overflow-y: hidden; /* Prevent this container from scrolling, panes will scroll */
            transition: margin-left 0.3s ease-in-out; /* Smooth transition for text pane expansion */
        }

        #visual-pane {
            width: 45%; /* Adjust as needed */
            padding-right: 30px; /* Space between visual and text */
            display: flex;
            align-items: flex-start; /* Align image to the top */
            justify-content: center;
            transition: width 0.3s ease-in-out, opacity 0.3s ease-in-out, padding-right 0.3s ease-in-out;
            opacity: 1;
        }

        #story-image {
            max-width: 100%;
            max-height: 80vh; /* Limit image height */
            height: auto; /* Maintain aspect ratio */
            object-fit: contain;
            border: 1px solid #ddd; /* Optional: subtle border for image */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        #text-pane {
            width: 55%; /* Adjust as needed */
            padding-left: 30px;
            border-left: 1px solid #e0e0e0; /* Separator for text pane */
            overflow-y: auto; /* Allow text pane to scroll */
            max-height: calc(100vh - 80px); /* Adjust based on padding, roughly full viewport height */
            transition: width 0.3s ease-in-out, padding-left 0.3s ease-in-out, border-left 0.3s ease-in-out;
        }

        /* Styles for when visual pane is hidden */
        #main-content.visual-hidden #visual-pane {
            width: 0;
            opacity: 0;
            padding-right: 0;
            overflow: hidden; /* Prevent content from showing during transition */
        }

        #main-content.visual-hidden #text-pane {
            width: 100%;
            border-left: none;
            padding-left: 0;
        }


        #story-main-title {
            font-size: 1.8em;
            margin-bottom: 20px;
            font-weight: 700;
            color: #222;
        }

        #text-pane p {
            margin-bottom: 1em;
            font-size: 1em; /* Base font size for story text */
        }

        #text-pane ul {
            margin-left: 20px;
            margin-bottom: 1em;
        }

        #text-pane li {
            margin-bottom: 0.5em;
        }

        /* Footer Styling */
        #page-footer {
            text-align: center;
            padding: 20px;
            font-family: 'Courier Prime', monospace;
            font-size: 0.9em;
            color: #555;
            width: calc(100% - 250px); /* Align with main content */
            margin-left: 250px; /* Account for fixed sidebar */
            border-top: 1px solid #e0e0e0;
            transition: width 0.3s ease-in-out, margin-left 0.3s ease-in-out;
        }
        
        /* Responsive Adjustments (Basic) */
        @media (max-width: 900px) {
            #sidebar {
                width: 200px;
                padding: 30px 15px 15px 30px;
            }
            #main-content {
                margin-left: 200px;
                padding: 30px;
            }
            #page-footer {
                width: calc(100% - 200px);
                margin-left: 200px;
            }
            #visual-pane {
                width: 40%;
            }
            #text-pane {
                width: 60%;
            }
            /* When visual hidden on medium screens */
            #main-content.visual-hidden #visual-pane {
                 /* Already handled by global .visual-hidden */
            }
            #main-content.visual-hidden #text-pane {
                 /* Already handled by global .visual-hidden */
            }
        }

        @media (max-width: 768px) {
            #app-container {
                flex-direction: column;
            }
            #sidebar {
                position: relative; /* Change from fixed for stacking */
                width: 100%;
                height: auto; /* Auto height for content */
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
                padding: 20px;
                overflow-y: visible; /* Allow natural scroll if needed */
                flex-direction: row; /* For button and list */
                align-items: center; /* Align items vertically */
            }
            #story-list {
                display: flex; /* Horizontal list for smaller screens */
                flex-wrap: wrap; /* Allow wrapping */
                justify-content: flex-start; /* Align to start */
                flex-grow: 1;
            }
            #story-list li {
                margin-right: 15px; /* Spacing for horizontal items */
                margin-bottom: 10px; /* Spacing if they wrap */
            }
            #toggle-visual-btn {
                margin-top: 0;
                margin-left: 15px; /* Space from story list */
                width: auto; /* Don't take full width */
                padding: 6px 12px;
            }

            #main-content {
                flex-direction: column; /* Stack visual and text panes */
                margin-left: 0;
                padding: 20px;
            }
            #visual-pane { /* Default when stacked */
                width: 100%;
                padding-right: 0;
                margin-bottom: 20px;
                align-items: center; /* Center image when stacked */
            }
            #story-image {
                max-height: 50vh; /* Adjust for smaller layout */
            }
            #text-pane { /* Default when stacked */
                width: 100%;
                padding-left: 0;
                border-left: none;
                max-height: none; /* Allow natural height based on content */
                overflow-y: visible;
            }

            /* When visual hidden on small screens (stacked) */
            #main-content.visual-hidden #visual-pane {
                display: none; /* Just hide it, no fancy width transition needed here */
                margin-bottom: 0;
            }
            #main-content.visual-hidden #text-pane {
                /* Text pane already takes 100% width in stacked mode */
            }

            #page-footer {
                width: 100%;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div id="app-container">
        <aside id="sidebar">
            <ul id="story-list">
                <!-- Story navigation will be populated by JavaScript -->
            </ul>
            <button id="toggle-visual-btn">Hide Image</button> 
        </aside>

        <main id="main-content">
            <div id="visual-pane">
                <img id="story-image" src="" alt="Story illustration">
            </div>
            <div id="text-pane">
                <h2 id="story-main-title"></h2>
                <div id="story-body-content">
                    <!-- Story text will be populated by JavaScript -->
                </div>
            </div>
        </main>
    </div>

    <footer id="page-footer">
        <p>BIRD STORIES – by VQH</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const storyListData = [
                {
                    id: "story1",
                    sidebarTitle: "01. KẾ HOẠCH HOÀN HẢO",
                    mainTitle: "1. KẾ HOẠCH HOÀN HẢO (THE PERFECT PLAN)",
                    imageUrl: "perfect-plan.jpg",
                    storyHtmlContent: `
                        <p>Ngài Bói-Cá hiểu sâu biết rộng, lại cũng có đầu óc lập kế hoạch chi li. (Mr. Kingfisher was very smart and loved to make detailed plans.)</p>
                        <p>Bữa nay, từ mờ sáng ngài đã đậu trên cành cao suy tư. (This morning, he sat on a high branch thinking hard.)</p>
                        <p>Ngài có thể kiểm soát tốc độ bay, khi nhanh lúc chậm. (He could control how fast he flew - sometimes fast, sometimes slow.)</p>
                        <p>Vậy tính sao cho khi thư thả, lúc khẩn trương, việc bắt cá đỡ tốn sức. (He wanted to plan when to relax and when to hurry, so catching fish would be easier.)</p>
                        <p>Kinh nghiệm xử lý bọn cá dưới ao giúp ngài đoán biết con nào to hay bé, mau lẹ hay lờ đờ. (His experience helped him know which fish were big or small, fast or slow.)</p>
                        <p>Nhờ vậy, làm chủ được cơ hội về chộp chuẩn nhất, thế mới còn nhiều thời gian để suy ngẫm chuyện thiên địa. (This way, he could catch fish perfectly and have time to think about other things.)</p>
                        <p>Ngài lại hiểu cả lòng mình, sức vóc ấy ngày mấy bữa, mỗi bữa mấy con, biết rõ sự dành dụm nay mai. (He knew himself well - how many meals a day, how many fish each meal, and how to save for tomorrow.)</p>
                        <p>Cá con chờ lớn, cá to xơi trước... (Small fish wait to grow, big fish eat first...)</p>
                        <p>Vạn chuyện, ngài tính được cả. (He could calculate everything.)</p>
                        <p>Nghĩ nháp, rồi lên kế hoạch để hành động. (He made drafts, then made plans for action.)</p>
                        <p>Việc "vạn trù" ấy ngài cũng thạo lắm. (He was very good at this "planning everything".)</p>
                        <p>Kế hoạch xong, chưa yên tâm, lại chỉnh. (When the plan was done, he wasn't satisfied and fixed it again.)</p>
                        <p>Phàm là sự hoàn hảo thì đòi hỏi kỳ công. (Perfect things need lots of work.)</p>
                        <p>Có phải làm lại bao lần Bói-Cá cũng không nề hà... (Even if he had to redo it many times, Kingfisher didn't mind...)</p>
                        <p>Cứ thế, ngài miệt mài sự nghiệp toán học. (So he kept working on his math project.)</p>
                        <p>Hết ngày, ngài hết sức tâm đắc với kế hoạch kiếm ăn hoàn hảo được soạn ra. (By the end of the day, he was very proud of his perfect eating plan.)</p>
                        <p>Ngài Bói-Cá thổn thức, không sao ngủ được. (Mr. Kingfisher was so excited, he couldn't sleep.)</p>
                        <p>Cảm giác cồn cào ở bụng. (He felt something rumbling in his stomach.)</p>
                        <p>Hóa ra Ngài... đói. (It turned out he was... hungry.)</p>
                    `
                },
                {
                    id: "story2",
                    sidebarTitle: "02. NHẸ GÁNH, THẢNH THƠI",
                    mainTitle: "2. NHẸ GÁNH, THẢNH THƠI (LIGHT LOAD, CAREFREE)",
                    imageUrl: "light-load.jpg",
                    storyHtmlContent: `
                        <p>Dạo này thấy ngài Bói-Cá ít giao thiệp, hay trầm tư. (These days, Mr. Kingfisher was quiet and thoughtful.)</p>
                        <p>Chim-Gáy tới thăm. (Sparrow came to visit.)</p>
                        <p>Gáy nói: (Sparrow said:)</p>
                        <ul><li>Bữa nay trời đẹp, ngài nên đi cùng tôi thăm ruộng lúa. (- Today is beautiful, you should come with me to see the rice fields.)</li></ul>
                        <p>Lúc này sắp mùa gặt, ruộng đồng vui, nhiều chim kéo về. (It's almost harvest time, the fields are fun, many birds come.)</p>
                        <p>Ngài ra đó còn biết thêm nhiều việc đời. (You can learn many things about life there.)</p>
                        <p>Bói-Cá đã điểm tâm, nên vui vẻ đi cùng Gáy. (Kingfisher had eaten breakfast, so he happily went with Sparrow.)</p>
                        <p>Ngài thấy ruộng lúa sắp chín vàng thì xúc động lắm. (He was moved when he saw the golden rice almost ready.)</p>
                        <p>Đồng ruộng mênh mông, Bói-Cá và Gáy sà vào nơi vàng ruộm. (The fields were vast, Kingfisher and Sparrow flew into the golden area.)</p>
                        <p>Bên đám ruộng trông sung túc, được mùa, Bói-Cá lân la hỏi chuyện. (Near the rich, good harvest rice, Kingfisher tried to chat.)</p>
                        <p>Lạ thay chẳng mấy ai trả lời. (Strangely, not many answered.)</p>
                        <p>Anh thì mải gồng chống đỡ gió, anh lại gồng giữ bông, hay bận che chắn bọn chim chóc chỉ chờ vặt hạt chín. (Some were busy holding against wind, some protecting their grains, some blocking birds waiting to steal ripe seeds.)</p>
                        <p>Anh nào cũng lưng còng, mặt úp. (Everyone had bent backs and heads down.)</p>
                        <p>Mãi mà vẫn chưa được câu nào ra đầu ra đũa. (They couldn't get any proper conversation.)</p>
                        <p>Thấy Bói-Cá nản, Gáy bảo: (Seeing Kingfisher discouraged, Sparrow said:)</p>
                        <ul><li>Ta sang phía bên kia, chỗ ấy lao xao, vui vẻ. (- Let's go to the other side, it's noisy and fun there.)</li></ul>
                        <p>Các anh bên ấy vươn lên vẫy chào, có dáng hay chuyện. (The ones there stretch up to wave, they look chatty.)</p>
                        <p>Quả nhiên sang bên ấy bắt chuyện được ngay. (Indeed, they could chat right away on that side.)</p>
                        <p>Tò mò, Bói-Cá hỏi: (Curious, Kingfisher asked:)</p>
                        <ul><li>Cùng cánh đồng này sao hai bên tính cách khác nhau? (- Same field, why are the two sides so different?)</li></ul>
                        <p>Bên kia đăm đăm, bên này hồ hởi. (That side is serious, this side is cheerful.)</p>
                        <p>Một anh Lúa đang lắc lư theo gió nhanh nhảu: (A Rice plant swaying in the wind quickly said:)</p>
                        <ul><li>Vâng, hoàn cảnh khác nhau. (- Yes, different situations.)</li></ul>
                        <p>Chúng em nhẹ gánh, thảnh thơi lắm. (We have light loads, very carefree.)</p>
                        <p>Các bác bên kia suốt ngày cau có, chăm chăm giữ đám hạt chín. (Those uncles over there frown all day, carefully guarding their ripe grains.)</p>
                        <p>Phí cơ hội hưởng cái vui mùa hát, tán gẫu những ngày nắng đẹp... (They miss the chance to enjoy harvest songs and chat on sunny days...)</p>
                        <p>Vừa nói, anh Lúa ưỡn ngực, dang tay như muốn ôm trời đất vào lòng, mắt long lanh không giấu sự kiêu hãnh. (While talking, Rice stretched his chest, spread his arms like hugging the world, eyes shining with pride.)</p>
                        <p>Đôi tay Lúa đập đập vào thân mình đang đu đưa, khiến cánh lá phát phơ. (Rice's hands patted his swaying body, making leaves flutter.)</p>
                        <p>Bói-Cá mắt tinh nhận ra, phía bên này, anh nào cũng chỉ toàn hạt lép... (Kingfisher's sharp eyes noticed that on this side, everyone only had empty grains...)</p>
                    `
                },
                {
    "id": "story3",
    "sidebarTitle": "03. GIA TRUYỀN...",
    "mainTitle": "3. GIA TRUYỀN... (FAMILY TRADITION...)",
    "imageUrl": "family-tradition.jpg",
    "storyHtmlContent": `
        <p>Xóm chim lao xao mấy hôm rày vì bọn Bồ-Nông lạ. (The bird village was noisy these days because of strange Pelicans.)</p>
        <p>Chúng đến xóm kiếm ăn. (They came to the village to find food.)</p>
        <p>Chỉ có ba thằng, nhưng bắt cá chăm chỉ từ sáng đến đêm, ăn rất khỏe. (Only three of them, but they caught fish from morning to night, eating a lot.)</p>
        <p>Bói-Cá lo lắng, bay đậu không yên, tối đến bèn đòi họp xóm. (Kingfisher was worried, couldn't perch peacefully, so he called a village meeting that night.)</p>
        <p>Nể ngài, bọn chim dù đã ngáp ngủ đều đến, vắng mỗi cô Cò. (Respecting him, all birds came even though sleepy, only Ms. Stork was absent.)</p>
        <p>Ngài yêu cầu họp kể tội bọn Bồ-Nông, rồi ra quyết định tống cổ bọn quấy phá khỏi xóm. (He wanted to discuss the Pelicans' crimes and decide to kick these troublemakers out.)</p>
        <p>Đủ các loại ý kiến loạn xạ. (There were all kinds of messy opinions.)</p>
        <p>Chào-Mào, Liễu-Tiễu cãi hăng còn suýt mổ nhau - dù cùng ý kiến rằng có hết cá thì vẫn còn sâu. (Oriole and Warbler argued fiercely and almost pecked each other - even though they agreed that without fish, there were still worms.)</p>
        <p>Chim Sâu bị khiển trách vì lan man, nhân dịp đông đủ xóm kiến cáo chim sẽ tự tiện vào tổ ngủ trưa. (Worm-bird was scolded for rambling, taking the chance when everyone was there to complain about birds entering nests at noon.)</p>
        <p>Sáo thì tranh thủ tiếp thị dịch vụ dọn dẹp. (Magpie took the chance to advertise cleaning services.)</p>
        <p>Bói-Cá đập mỏ vào chạc cây, quát: (Kingfisher banged his beak on a branch, shouted:)</p>
        <ul><li>Không bàn chuyện xằng nữa. (- No more nonsense talk.)</li></ul>
        <p>Tất cả tập trung vào việc ăn cá! (Everyone focus on the fish-eating matter!)</p>
        <p>Xóm im bặt. (The village went silent.)</p>
        <p>Mãi cũng có giọng Chim-Gáy cất lên từng tiếng rành rọt: (Finally, Sparrow's voice spoke clearly:)</p>
        <ul><li>Thưa ông Bói-Cá, nhưng mà ông cũng là tay bắt cá thiện nghệ, và ăn cá chủ lực... (- Mr. Kingfisher, but you are also a skilled fish catcher and mainly eat fish...)</li></ul>
        <p>Khó xử, ngài nặn: (Embarrassed, he squeezed out:)</p>
        <ul><li>Hẵn. (- Well.)</li></ul>
        <p>Ta bắt cá có phong cách, ăn cá có đạo lý! (I catch fish with style, eat fish with morals!)</p>
        <p>Nhiều đời gia truyền đã như thế. (Many generations of family tradition have been like this.)</p>
        <p>Đâu như cái bọn phàm ăn tục uống, chả có lễ nghĩa, lang bạt kiếm ăn... (Not like those vulgar eaters, no manners, wandering for food...)</p>
        <p>Chưa dứt lời, bỗng thấy Cò hổn hển xông vào. (Before finishing, suddenly Stork rushed in panting.)</p>
        <p>Té ra, Cò muốn họp vì mải đi rình Bồ-Nông, rồi bị bọn chúng phát hiện. (It turned out Stork wanted the meeting because she was spying on the Pelicans and got discovered.)</p>
        <p>Mãi mới về được. (She barely made it back.)</p>
        <p>Bói-Cá hỏi: (Kingfisher asked:)</p>
        <ul><li>Rồi sao nữa? (- Then what?)</li></ul>
        <p>Cò: - Dạ, bọn họ to khỏe, mỏ như cái gầu xúc, chỉ sợ lơ mơ phạng cho một nhát là toi đời... (Stork: - Well, they're big and strong, beaks like scoops, if I'm careless and get hit once, I'm done...)</p>
        <p>Bói-Cá giục: (Kingfisher urged:)</p>
        <ul><li>Mày nói mau lên xem nào. (- Tell us quickly.)</li></ul>
        <p>Cò: - Hóa ra, họ hiền lành, thưa gửi lễ phép. (Stork: - Turns out, they're gentle and polite.)</p>
        <p>Họ đưa cho hai tờ giấy, bảo đọc rồi về báo cáo... (They gave me two papers, told me to read and report back...)</p>
        <p>Bói-Cá: - Thế tờ giấy ấy nói gì? (Kingfisher: - What do the papers say?)</p>
        <p>Cò: - Một tờ ghi "Chứng chỉ phong cách và đạo đức bắt cá". (Stork: - One says "Certificate of Style and Ethics in Fish Catching".)</p>
        <p>Tờ kia: "Được bắt cá toàn cõi". (The other: "Licensed to catch fish everywhere".)</p>
        <p>Nghe tới đây, tai ngài ù đi, mắt tối sầm, ngất lịm. (Hearing this, his ears buzzed, eyes darkened, he fainted.)</p>
        <p>Bọn chim xúm lại cùng chữa chạy. (The birds gathered to help.)</p>
        <p>Lát sau, ngài mở mắt thều thào: (Later, he opened his eyes and whispered:)</p>

        <p>Thế mà bây giờ mới biết, xưa nay nhà ta toàn đánh bắt lậu! (But now I know, all along my family has been fishing illegally!)</p>

    "storyHtmlContent": `
        <p>Một sáng hè, xóm lặng im. (One summer morning, the village was quiet.)</p>
        <p>Bọn chim đang chăm chú nghe một tay lang bạt mới xuất hiện. (The birds were listening carefully to a new wanderer.)</p>
        <p>Không biết giống gì, nhưng lông đủ màu, điệu bộ ngộ nghĩnh, kiến thức lạ lẫm. (Unknown species, but colorful feathers, funny movements, strange knowledge.)</p>
        <p>Kể chuyện mà như danh sư giảng bài, nên xóm gọi là Chim-Sư, đáp ứng mọi tò mò của xóm chim ham học. (He told stories like a famous teacher lecturing, so the village called him Teacher-Bird, answering all curiosities of birds who loved learning.)</p>
        <p>Chim-Sâu học cách tìm sâu buổi chiều, đỡ phải dậy sớm. (Worm-Bird learned to find worms in the evening, avoiding early mornings.)</p>
        <p>Bọn Sẻ biết đường trộm lúa trong kho khi ngoài đồng hết thóc. (Sparrows learned the way to steal rice from storage when fields were empty.)</p>
        <p>Chào-Mào nắm được tinh thần thời trang để dự thi nhan sắc... (Oriole grasped fashion spirit for beauty contests...)</p>
        <p>Ngẫm nghĩ, thấy cần nâng tầm nghệ thuật bắt cá, Bói-Cá cũng khẩn khoản nhờ chỉ dạy. (Thinking he needed to improve his fish-catching art, Kingfisher also urgently asked for teaching.)</p>
        <p>Chim-Sư nhận lời chỉ cho ba bí quyết, đổi lại Bói-Cá trả công bằng hiện vật đánh bắt. (Teacher-Bird agreed to teach three secrets, in exchange Kingfisher would pay with caught fish.)</p>
        <p>Khóa học nâng cao diễn ra bên Ao Chậu. (The advanced course happened at Basin Pond.)</p>
        <p>Chim-Sư và Bói-Cá đậu trên cành tre giữa ao. (Teacher-Bird and Kingfisher perched on a bamboo branch over the pond.)</p>
        <p>Bọn chim tò mò dự thính đậu loanh quanh. (Curious birds perched around to listen.)</p>
        <p>Đầu tiên, Chim-Sư chỉ ra cần chấm dứt thói bay lượn điệu đà, mất sức. (First, Teacher-Bird pointed out the need to stop graceful flying, which wastes energy.)</p>
        <p>Đánh bắt cá phải cốt ở hiệu quả. (Catching fish must focus on effectiveness.)</p>
        <p>Bói-Cá gật gù ghi nhớ. (Kingfisher nodded and memorized.)</p>
        <p>Tiếp đến, quan sát con mồi vừa sức. (Next, observe prey that matches your strength.)</p>
        <p>Bói-Cá hiểu ngay. (Kingfisher understood immediately.)</p>
        <p>Đã vài lần vồ trượt cá bé nhanh nhẹn, chưng hửng bực mình. (Several times he missed small quick fish, feeling frustrated.)</p>
        <p>Lúc gặp phải cá to thì quá sức, có khi còn bị lôi đi suýt toi mạng. (When meeting big fish, it was too much, sometimes almost getting dragged to death.)</p>
        <p>Cuối cùng, cần lao xuống nước tốc độ cao, kẹp mỏ chặt, kiên quyết truy đuổi con mồi dưới nước. (Finally, need to dive at high speed, clamp beak tight, determinedly chase prey underwater.)</p>
        <p>Thuận lợi thì đập nước, vỗ cánh vọt lên. (If successful, hit water, flap wings and shoot up.)</p>
        <p>Bói-Cá hoan hỉ, còn đám chim đồng thanh ca ngợi danh sư. (Kingfisher was delighted, and the bird crowd praised the master together.)</p>
        <p>Chim-Sư lấy làm đẹp lòng lắm. (Teacher-Bird was very pleased.)</p>
        <p>Thế rồi, cả bọn năn nỉ xin được thị phạm. (Then, everyone begged for a demonstration.)</p>
        <p>Không thể từ chối, Chim-Sư nhận lời. (Unable to refuse, Teacher-Bird agreed.)</p>
        <p>Xóm chim nín thở chờ màn trình diễn. (The bird village held their breath waiting for the performance.)</p>
        <p>Quan sát rất nhanh, dường như đã xác định mục tiêu, ngài lao xuống. (Observing very quickly, seeming to have identified the target, he dove down.)</p>
        <p>Thoáng cái ngài đã lặn vào làn nước. (In a flash, he had plunged into the water.)</p>
        <p>Nhìn từ trên thấy trong đáy nước mờ ảo, ngài đang xoay vòng vũ điệu chân-cánh-mỏ giữa cuộc thủy chiến hùng tráng. (Looking from above into the murky water bottom, he was spinning in a leg-wing-beak dance in a heroic water battle.)</p>
        <p>Thoáng chốc, đã kẹp chặt con mồi. (In a moment, he had clamped the prey tight.)</p>
        <p>Rõ là phần thắng của Chim-Sư đã phân định từ trước! (Clearly Teacher-Bird's victory was determined beforehand!)</p>
        <p>Không riêng Bói-Cá mà cả xóm sửng sốt khâm phục, ra sức trầm trồ. (Not just Kingfisher but the whole village was amazed and admiring, praising loudly.)</p>
        <p>Có điều, mãi ngài chưa vọt lên. (But he still hadn't shot up.)</p>
        <p>Chờ một lúc, e có chuyện chẳng lành, Bói-Cá lao xuống cấp cứu, mỏ kẹp cổ, chân đỡ cánh, hì hục kéo ngài lên. (Waiting a while, fearing something bad, Kingfisher dove down to rescue, beak clamping neck, feet supporting wings, struggling to pull him up.)</p>
        <p>Tới bờ, Chim-Sư nằm bất tỉnh. (At shore, Teacher-Bird lay unconscious.)</p>
        <p>Cổ ngẹo, điệu ọng nước. (Neck twisted, posture of vomiting water.)</p>
        <p>Con mồi ngài săn được văng ra: mẩu gỗ mục dài non nửa gang tay. (The prey he hunted flew out: a piece of rotten wood almost half a hand long.)</p>
    `

    "imageUrl": "home.jpg",
    "storyHtmlContent": `
        <p>Bói-Cá vốn ở hang đào ven ao đã lâu, nay muốn có dinh cơ mới. (Kingfisher had lived in a dug cave by the pond for long, now wanted a new home.)</p>
        <p>Ngài đi tham khảo cách xây nhà của bọn chim. (He went to consult how birds build houses.)</p>
        <p>Thăm nhà Sẻ trên cành phi lao trước. (First visited Sparrow's house on the casuarina branch.)</p>
        <p>Được cái mặt tiền đẹp, trên cao thoáng gió. (Nice front view, high up with good breeze.)</p>
        <p>Nhưng ở chơi một lúc thì chóng mặt. (But staying a while made him dizzy.)</p>
        <p>Gặp gió, tổ lắc lư như sắp rụng. (When windy, the nest swayed like it would fall.)</p>
        <p>Đã vậy, tổ đan thưa bằng cọng phi lao - dù Sẻ bảo chắc lắm - ngài thấy nó chỉ chực bung ra. (Moreover, the nest was loosely woven with casuarina twigs - though Sparrow said very strong - he saw it ready to burst.)</p>
        <p>Ngài đành chào, rồi rẽ qua Chim-Sâu. (He said goodbye, then turned to Worm-Bird.)</p>
        <p>Tổ Chim-Sâu nằm ở chạc cây mít, nơi thấp hơn, nhưng bền tốt, làm bằng cọng tế xuyến chi, vừa dai vừa dài. (Worm-Bird's nest was at a jackfruit tree fork, lower place, but durable, made of fine long grass, both tough and long.)</p>
        <p>Nhà rộng, đủ cho chục trứng, còn có chỗ tiếp khách. (House was spacious, enough for ten eggs, even had guest area.)</p>
        <p>Bói-Cá hỏi cách làm, Chim-Sâu vui vẻ hướng dẫn. (Kingfisher asked how to make it, Worm-Bird happily instructed.)</p>
        <p>Trước tiên, dẫn bay rũng cánh chọn được chục cọng. (First, lead flying with wings shaking to choose ten stalks.)</p>
        <p>Về lọc còn được hai ba. (Back home, filter down to two or three.)</p>
        <p>Rồi cắt, chuốt, đan sợi. (Then cut, sharpen, weave threads.)</p>
        <p>Chim-Sâu khéo léo, chân giữ sợi, mỏ luồn, chân kéo buộc, đều và nhanh. (Worm-Bird was skillful, feet holding thread, beak threading, feet pulling ties, even and fast.)</p>
        <p>Bói-Cá loay hoay cả giờ, không được sợi nào ra hồn... cứ làm đi, rồi hỏng lại. (Kingfisher fumbled for hours, couldn't make any proper thread... kept trying, then failing again.)</p>
        <p>Nản. (Discouraged.)</p>
        <p>Ngài buông. (He gave up.)</p>
        <p>Bóp đầu nghĩ cách nhàn hơn. (Squeezed his head thinking of an easier way.)</p>
        <p>Bói-Cá bay lòng vòng, chẳng mấy chốc soi được một tổ mối lớn. (Kingfisher flew around, soon spotted a large termite nest.)</p>
        <p>Bọn mối bỏ đi, để lại thành quách bề thế. (The termites had left, leaving a grand fortress.)</p>
        <p>Bên trong rộng, nhiều ngóc ngách. (Inside was spacious, many nooks and crannies.)</p>
        <p>Ngài chỉ dùng mỏ và chân gạt qua gạt lại, đập đập, đào đào chừng đôi giờ đã có cơ ngơi ra dáng đàng hoàng. (He just used beak and feet to sweep back and forth, tap tap, dig dig for a couple hours and had a proper looking home.)</p>
        <p>Lại có cả kho trữ thực phẩm. (Even had a food storage.)</p>
        <p>Ngài ưng ý lắm, chuyển vào dinh thự mới, mời bọn Sẻ, Sâu đến chơi. (He was very satisfied, moved into the new mansion, invited Sparrows and Worm-Bird to visit.)</p>
        <p>Khỏi phải nói, chúng nó lác mắt thán phục, hết lời ca ngợi. (Needless to say, they were dazzled with admiration, endless praise.)</p>
        <p>Từ hôm đó, cứ sáng sớm Bói-Cá lại ra cửa hát ông ông, tinh thần phấn khởi. (From that day, every early morning Kingfisher went to the door humming, spirits high.)</p>
        <p>Bặt đi mấy hôm không nghe tiếng hát, Sẻ và Sâu rủ nhau đến thăm. (After several days without hearing singing, Sparrow and Worm-Bird went together to visit.)</p>
        <p>Đánh tiếng mãi không thấy ai, chúng ra bờ ao tìm, kinh ngạc bắt gặp Bói-Cá tiều tụy, thâm quầng, chân tay run rẩy. (Calling for long without answer, they went to the pond shore to find, shocked to see Kingfisher haggard, dark circles, limbs trembling.)</p>
        <p>Bói-Cá kể như mếu: (Kingfisher told tearfully:)</p>
        <ul><li>Thấy dinh cơ tốt, rộng rãi, lũ chuột tự tiện đến ở. (- Seeing the good, spacious home, mice came to live uninvited.)</li></ul>
        <p>Đuổi cũng không đi. (Chasing didn't make them leave.)</p>
        <p>Bọn này đã hôi lại xấu nết. (These ones were smelly and had bad habits.)</p>
        <p>Cá dự trữ nó ăn bằng hết. (They ate all my stored fish.)</p>
        <p>Suốt đêm sục sạo, làm mình không dám ngủ, chỉ lo lên cơn đói nó lại xơi tái miệng đùi... (All night rustling, making me afraid to sleep, just worried when hungry they'd eat my thigh raw...)</p>
        <p>Hết chịu nổi, Bói-Cá tìm về tổ cũ thấy bọn cua cũng đã chiếm mất, lấp đất kín cửa hang, đành chịu cảnh màn trời chiếu đất mấy ngày nay... (Unable to bear it, Kingfisher returned to old nest but crabs had taken it, filled the cave entrance with dirt, had to endure open sky and ground these days...)</p>
    `

    "sidebarTitle": "06. LIÊN DOANH!",
    "mainTitle": "6. LIÊN DOANH! (PARTNERSHIP!)",
    "imageUrl": "partnership.jpg",
    "storyHtmlContent": `
        <p>Mùa xuân nay, không hiểu sao cá ít hẳn. (This spring, somehow fish were much fewer.)</p>
        <p>Bữa no bữa đói, khiến Bói-Cá ngẫm nghĩ. (Sometimes full sometimes hungry, making Kingfisher think.)</p>
        <p>Rồi kế nảy ra. (Then an idea came.)</p>
        <p>Ngài có uy, nên gọi Cò đến bảo: (He had authority, so called Stork and said:)</p>
        <ul><li>Đánh bắt khó khăn, để no, ta phải liên doanh nuôi cá. (- Catching is difficult, to be full, we must partner to raise fish.)</li></ul>
        <p>Nhưng Bói-Cá chịu trách nhiệm và hưởng chính cá rô. (But Kingfisher was responsible for and mainly got the perch.)</p>
        <p>Cò thì chuyên cá diếc. (Stork specialized in carp.)</p>
        <p>Ai chăm chính loại nào được hưởng 8 phần thu hoạch loại đó. (Whoever mainly cared for which type got 8 parts of that type's harvest.)</p>
        <p>Hết mùa tổng kết và chia nhau. (End of season they'd calculate and divide.)</p>
        <p>Trong lúc nuôi trồng, không được tư túi của liên doanh. (During raising, no one could take partnership property for themselves.)</p>
        <p>Quả nhiên, rô và diếc lớn nhanh. (Indeed, perch and carp grew fast.)</p>
        <p>Thức ăn thiếu thì bảo nhau đi kiếm thêm rau cỏ về. (When food was short, they told each other to find more grass.)</p>
        <p>Đôi lúc cũng bồi dưỡng bọn cá cả giun dế giàu đạm. (Sometimes they also fed the fish worms and crickets rich in protein.)</p>
        <p>Chả mấy chốc, đã thấy đàn cá đông đúc bội phần. (Soon, they saw the fish school was much more crowded.)</p>
        <p>Có bữa thèm lắm, Bói-Cá nhẩm tính, đông thế này bắt một con ăn cho sướng. (Some days very hungry, Kingfisher calculated, with so many, catch one to eat for pleasure.)</p>
        <p>Mà bắt diếc thì lợi vì nếu còn, cuối mùa thì 10 phần Cò hưởng 8. (But catching carp was beneficial because if left, end of season Stork would get 8 out of 10 parts.)</p>
        <p>Thói đời, ngon quen miệng, Bói-Cá ăn thường xuyên hơn. (As habit goes, tasty becomes addictive, Kingfisher ate more regularly.)</p>
        <p>Rồi ăn hàng ngày. (Then ate daily.)</p>
        <p>Mỗi lần ăn cũng tăng dần, từ một lên vài con diếc. (Each time eating also increased, from one to several carp.)</p>
        <p>Thấy diếc vơi đi nhiều, Cò sinh nghi, hỏi Bói-Cá: (Seeing carp decreasing a lot, Stork became suspicious, asked Kingfisher:)</p>
        <ul><li>Sao diếc bị mất đi đâu thế? (- Why are carp disappearing?)</li></ul>
        <ul><li>Vài hôm mà thấy vơi hẳn? (Just a few days and they're much less?)</li></ul>
        <p>Bói-Cá tảng lờ: (Kingfisher evaded:)</p>
        <ul><li>Còn mất là chuyện của ông Trời, sao ta biết. (- Appearing and disappearing is Heaven's business, how would I know.)</li></ul>
        <p>Dù không có bằng cớ là Bói-Cá ăn, nhưng vẫn nghi ngờ, lòng Cò buồn bực. (Though no evidence Kingfisher ate them, still suspicious, Stork felt upset.)</p>
        <p>Vài tuần sau, Bói-Cá bỗng thấy cá rô trong ao vơi đi. (A few weeks later, Kingfisher suddenly saw perch in the pond decreasing.)</p>
        <p>Xưa nay, cá rô cũng là món khoái khẩu của Cò, nghĩ vậy Bói-Cá nghi cho Cò. (All along, perch was also Stork's favorite dish, thinking so Kingfisher suspected Stork.)</p>
        <p>Gặng hỏi vài lần, Cò chỉ nói: (Pressing several times, Stork only said:)</p>
        <ul><li>Rô cũng như diếc, chắc là cũng chuyện của ông Trời. (- Perch like carp, must also be Heaven's business.)</li></ul>
        <p>Bói-Cá lại càng nghi, liền nghĩ ra kế. (Kingfisher suspected even more, immediately thought of a plan.)</p>
        <p>Hôm tới hội xóm, nhân lúc Cò dự hội, sẽ lẻn về sớm, tạt qua nhà, điều tra đột xuất hiện trường xem có dấu vết của đám rô mất tích không. (On village meeting day, while Stork attended, he'd sneak back early, stop by the house, investigate the scene for traces of missing perch.)</p>
        <p>Ngày hội đến, giữa lúc tất cả say sưa hát hò, Bói-Cá ba chân bốn cẳng chạy về nhà Cò. (Meeting day came, while everyone was singing merrily, Kingfisher rushed to Stork's house.)</p>
        <p>Chẳng khó khăn gì, đi vào phía sau, Bói-Cá sửng sốt lẩm bẩm: (No difficulty, entering from behind, Kingfisher was shocked muttering:)</p>
        <ul><li>Chết thật, nguyên đống xương to. (- Oh no, a whole pile of big bones.)</li></ul>
        <p>Toàn xương cá rô! (All perch bones!)</p>
        <p>Chưa dứt lời, Bói-Cá nghe phía bên tổ mình giọng Cò la toáng: (Before finishing, Kingfisher heard from his nest Stork shouting:)</p>
        <ul><li>Chết thật, nguyên đống xương to. (- Oh no, a whole pile of big bones.)</li></ul>
        <p>Toàn xương cá diếc! (All carp bones!)</p>
        <p>Cò gật gù, nói thêm: (Stork nodded, adding:)</p>

        <p>Bọn này sống dai, đẻ nhiều. (These live long, breed a lot.)</p>
        <p>Thống nhất phân công, cả hai chăm sóc chung, không phân biệt. (They agreed on division of work, both care together, no discrimination.)</p>

    "sidebarTitle": "07. CHIM KHÔI",
    "mainTitle": "7. CHIM KHÔI (BIRD BEAUTY)",
    "imageUrl": "bird-beauty.jpg",
    "storyHtmlContent": `
        <p>Bói-Cá vốn tính điệu. (Kingfisher was naturally fancy.)</p>
        <p>Bộ áo cánh cầu kỳ, lúc nào cũng như đi hội. (Elaborate feather coat, always like going to a festival.)</p>
        <p>Quanh năm đánh bắt ở ao, việc soi gương, ngắm vuốt cũng thành thú vui. (Year-round catching at the pond, looking in mirror, admiring and preening became a hobby.)</p>
        <p>Càng ngắm, ngài càng thấy mình đẹp, chẳng có chỗ nào để chê. (The more he looked, the more beautiful he found himself, nothing to criticize.)</p>
        <p>Ngày nọ, hội đồng xóm chim quyết định tìm biểu tượng đẹp nhất, trao danh hiệu "chim khôi". (One day, the bird village council decided to find the most beautiful symbol, awarding the title "bird beauty".)</p>
        <p>Có vài tiêu chuẩn. (There were several criteria.)</p>
        <p>Tài kiếm sống là một. (Living skills was one.)</p>
        <p>Tinh thần dũng mãnh, bay nhanh, mỏ cứng, vuốt sắc là hai. (Brave spirit, fast flying, hard beak, sharp claws was two.)</p>
        <p>Bộ cánh đẹp, hình hài cân đối và khuôn mặt thanh tú là ba. (Beautiful wings, balanced body and elegant face was three.)</p>
        <p>Bói-Cá tự kiểm rồi kết luận: (Kingfisher self-checked and concluded:)</p>
        <ul><li>Dứt khoát "chim khôi" là Bói-Cá ta chứ chẳng thể khác được. (- Definitely "bird beauty" is me Kingfisher, can't be anyone else.)</li></ul>
        <p>Theo lệ, sau khi hội đồng nhất trí, sẽ giao cho Cú - họa sỹ tài năng có trí óc tinh khôn - vẽ bức tranh chân dung. (By rule, after council agreed, they'd ask Owl - talented artist with sharp mind - to paint a portrait.)</p>
        <p>Ngày vinh danh sẽ treo tranh lên. (On honor day they'd hang the painting.)</p>
        <p>Toàn thể các hộ chim trong xóm sẽ đồng thanh xướng tên. (All bird households in the village would chant the name together.)</p>
        <p>Bói-Cá mơ ngày ấy. (Kingfisher dreamed of that day.)</p>
        <p>Ngài đi vận động các bô lão hội đồng. (He went lobbying the council elders.)</p>
        <p>Vừa quà cáp, vừa ăn nói khéo léo, lại kể lể chỗ thân quen... (Both giving gifts and speaking cleverly, also mentioning connections...)</p>
        <p>Ngài lại hứa tài trợ cuộc thi bằng số cá tích trữ nhờ đánh bắt cả tháng, ăn uống kham khổ. (He also promised to sponsor the contest with fish saved from a month of catching, eating frugally.)</p>
        <p>Rốt cục ngài cũng thuyết phục được hội đồng trao danh hiệu "chim khôi" cho mình. (Finally he convinced the council to award him the "bird beauty" title.)</p>
        <p>Vốn yêu cái đẹp, lại cũng để đảm bảo hình ảnh truyền thông, Bói-Cá quyết định hợp tác sâu sắc với Cú. (Loving beauty, also to ensure media image, Kingfisher decided to cooperate deeply with Owl.)</p>
        <p>Bức họa phải hoàn hảo mới được. (The painting must be perfect.)</p>
        <p>Ngài mang đồ ăn, quà cáp đến, kè kè ở tổ Cú. (He brought food and gifts, staying close at Owl's nest.)</p>
        <p>Bói-Cá cũng chẳng đòi hỏi gì nhiều nhặn, chủ yếu nhờ vả nét vẽ của Cú giúp cải thiện thẩm mỹ. (Kingfisher didn't demand much, mainly asked Owl's strokes to help improve aesthetics.)</p>
        <p>Cốt sao có hình ảnh mạnh, can đảm và hoạt bát hơn. (Main thing was to have a stronger, braver and more lively image.)</p>
        <p>Thể hình tráng kiện hơn. (More robust physique.)</p>
        <p>Đôi mắt tinh nhanh hơn. (Sharper, quicker eyes.)</p>
        <p>Riêng mỏ cho bé lại chút, nhưng vẫn sắc bén, là ổn. (Just make the beak a bit smaller, but still sharp, that's fine.)</p>
        <p>Nói chung xứng đáng chim khôi. (In general, worthy of bird beauty.)</p>
        <p>Cú nể nang và cũng nhân dịp này trả ơn Bói-Cá giúp đỡ hồi thiếu đói, nên hợp tác nhiệt tình. (Owl was respectful and also took this chance to repay Kingfisher's help during hungry times, so cooperated enthusiastically.)</p>
        <p>Bói-Cá đẹp lòng. (Kingfisher was pleased.)</p>
        <p>Ngài ăn no, ngủ kỹ, ngóng phút đăng quang. (He ate well, slept soundly, waiting for the crowning moment.)</p>
        <p>Ngày hội, chim nô nức kéo về. (Festival day, birds excitedly gathered.)</p>
        <p>Cỗ bàn bày ra. (Tables were set.)</p>
        <p>Thông báo thể lệ. (Rules announced.)</p>
        <p>Giới thiệu hội đồng... (Council introduced...)</p>
        <p>Sau đủ nghi thức, tới tiết mục chính: xướng danh "chim khôi". (After all ceremonies, came the main event: announcing "bird beauty".)</p>
        <p>Bói-Cá vờ khiêm tốn, nằm trong lùm cây, chổng mông về phía tranh. (Kingfisher pretended modesty, hiding in bushes, rear facing the painting.)</p>
        <p>Đợi đám đông xướng tên. (Waiting for the crowd to chant his name.)</p>
        <p>Tranh được đưa đến. (The painting was brought.)</p>
        <p>Mảnh khăn che gỡ ra. (The covering cloth removed.)</p>
        <p>Đám chim dự khán ồ lên, đồng thanh hô: (The bird audience gasped, chanting together:)</p>
        <ul><li>Diều hâu! (- Hawk!)</li></ul>
    `

  "imageUrl": "sparrow-food-trap.jpg",
  "storyHtmlContent": "<p>Dạo gần đây, họ nhà Sẻ đông lên, cái ăn lại khó kiếm hơn trước. (Recently, the Sparrow family grew larger, food became harder to find.)</p><p>Qua mùa gặt, nhà Sẻ bị đói ăn. (After harvest season, Sparrow family was hungry.)</p><p>Sẻ lớn nom hốc hác. (Big Sparrows looked gaunt.)</p><p>Sẻ non xơ xác, suy dinh dưỡng. (Young Sparrows were ragged, malnourished.)</p><p>Nhìn Sẻ chỉ thấy đầu với mỏ. (Looking at Sparrows, you only saw heads and beaks.)</p><p>Sẻ bàn nhau đi học trí khôn của Bói-Cá và Chim-Lợn, tìm kế cứu sống nhà Sẻ. (Sparrows discussed learning wisdom from Kingfisher and Pig-Bird, finding ways to save the Sparrow family.)</p><p>Bói-Cá và Chim-Lợn thương lắm, đồng ý dạy cho trí khôn. (Kingfisher and Pig-Bird felt sorry, agreed to teach wisdom.)</p><p>Bói-Cá chân phương: (Kingfisher was straightforward:)</p><ul><li>Thuận lẽ tự nhiên. (- Follow nature's way.)</li><li>Sinh nở đúng lúc, vừa phải thôi. (Have babies at right time, moderate amount.)</li><li>Dạy bọn trẻ học bay nhảy. (Teach young ones to fly and hop.)</li><li>Rèn tinh mắt, sắc mỏ. (Train sharp eyes, sharp beaks.)</li><li>Luyện khỏe cánh, chắc cơ. (Exercise strong wings, firm muscles.)</li><li>Chịu khó kiếm ăn ở đồng và vườn xa hơn. (Work hard to find food in farther fields and gardens.)</li><li>Tập ăn các loại hạt và sâu cho quen. (Practice eating various seeds and worms to get used to them.)</li><li>Nhất định sẽ sung túc. (Definitely will be prosperous.)</li></ul><p>Sẻ vẫn băn khoăn. (Sparrows still worried.)</p><p>Lâu nay cố chịu vất vả mà nghe ngày no ấm còn xa xôi quá. (Long time trying hard but hearing prosperous days still too far away.)</p><p>Sẻ chờ kế Chim-Lợn. (Sparrows waited for Pig-Bird's plan.)</p><p>Chim-Lợn nghĩ khác: (Pig-Bird thought differently:)</p><ul><li>Kế Bói-Cá chưa khôn. (- Kingfisher's plan not smart.)</li><li>Kiếm ăn thì phải tới chỗ nhiều cái ăn. (Finding food must go where lots of food.)</li><li>Bay xa rạc cánh, mà đâu chắc đủ ăn. (Flying far wearing out wings, not sure enough food.)</li><li>Nhìn bọn chim Sâu xem, nhảy cả ngày vẫn đói, có lớn được đâu!? (Look at Worm-Birds, hopping all day still hungry, how can they grow!?)</li></ul><p>Sẻ chột dạ: (Sparrows were startled:)</p><ul><li>Vậy phải làm sao? (- So what to do?)</li></ul><p>Chim-Lợn thong thả: (Pig-Bird leisurely:)</p><ul><li>Từ đây vào xóm làng người ở gần hơn. (- From here go to human village, it's closer.)</li><li>Ở đó, thóc lúa chật kho. (There, rice fills warehouses.)</li><li>Ăn không hết lại phơi cơm nguội. (Can't finish eating, they dry leftover rice.)</li><li>Trẻ con biếng ăn, thức ăn văng vãi quanh nhà. (Children lazy eating, food scattered around houses.)</li><li>Ấy là chưa kể hàng tuần họ mua đồ mới; thức ăn cũ bỏ đi. (Not to mention weekly they buy new things; old food thrown away.)</li><li>Thế thì còn lo gì cái ăn cho nhà Sẻ!? (So why worry about food for Sparrow family!?)</li></ul><p>Sẻ nghe xong, mắt sáng lên. (Sparrows heard, eyes brightened.)</p><p>Trông dáng vẻ Chim-Lợn to béo, sung túc, thấy lời nói càng đáng tin. (Looking at Pig-Bird's fat, prosperous appearance, the words seemed more believable.)</p><p>Từ đó, sớm sớm, rợp trời Sẻ bay vào làng. (From then, early morning, sky full of Sparrows flying to village.)</p><p>Hè nhà, bếp ăn, sân vườn... đều sẵn cái ăn. (House yards, kitchens, gardens... all had ready food.)</p><p>Lại phát hiện cả những đống rác to đầy đồ ăn. (Also discovered big garbage piles full of food.)</p><p>Sẻ bảo nhau: (Sparrows told each other:)</p><ul><li>Ông Chim-Lợn quả là mưu trí. (- Mr. Pig-Bird truly is clever.)</li><li>Từ khi vào xóm kiếm ăn đến giờ, chưa sai lời nào. (Since coming to village for food, not one word wrong.)</li></ul><p>No ấm, đàn Sẻ lớn khỏe, lông cánh mịn màng. (Full and warm, Sparrow flock grew healthy, feathers smooth.)</p><p>Sẻ già nghĩ xa: (Old Sparrows thought ahead:)</p><ul><li>No rồi, phải dự trữ lâu dài. (- Full now, must store long-term.)</li></ul><p>Nay chuyển hẳn vào xóm, ở các ống nứa, hốc mái, khe tường... để vận chuyển về kho nhanh, bớt công xây cất. (Now move entirely to village, live in bamboo pipes, roof holes, wall cracks... to transport to storage faster, less building work.)</p><p>Đàn Sẻ rời xóm chim, định cư làng người. (Sparrow flock left bird village, settled in human village.)</p><p>Có của ăn - của để, về thăm xóm chim thưa dần. (Having food - having savings, visits back to bird village became rare.)</p><p>Một lần gặp Sẻ choai, Bói-Cá hỏi thăm, Sẻ bảo: (Once meeting a stray Sparrow, Kingfisher asked, Sparrow said:)</p><ul><li>Lo tích cốc phòng cơ, bận lắm nên ít về thăm. (- Busy storing grain for hard times, so rarely visit.)</li></ul><p>Xong lại bay đi vội vã, ra dáng kẻ bận bịu. (Then flew away hurriedly, looking like a busy person.)</p><p>Bẵng đi, chả còn thấy bọn Sẻ về nữa. (Time passed, no more Sparrows came back.)</p><p>Nhớ lũ Sẻ con, Bói-Cá nhờ Cò nhanh nhẹn đi thăm hỏi. (Missing young Sparrows, Kingfisher asked quick Stork to go visit.)</p><p>Cò sốt sắng nhận lời, chiều về mệt lử nói: (Stork eagerly agreed, evening returned exhausted saying:)</p><ul><li>Vào tít trong làng, tìm mãi không gặp nhà Sẻ nữa. (- Deep in village, searched long couldn't find Sparrow family anymore.)</li><li>Hình như là chúng chuyển làng nào giàu hơn rồi! (Seems like they moved to some richer village!)</li></ul><p>Bói-Cá lẩm bẩm: (Kingfisher muttered:)</p><ul><li>Lạ nhỉ, sao mà khuân đống dự trữ được. (- Strange, how could they move their storage pile.)</li><li>Thế xóm làng thay đổi gì không? (Did the human village change anything?)</li></ul><p>Cò trả lời: (Stork answered:)</p><ul><li>Đông vui lắm. (- Very crowded and fun.)</li><li>Còn có quán mới, đề biển \"Chim Sẻ đủ món!\"... (Even has new restaurant, sign says \"Sparrow - All Dishes!\"...)</li></ul>"

  "imageUrl": "hawk-negotiation-trap.jpg",
  "storyHtmlContent": "<p>Diều-Hâu là tay săn mồi ác chiến, chắc chỉ chịu thua Ưng hay Đại Bàng. (Hawk was a fierce hunter, probably only losing to Eagle or Great Eagle.)</p><p>Gã không hòa đồng, mà sống tách biệt. (He wasn't sociable, lived separately.)</p><p>Dạo gần đây, do hay kiếm ăn trong làng, đôi lúc mới qua lại xóm chim, thoắt đến thoắt đi. (Recently, often hunting in village, sometimes visited bird village, coming and going quickly.)</p><p>Sự xuất hiện của gã rất phiền toái vì gã chuyên bắt gà, vịt của làng người. (His appearance was very troublesome because he specialized in catching village chickens and ducks.)</p><p>Gã lại rất háu ăn, ngày nào không bổ xuống đàn gà ba, bốn bận, ngày đó chưa xong. (He was also very greedy, any day not swooping on chickens three, four times, that day not finished.)</p><p>Bói-Cá lo lắng: (Kingfisher worried:)</p><ul><li>Cứ đà này, rồi người ta sẽ lại săn chim, bù vào số gà bị mất. (- At this rate, people will hunt birds again, to make up for lost chickens.)</li></ul><p>Tai họa thật khó lường. (Disaster truly unpredictable.)</p><p>Nghĩ đi nghĩ lại, chỉ còn cách cả xóm chim họp lại, gây sức ép với gã. (Thinking back and forth, only way was whole bird village meeting, putting pressure on him.)</p><p>Thế rồi, xóm yêu cầu Diều-Hâu tới buổi họp do Bói-Cá chủ trì, đủ loài lớn bé tới dự. (So, village requested Hawk to come to meeting led by Kingfisher, all species big and small attended.)</p><p>Chúng loài góp ý nhao nhao. (All species contributed opinions noisily.)</p><ul><li>Nào là, Diều-Hâu bắt mồi phải có phép tắc. (Like, Hawk catching prey must have rules.)</li><li>Bắt gà cũng tùy nơi tùy lúc, không gây oán thù chất ngất. (Catching chickens depends on place and time, don't cause piling resentment.)</li><li>Nào là, săn bắt vừa đủ thôi, phải báo cáo xóm về số lượng. (Like, hunt just enough, must report to village about quantity.)</li><li>Một số còn động viên gã tập chén sâu bọ, thậm chí ăn chay... (Some even encouraged him to try eating insects, even vegetarian...)</li></ul><p>Nghe xóm kêu gào, gã không nói gì, chỉ gườm gườm. (Hearing village complaints, he said nothing, just glared.)</p><p>Bói-Cá hỏi Cò: (Kingfisher asked Stork:)</p><ul><li>Gã nghe có hiểu không nhỉ? (- Does he understand?)</li></ul><p>Cò đáp: (Stork answered:)</p><ul><li>Hiểu chứ, nhưng chưa biết ý ra sao. (- Understands, but don't know his intention.)</li></ul><p>Vậy, từng phần một, bắt gã phải thống nhất với đại diện xóm, rồi mới họp tiếp. (So, part by part, make him agree with village representative, then continue meeting.)</p><p>Bói-Cá nghe lọt tai, liền đưa ra phiên tổng hợp ý kiến, có bốn phần phép tắc. (Kingfisher heard clearly, immediately summarized opinions, with four parts of rules.)</p><p>Kết thúc mỗi phần, cắt cử một phiên dịch thống nhất lại, ghi biên bản với gã ở sau phòng họp. (Ending each part, assigned one translator to agree again, record minutes with him behind meeting room.)</p><p>Điểm chỉ vào biên bản xong, mới bàn tiếp phần sau. (Only after signing minutes, discuss next part.)</p><p>Bốn đại diện là Sẻ, Gáy, Sáo và Khướu. (Four representatives were Sparrow, Jay, Magpie and Shrike.)</p><p>Từng phần một, dù phải thảo luận với đại diện hơi lâu, nhưng Diều-Hâu đều nộp lại biên bản đã nhất trí và điểm chỉ. (Part by part, though discussing with representatives took time, Hawk submitted agreed and signed minutes.)</p><p>Xong việc, Diều-Hâu về. (Work done, Hawk left.)</p><p>Xóm tổng kết nốt rồi nghỉ, cảm thấy nhẹ nhõm. (Village concluded and rested, feeling relieved.)</p><p>Riêng Bói-Cá chưa yên tâm hoàn toàn: (Only Kingfisher not completely at ease:)</p><ul><li>Xong biên bản, nhưng cần nghe ý kiến bốn đại diện! (- Minutes done, but need to hear four representatives' opinions!)</li></ul><p>Tìm mãi chẳng thấy bốn vị đại diện. (Searched long couldn't find four representatives.)</p><p>Chỉ còn lại bãi lông cánh, lông cổ, vương vãi khắp gốc cây. (Only left were piles of wing feathers, neck feathers, scattered all over tree roots.)</p>"
},

  "id": "story10",
  "sidebarTitle": "10. VẬN MAY",
  "mainTitle": "10. LUCKY CHARM",
  "imageUrl": "kingfisher-lucky-gem.jpg",
  "storyHtmlContent": "<p>Vận may đến vào một ngày đẹp trời. (Luck came on a beautiful day.)</p><p>Mới sáng sớm, Bói-Cá đậu trên cành còn chưa hết ngái ngủ, thì một con Diếc lờ đờ bơi đến... (Early morning, Kingfisher perched on branch still sleepy, when a sluggish Carp swam by...)</p><p>Không biết Diếc béo hay bụng đói mà bữa nay ngon miệng thế! (Don't know if Carp was fat or he was hungry but today tasted so good!)</p><p>Đang ăn, thấy mắc trong cổ vật gì. (While eating, felt something stuck in throat.)</p><p>Lôi ra, Ngài phát hiện một viên ngọc xanh, ánh hồng tuyệt mỹ, dường như trong bụng cá đã lâu. (Pulled out, he discovered a green gem, beautiful pink shine, seemed to be in fish's stomach long time.)</p><p>Bói-Cá nghĩ: Báu vật may mắn. (Kingfisher thought: Lucky treasure.)</p><ul><li>Cất thật kỹ! (Hide it carefully!)</li></ul><p>Rồi lập tức mang về giấu kín trong hang sâu. (Then immediately brought home to hide deep in cave.)</p><p>Lạ thay, vài ngày sau, Bói-Cá đã nghe chúng chim xì xào rằng Ngài trộm trứng nhà nào về cất trong hang. (Strangely, few days later, Kingfisher heard birds whispering he stole someone's eggs to hide in cave.)</p><p>Kẻ độc mồm còn bảo, Ngài ăn phải cá biến đổi giới tính, nay bỗng đẻ trứng... (Mean ones even said he ate gender-changing fish, now suddenly laying eggs...)</p><p>Phải gan lắm, Ngài mới không phát điên. (Had to be brave not to go crazy.)</p><p>Rồi bọn chim cũng quên. (Then birds also forgot.)</p><p>Chim quên, thì rắn nhớ. (Birds forgot, but snakes remembered.)</p><p>Nghĩ là trứng, bọn rắn nô nức mò vào hang. (Thinking it was egg, snakes eagerly crawled into cave.)</p><p>Dĩ nhiên là cắn rồi, gẫy răng mới biết nhầm. (Of course after biting, broke teeth then knew mistake.)</p><p>Chỉ khổ Bói-Cá mấy phen suýt bị bọn cạp nong mổ trúng. (Only poor Kingfisher several times almost got bitten by vipers.)</p><p>Chán thì chúng cũng bỏ đi. (When bored they also left.)</p><p>Còn Ngài rã rời sau nhiều đêm thức trắng. (But he was exhausted after many sleepless nights.)</p><p>Nhưng giữ cả ngọc quý lẫn bình yên sao mà khó thế... (But keeping both precious gem and peace how difficult...)</p><p>Có người trong xóm lúc tối qua bờ đê đầm nước, thấy ánh sáng hồng xanh phát ra từ hang. (Someone in village at night passing pond dike, saw pink-green light from cave.)</p><p>Đoán chừng chỗ ấy có ngọc quý, hôm sau, hắn rủ nhiều người đi săn lùng. (Guessing that place had precious gem, next day, he gathered many people to hunt.)</p><p>Cảnh giác, Ngài đã đào nhiều chỗ giấu. (Alert, he had dug many hiding places.)</p><p>Họ đục, thì Ngài chuyển. (They dug, he moved.)</p><p>Chiến sự ác liệt, chỉ vài hôm mà xới tan bờ đê. (Fierce battle, just few days dug up the whole dike.)</p><p>Điệp khúc đào-dịch-đào-dịch... cứ thế vây hãm. (Repeated dig-move-dig-move... kept surrounding.)</p><p>Mỗi lúc, viên ngọc như một nặng thêm. (Each moment, the gem seemed heavier.)</p><p>Ngài lom khom mãi, đến sụn lưng, què cẳng. (He hunched so much, until back collapsed, legs lame.)</p><p>Lại còn nhịn đói mấy ngày. (Also starved for several days.)</p><ul><li>Phải liều thoát! (Must risk escape!)</li></ul><p>Nhân lúc đám người đang ham đào xới, Ngài dùng mỏ cắp ngọc báu lao qua cửa chính. (While people were busy digging, he used beak to carry precious gem rushing through main entrance.)</p><p>Liều hóa may: cửa hang bỏ ngỏ. (Luck from risk: cave door left open.)</p><p>Dù đói mờ mắt, Ngài hết sức bình sinh tăng tốc thoát ra. (Though hungry and dizzy, he used all life's strength to speed out.)</p><p>Đang mừng vì sắp qua cơn nguy, bỗng đâu có thằng bé tinh mắt nhìn thấy, nhanh tay phi cành cây gộc thẳng vào Bói-Cá. (Happy about escaping danger, suddenly a sharp-eyed boy saw, quickly threw a stick straight at Kingfisher.)</p><p>Viên ngọc thì nặng, sức đã tàn, cú ném lại đầy uy lực... trước mắt Ngài như đã thấy Diêm Vương vẫy tay. (The gem was heavy, strength exhausted, the throw was powerful... before his eyes he seemed to see Death waving.)</p><p>Hoảng loạn, kinh hãi, Ngài lập cập hoác cái mỏ ra. (Panicked, terrified, he hastily opened his beak.)</p><p>Thế là, viên ngọc rơi tõm xuống đầm nước. (So, the gem fell splash into the pond.)</p><p>Rớt mất viên ngọc, thân ngài lại nhẹ tênh. (Lost the gem, his body became light again.)</p><p>Ngài vọt lên, né cú va thần sầu. (He shot up, dodging the magical hit.)</p><p>Gậy chỉ sượt qua, cũng dứt tung cả mảng lông Bói-Cá. (Stick just grazed by, but tore off a patch of Kingfisher's feathers.)</p><ul><li>Tý chết! (Almost died!)</li></ul><p>Đám người liền bỏ Bói-Cá, lao vào đầm lùng sục viên ngọc. (The people immediately left Kingfisher, rushed into pond searching for gem.)</p><p>Cả tháng sau vẫn còn đánh cãi nhau ầm ĩ. (Even a month later still fighting noisily.)</p><p><i>*Hậu chuyện:*</i> (*Epilogue:*)</p><p>Mỗi khi nghĩ đến trận truy sát gớm ghiếc, đôi chân Ngài bất tuân ý chí, cứ run bần bật. (Every time thinking of that horrible chase, his legs disobeyed his will, kept shaking.)</p><p>Tháng ngày qua đi, hôm nay, hiên ngang giữa xóm, Bói-Cá giảng bài: (Months passed, today, standing proud in village, Kingfisher lectured:)</p><ul><li>Sống ở đời, khi vào sinh ra tử, muốn còn toàn thây phải có trí khôn. (- Living in life, when facing life and death, to keep whole body must have wisdom.)</li></ul><p>Đám chim học trò hỏi: (Student birds asked:)</p><ul><li>Triết lý Ngài tâm đắc là gì? (- What philosophy do you cherish?)</li></ul><p>Bói-Cá ưỡn ngược: (Kingfisher puffed up:)</p><ul><li>Không tham của nả. (- Don't be greedy for treasures.)</li><li>Quăng báu vật cho lũ tham lam tranh cướp! (Throw treasures to greedy ones to fight over!)</li></ul><p>Hầu hết bọn chim non gật gù thán phục. (Most young birds nodded admiringly.)</p><p>Có vài đứa bụm miệng cười. (Some covered mouths laughing.)</p><p>Còn Ngài len lén nhìn chỗ bụng, nơi vận may ra đi và đám lông không bao giờ mọc lại. (While he secretly looked at his belly, where luck left and feathers never grew back.)</p>"
},








            ];

            const storyListElement = document.getElementById('story-list');
            const storyImageElement = document.getElementById('story-image');
            const storyMainTitleElement = document.getElementById('story-main-title');
            const storyBodyContentElement = document.getElementById('story-body-content');
            
            const toggleVisualBtn = document.getElementById('toggle-visual-btn');
            const mainContentElement = document.getElementById('main-content');


            function renderSidebar() {
                storyListElement.innerHTML = ''; // Clear existing items
                storyListData.forEach(story => {
                    const listItem = document.createElement('li');
                    listItem.textContent = story.sidebarTitle;
                    listItem.dataset.storyId = story.id;
                    listItem.addEventListener('click', () => {
                        renderStory(story.id);
                    });
                    storyListElement.appendChild(listItem);
                });
            }

            function renderStory(storyId) {
                const story = storyListData.find(s => s.id === storyId);
                if (!story) {
                    console.error("Story not found:", storyId);
                    if (storyListData.length > 0) {
                        renderStory(storyListData[0].id);
                    }
                    return;
                }

                storyImageElement.src = story.imageUrl;
                storyImageElement.alt = story.mainTitle + " illustration";
                storyMainTitleElement.textContent = story.mainTitle;
                storyBodyContentElement.innerHTML = story.storyHtmlContent;
                
                storyBodyContentElement.scrollTop = 0;
                document.getElementById('text-pane').scrollTop = 0;

                const sidebarItems = storyListElement.querySelectorAll('li');
                sidebarItems.forEach(item => {
                    item.classList.toggle('active', item.dataset.storyId === storyId);
                });
            }

            // Toggle visual pane functionality
            if (toggleVisualBtn && mainContentElement) {
                toggleVisualBtn.addEventListener('click', () => {
                    mainContentElement.classList.toggle('visual-hidden');
                    if (mainContentElement.classList.contains('visual-hidden')) {
                        toggleVisualBtn.textContent = "Show Image";
                    } else {
                        toggleVisualBtn.textContent = "Hide Image";
                    }
                });
            }

            // Initial setup
            if (storyListData.length > 0) {
                renderSidebar();
                renderStory(storyListData[0].id); 
            } else {
                storyMainTitleElement.textContent = "No stories available.";
                storyBodyContentElement.innerHTML = "<p>Please add stories to the application.</p>";
                 if(toggleVisualBtn) toggleVisualBtn.style.display = 'none'; // Hide button if no stories
            }
        });
    </script>
</body>
</html>
