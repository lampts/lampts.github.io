<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jina Reader</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.2/marked.min.js"></script>
    <style>
        body {
            font-family: Helvetica, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        .form-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            align-items: stretch;
        }
        
        #url-input {
            flex: 1;
            font-size: 16px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        #format-select, button {
            font-size: 16px;
            padding: 10px;
            border: 1px solid #4CAF50;
            border-radius: 4px;
        }
        
        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            border: none;
        }
        
        button:hover:not(:disabled) {
            background-color: #45a049;
        }
        
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        
        .loading {
            display: none;
            margin: 16px 0;
            font-style: italic;
            color: #666;
        }
        
        .output-section {
            display: none;
            margin-top: 20px;
        }
        
        textarea {
            width: 100%;
            height: 200px;
            font-size: 16px;
            padding: 10px;
            margin: 16px 0 8px 0;
            resize: vertical;
            box-sizing: border-box;
            font-family: Monaco, monospace;
        }
        
        iframe {
            width: 100%;
            height: 400px;
            border: 1px solid #ccc;
            margin-top: 16px;
            box-sizing: border-box;
        }
        
        .prompt-section {
            display: none;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #eee;
        }
        
        .prompt-section h2 {
            font-size: 20px;
            margin-bottom: 12px;
        }
        
        .prompt-textarea {
            height: 120px;
            font-family: Helvetica, sans-serif;
        }
        
        .prompt-output {
            display: none;
            margin-top: 16px;
            padding: 16px;
            border: 1px solid #eee;
            border-radius: 4px;
            background: #fafafa;
        }
        
        .error {
            color: #d32f2f;
            background: #ffebee;
            padding: 12px;
            border-radius: 4px;
            margin: 16px 0;
        }
        
        @media (max-width: 640px) {
            .form-row {
                flex-direction: column;
            }
            
            body {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <h1>Jina Reader</h1>
    <p>An interface for the <a href="https://jina.ai/reader/">Jina Reader API</a>.</p>
    
    <form id="url-form">
        <div class="form-row">
            <input type="url" id="url-input" placeholder="Enter URL" required>
            <select id="format-select">
                <option value="markdown">Markdown</option>
                <option value="html">HTML</option>
                <option value="text">Text</option>
            </select>
            <button type="submit" id="submit-btn">Submit</button>
        </div>
    </form>
    
    <div id="loading" class="loading">Loading...</div>
    <div id="error-msg" class="error" style="display: none;"></div>
    
    <div id="output-section" class="output-section">
        <textarea id="content-raw" readonly></textarea>
        <button type="button" id="copy-btn">Copy to clipboard</button>
        <iframe id="content-rendered" sandbox=""></iframe>
    </div>

    <div id="prompt-section" class="prompt-section">
        <h2>Analyze with Claude</h2>
        <textarea id="prompt-textarea" class="prompt-textarea" placeholder="Enter your analysis prompt here...">Summarize this content in markdown format. Include:
1. A brief overview paragraph
2. Key points as bullet list
3. Notable quotes or insights
4. Main takeaways</textarea>
        <button type="button" id="run-prompt-btn">Analyze Content</button>
        
        <div id="prompt-loading" class="loading">Analyzing content...</div>
        <div id="prompt-output" class="prompt-output">
            <div id="prompt-result"></div>
            <button type="button" id="prompt-copy-btn">Copy Analysis</button>
        </div>
    </div>

    <script>
        // State management
        let currentContent = '';
        let currentAnalysis = '';

        // DOM elements
        const elements = {
            form: document.getElementById('url-form'),
            urlInput: document.getElementById('url-input'),
            formatSelect: document.getElementById('format-select'),
            submitBtn: document.getElementById('submit-btn'),
            loading: document.getElementById('loading'),
            errorMsg: document.getElementById('error-msg'),
            outputSection: document.getElementById('output-section'),
            contentRaw: document.getElementById('content-raw'),
            copyBtn: document.getElementById('copy-btn'),
            contentRendered: document.getElementById('content-rendered'),
            promptSection: document.getElementById('prompt-section'),
            promptTextarea: document.getElementById('prompt-textarea'),
            runPromptBtn: document.getElementById('run-prompt-btn'),
            promptLoading: document.getElementById('prompt-loading'),
            promptOutput: document.getElementById('prompt-output'),
            promptResult: document.getElementById('prompt-result'),
            promptCopyBtn: document.getElementById('prompt-copy-btn')
        };

        // Utility functions
        function showError(message) {
            elements.errorMsg.textContent = message;
            elements.errorMsg.style.display = 'block';
        }

        function hideError() {
            elements.errorMsg.style.display = 'none';
        }

        function setLoadingState(isLoading, button, originalText = 'Submit') {
            if (isLoading) {
                button.disabled = true;
                button.textContent = 'Loading...';
            } else {
                button.disabled = false;
                button.textContent = originalText;
            }
        }

        function createIframeContent(content, format) {
            const baseStyles = `
                body {
                    font-family: Helvetica, sans-serif;
                    line-height: 1.6;
                    max-width: 100%;
                    margin: 0;
                    padding: 16px;
                    box-sizing: border-box;
                }
                img {
                    max-width: 100% !important;
                    height: auto !important;
                }
                pre {
                    overflow-x: auto;
                    background: #f6f8fa;
                    padding: 12px;
                    border-radius: 4px;
                }
                code {
                    background: #f6f8fa;
                    padding: 2px 4px;
                    border-radius: 3px;
                }
                pre code {
                    background: none;
                    padding: 0;
                }
            `;

            let bodyContent;
            switch (format) {
                case 'html':
                    bodyContent = content;
                    break;
                case 'text':
                    bodyContent = `<pre>${content}</pre>`;
                    break;
                case 'markdown':
                default:
                    bodyContent = marked.parse(content);
                    break;
            }

            return `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <style>${baseStyles}</style>
                </head>
                <body>${bodyContent}</body>
                </html>
            `;
        }

        async function copyToClipboard(text, button) {
            try {
                await navigator.clipboard.writeText(text);
                const originalText = button.textContent;
                button.textContent = 'Copied';
                setTimeout(() => {
                    button.textContent = originalText;
                }, 1500);
            } catch (error) {
                console.error('Copy failed:', error);
            }
        }

        // Main fetch handler
        elements.form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const url = elements.urlInput.value.trim();
            const format = elements.formatSelect.value;
            
            if (!url) return;

            hideError();
            elements.loading.style.display = 'block';
            elements.outputSection.style.display = 'none';
            elements.promptSection.style.display = 'none';
            setLoadingState(true, elements.submitBtn);

            try {
                const fetchOptions = {
                    method: 'GET',
                    headers: format !== 'markdown' ? { "X-Return-Format": format } : {}
                };

                const response = await fetch(`https://r.jina.ai/${url}`, fetchOptions);
                const text = await response.text();

                if (!response.ok) {
                    let errorMessage;
                    try {
                        const errorData = JSON.parse(text);
                        errorMessage = `${errorData.error_type || 'API Error'}: ${errorData.error_message || text}`;
                    } catch {
                        errorMessage = `HTTP ${response.status}: ${response.statusText || 'Request failed'}`;
                    }
                    throw new Error(errorMessage);
                }

                currentContent = text;
                elements.contentRaw.value = text;
                elements.contentRendered.srcdoc = createIframeContent(text, format);
                elements.outputSection.style.display = 'block';
                elements.promptSection.style.display = 'block';

            } catch (error) {
                console.error('Fetch error:', error);
                showError(`Failed to fetch content: ${error.message}`);
            } finally {
                elements.loading.style.display = 'none';
                setLoadingState(false, elements.submitBtn);
            }
        });

        // Copy button handler
        elements.copyBtn.addEventListener('click', () => {
            copyToClipboard(currentContent, elements.copyBtn);
        });

        // Claude API handler
        elements.runPromptBtn.addEventListener('click', async () => {
            const prompt = elements.promptTextarea.value.trim();
            
            if (!prompt || !currentContent) {
                showError('Please enter a prompt and fetch content first.');
                return;
            }

            hideError();
            elements.promptLoading.style.display = 'block';
            elements.promptOutput.style.display = 'none';
            setLoadingState(true, elements.runPromptBtn, 'Analyze Content');

            try {
                const response = await fetch("https://api.anthropic.com/v1/messages", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        model: "claude-sonnet-4-20250514",
                        max_tokens: 4096,
                        messages: [
                            {
                                role: "user",
                                content: `${prompt}\n\nContent to analyze:\n\n${currentContent}`
                            }
                        ]
                    })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error?.message || `API Error: ${response.status}`);
                }

                currentAnalysis = data.content[0].text;
                elements.promptResult.innerHTML = marked.parse(currentAnalysis);
                elements.promptOutput.style.display = 'block';

            } catch (error) {
                console.error('Claude API error:', error);
                showError(`Analysis failed: ${error.message}`);
            } finally {
                elements.promptLoading.style.display = 'none';
                setLoadingState(false, elements.runPromptBtn, 'Analyze Content');
            }
        });

        // Prompt copy button handler
        elements.promptCopyBtn.addEventListener('click', () => {
            copyToClipboard(currentAnalysis, elements.promptCopyBtn);
        });
    </script>
</body>
</html>
